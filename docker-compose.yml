version: '3.9'

# Canonical self-host / local install stack.
#
# Usage:
#   docker compose up --build                 # app + db + redis (the install SKU)
#   docker compose --profile ingestion up     # + Tika / GROBID / OpenSearch
#   docker compose --profile workflow up      # + Temporal
#   docker compose --profile llm up           # + LiteLLM gateway / OPA
#
# The app runs with NODE_ENV=production, so it is bound by the fail-closed boot
# contract: the server EXITS at startup when any required variable is missing,
# rather than booting degraded. Those variables use compose's `${VAR:?...}`
# required-variable syntax (same posture as docker-compose.staging.yml) so
# `docker compose up` stops with the missing name instead of leaving a container
# to crash-loop. Per-variable rationale is on the `app` service below.
#
# Required .env: DB_PASSWORD, APP_SERVICE_DB_PASSWORD, APP_DATABASE_URL,
#   JWT_SECRET, SESSION_SECRET, REFRESH_TOKEN_SECRET, MFA_ENCRYPTION_KEY,
#   AUDIT_HMAC_KEY, AUDIT_HMAC_SECRET, AUDIT_EXPORT_SIGNING_KEY, AUDIT_ATTESTATION_KEY, CONNECTOR_ENCRYPTION_KEY,
#   ANTHROPIC_API_KEY, CONCEPT2CURE_SIGNER_ACCEPT_HMAC, AI_PROVIDER_PLACEMENT_APPROVALS,
#   APP_URL, ALLOWED_ORIGINS, SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_FROM.
# The list is held to deploy-aws.yml's preflight by
# scripts/ci/check-compose-boot-contract.mjs (npm run ci:compose-boot-contract).
# The app speaks plain HTTP on APP_PORT: put a TLS proxy in front of it.
# This stack is single-tenant by default (SEED_DEMO_USER=false): it seeds one
# organization and no publicly-known demo admin. Create your admin user via the
# app's first-run flow or the db:seed:admin script.

services:
  # ---------- Database ----------
  db:
    # pgvector image, not stock postgres: the schema's CSR knowledge tables
    # need `CREATE EXTENSION vector` (migrations/0005), which stock postgres lacks.
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # Required with NO insecure default — compose fails closed if DB_PASSWORD is
      # unset, rather than starting Postgres with a blank superuser password.
      # (Same posture as docker-compose.staging.yml.)
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-concept2cure}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - c2c

  # ---------- Redis (queues + caching) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - c2c

  # ---------- Application ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${APP_PORT:-5000}:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      # sslmode=prefer: encrypt when the server offers TLS, otherwise plaintext.
      # The stock image does not ship TLS-on by default; bind-mount certs and a
      # postgres `command:` to enable ssl=on, then upgrade this to `require`.
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-concept2cure}?sslmode=prefer
      # ── Production boot contract ────────────────────────────────────────────
      # NODE_ENV=production above puts the app under its fail-closed startup
      # assertions. Each variable below is checked at boot; a missing or invalid
      # one is a refusal to start, not a warning. Sources are named so the next
      # person can verify the requirement instead of trusting this comment.
      #
      # Non-superuser runtime role (the RLS enforcement unlock). DATABASE_URL
      # above is the DB owner/superuser — RLS never filters on it, and under
      # RLS_ENFORCE=on the boot posture probe (server/index.ts →
      # assertRlsCatalogPosture) FAILS CLOSED on a superuser / BYPASSRLS runtime
      # role. These previously defaulted to empty alongside RLS_ENFORCE=off,
      # which under NODE_ENV=production is a combination the app refuses to boot
      # on at all. Mint the role once with
      # `APP_SERVICE_DB_PASSWORD=... node scripts/db/install-fresh.mjs`, then set
      #   APP_DATABASE_URL=postgresql://app_service:<pw>@db:5432/concept2cure?sslmode=prefer
      # See .env.example for the full explanation.
      APP_SERVICE_DB_PASSWORD: ${APP_SERVICE_DB_PASSWORD:?APP_SERVICE_DB_PASSWORD must be set (mints/rotates the non-superuser app_service role)}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL must be set to the non-superuser app_service role — RLS_ENFORCE=on refuses to boot on the owner role}
      # Production accepts ONLY the literal `on` — unset, `off`, `shadow` and
      # even truthy aliases (`true`/`1`/`enforce`) all refuse to boot, so the
      # deployed environment can be audited with a plain `grep RLS_ENFORCE=on`
      # (server/db/rlsEnforcement.ts).
      RLS_ENFORCE: ${RLS_ENFORCE:-on}
      REDIS_URL: redis://redis:6379
      # >=32 chars (server/config/environment.ts).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>=32 chars)}
      # Signs sessions in start.sh; unset there means a per-restart ephemeral
      # secret, which silently invalidates every session on every restart.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      # Dedicated refresh-token secret. Required in staging/production, >=32
      # chars, and MUST differ from JWT_SECRET — reusing one secret across both
      # token classes is refused at boot (server/config/environment.ts).
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be set (>=32 chars, must differ from JWT_SECRET)}
      # Encrypts stored MFA TOTP secrets under a dedicated key. Production
      # refuses the JWT-derived fallback: a JWT_SECRET leak must not also
      # decrypt every enrolled authenticator (server/config/environment.ts).
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set (>=32 chars)}
      # Keys the HMAC seal over the tamper-evident audit hash chain (21 CFR
      # Part 11 record authenticity). Missing = boot refusal unless the operator
      # explicitly accepts an unsealed ledger via AUDIT_SEAL_ACCEPT_UNSEALED=true
      # (server/services/audit/auditSealPosture.ts).
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY must be set (>=32 chars)}
      # Signs the audit hash-chain links themselves. A predictable secret lets
      # anyone with the source recompute the chain, defeating the integrity
      # guarantee (server/lib/tamper-proof-audit.ts).
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?AUDIT_HMAC_SECRET must be set}
      # Seals the signed audit export an inspector re-verifies. Production refuses
      # to boot without it, or with it equal to the JWT secret; there is no accept
      # flag (server/services/audit/auditExportKeyPosture.ts).
      AUDIT_EXPORT_SIGNING_KEY: ${AUDIT_EXPORT_SIGNING_KEY:?AUDIT_EXPORT_SIGNING_KEY must be set (>=32 chars, not the JWT secret)}
      # Signs the attestation a departing tenant's export carries
      # (server/services/tenant-export/attestation-report.service.ts, >=32 chars).
      # The server boots without it, and every attestation then fails to sign.
      AUDIT_ATTESTATION_KEY: ${AUDIT_ATTESTATION_KEY:?AUDIT_ATTESTATION_KEY must be set (>=32 chars, distinct from the other audit keys)}
      # AES key for stored third-party connector credentials. Deliberately NOT
      # derived from JWT_SECRET — the two are separate trust domains and the
      # module throws at import in production when it is unset
      # (server/services/connectors/connector-registry.ts).
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:?CONNECTOR_ENCRYPTION_KEY must be set}
      # Drafting runs only on an approved Anthropic model
      # (server/services/ai-governance/approved-models.ts): without this key every
      # Authoring draft is refused and /readyz reports AnA down.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set (regulatory drafting runs only on an approved Anthropic model)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Single-tenant install: do not seed the publicly-known demo admin.
      SEED_DEMO_USER: ${SEED_DEMO_USER:-false}
      # ── Release signing (server/services/signature/signer-mode.ts) ─────────
      # Production refuses to boot without a signer mode. A Compose host has no
      # AWS KMS key unless you give it one, so this stack defaults to the HMAC
      # seal over AUDIT_HMAC_KEY, which production accepts only when the
      # operator records that choice. Set CONCEPT2CURE_SIGNER_ACCEPT_HMAC=true to
      # accept it; or set CONCEPT2CURE_SIGNER_MODE=kms with the KMS key id and
      # region below, and CONCEPT2CURE_SIGNER_ACCEPT_HMAC=false.
      CONCEPT2CURE_SIGNER_MODE: ${CONCEPT2CURE_SIGNER_MODE:-hmac}
      CONCEPT2CURE_SIGNER_ACCEPT_HMAC: ${CONCEPT2CURE_SIGNER_ACCEPT_HMAC:?CONCEPT2CURE_SIGNER_ACCEPT_HMAC must be set (true accepts the HMAC signer; false with CONCEPT2CURE_SIGNER_MODE=kms)}
      CONCEPT2CURE_SIGNER_KMS_KEY_ID: ${CONCEPT2CURE_SIGNER_KMS_KEY_ID:-}
      CONCEPT2CURE_SIGNER_KMS_REGION: ${CONCEPT2CURE_SIGNER_KMS_REGION:-}
      # ── AI data placement (server/services/ai-gateway/sensitive-placement-policy.ts)
      # Production refuses to boot unless the policy enforces and the approvals
      # name each provider that may receive data: its region, the data classes
      # approved and whether zero retention is approved. That is a compliance
      # decision, so there is no default. JSON, e.g.
      #   {"anthropic":{"region":"global","zeroRetentionApproved":false,"approvedDataClasses":[],"approvedIntendedUses":["drafting"]}}
      AI_SENSITIVE_DATA_POLICY_MODE: enforce
      AI_PROVIDER_PLACEMENT_APPROVALS: ${AI_PROVIDER_PLACEMENT_APPROVALS:?AI_PROVIDER_PLACEMENT_APPROVALS must be set (which AI provider may receive which data; a compliance decision)}
      # ── Part 11 audit trail (server/startup/audit-enforcement.ts) ──────────
      # The tamper-proof trail and its integrity monitor run only when enabled,
      # and a missing trail or failed immutability probe refuses boot only when
      # enforced. Terraform's production stack sets both; so does this one.
      AUDIT_TRAIL_ENABLED: 'true'
      AUDIT_REQUIRE_ENFORCE: 'true'
      # ── Public origin ──────────────────────────────────────────────────────
      # Reset and invitation links are built on APP_URL, never on the Host
      # header, and production's CSRF check admits sign-in only from
      # ALLOWED_ORIGINS (server/middleware/enterprise-security.ts). Both are this
      # stack's https address behind your TLS proxy, e.g. https://beta.example.com.
      APP_URL: ${APP_URL:?APP_URL must be set to this stack's public https origin}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set (comma-separated https origins; sign-in is refused from any other)}
      # ── Email (server/services/emailService.ts) ────────────────────────────
      # The emailed login code is the mandatory second factor: without SMTP the
      # server boots but no one can sign in. 465 (implicit TLS) is the default
      # and the only port Terraform's stack accepts; the mailer requires TLS
      # only there. SMTP_FROM must be an address your provider will send from.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set (login codes are emailed; no SMTP, no sign-in)}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS must be set}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set to an address your SMTP provider sends from}
      # ── Vault document storage (server/services/storage/storage-posture.ts) ──
      # Production refuses to boot without a named durable store. This stack
      # keeps vault bytes on the `vaultdata` volume mounted at /app/storage
      # below, which outlives the container, so local disk is accepted. For S3,
      # set STORAGE_PROVIDER=s3 and AWS_S3_BUCKET (with AWS credentials).
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_ACCEPT_LOCAL_DISK: 'true'
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    volumes:
      - vaultdata:/app/storage
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - c2c

  # ---------- Optional: document ingestion (profile: ingestion) ----------
  tika:
    image: apache/tika:2.9.2.1
    ports:
      - '9998:9998'
    restart: unless-stopped
    profiles: ['ingestion']
    networks:
      - c2c

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - '8070:8070'
    restart: unless-stopped
    profiles: ['ingestion']
    networks:
      - c2c

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    restart: unless-stopped
    profiles: ['ingestion']
    networks:
      - c2c

  # ---------- Optional: long-running workflows (profile: workflow) ----------
  temporal-postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    ports:
      - '5434:5432'
    restart: unless-stopped
    profiles: ['workflow']
    networks:
      - c2c

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - '7233:7233'
    depends_on:
      - temporal-postgres
    restart: unless-stopped
    profiles: ['workflow']
    networks:
      - c2c

  # ---------- Optional: LLM gateway + policy engine (profile: llm) ----------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_API_KEY:-}
    ports:
      - '4000:4000'
    command: ['--port', '4000', '--host', '0.0.0.0']
    profiles: ['llm']
    networks:
      - c2c

  opa:
    image: openpolicyagent/opa:latest
    command:
      [
        'run',
        '--server',
        '--set=decision_logs.console=true',
        '/policies',
      ]
    volumes:
      - ./server/policies:/policies:ro
    ports:
      - '8181:8181'
    restart: unless-stopped
    profiles: ['llm']
    networks:
      - c2c

volumes:
  vaultdata:
    driver: local
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  c2c:
    driver: bridge
