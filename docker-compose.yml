version: '3.9'
services:
  vault-api:
    build: .
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
    ports:
      - '4000:4000'
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Lumen Cortex Batch Review Worker
  # Processes queued async review batches
  batch-worker:
    build: .
    command: python scripts/worker/run_batch_worker.py
    environment:
      - BATCH_WORKER_PROGRAM_ID=${BATCH_WORKER_PROGRAM_ID}
      - BATCH_WORKER_ID=${BATCH_WORKER_ID:-batch-worker-1}
      - BATCH_WORKER_POLL_INTERVAL=${BATCH_WORKER_POLL_INTERVAL:-5}
      - BATCH_WORKER_LOG_LEVEL=${BATCH_WORKER_LOG_LEVEL:-INFO}
      - BATCH_WORKER_HEALTH_PORT=8081
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - '8081:8081' # Health endpoint
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

# Optional: Apache Tika for broad document text + metadata extraction
  tika:
    image: apache/tika:2.9.2.1
    ports:
      - '9998:9998'
    restart: unless-stopped
    profiles: ['ingestion-spine']

  # Optional: GROBID for scholarly PDF extraction
  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - '8071:8070'
    restart: unless-stopped
    profiles: ['ingestion-spine']

  # Optional: OpenSearch for hybrid lexical + semantic retrieval
tika:
    image: apache/tika:latest
    ports:
      - '9998:9998'
    profiles: ['session-b']
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - '8070:8070'
    profiles: ['session-b']
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
restart: unless-stopped
    profiles: ['search-spine']

  # Optional: Temporal persistence DB (isolated from app DB)
  temporal-postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    ports:
      - '5434:5432'
    restart: unless-stopped
    profiles: ['workflow-spine']

  # Optional: Temporal workflow server for governed long-running workflows
  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - '7233:7233'
    depends_on:
      - temporal-postgres
    restart: unless-stopped
    profiles: ['workflow-spine']
profiles: ['session-b']
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      - DB=sqlite
    ports:
      - '7233:7233'
    profiles: ['session-b']
    restart: unless-stopped
litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_API_KEY}
    ports:
      - '4000:4000'
    command: [\"--port\", \"4000\", \"--host\", \"0.0.0.0\"]
    profiles: ['session-a']

  opa:
    image: openpolicyagent/opa:latest
    command:
      [
        'run',
        '--server',
        '--set=decision_logs.console=true',
        '/policies',
      ]
    volumes:
      - ./server/policies:/policies:ro
    ports:
      - '8181:8181'
    profiles: ['session-a']
