version: '3.9'
services:
  vault-api:
    build: .
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - '4000:4000'
    restart: always

  # Lumen Cortex Batch Review Worker
  # Processes queued async review batches
  batch-worker:
    build: .
    command: python scripts/worker/run_batch_worker.py
    environment:
      - BATCH_WORKER_PROGRAM_ID=${BATCH_WORKER_PROGRAM_ID}
      - BATCH_WORKER_ID=${BATCH_WORKER_ID:-batch-worker-1}
      - BATCH_WORKER_POLL_INTERVAL=${BATCH_WORKER_POLL_INTERVAL:-5}
      - BATCH_WORKER_LOG_LEVEL=${BATCH_WORKER_LOG_LEVEL:-INFO}
      - BATCH_WORKER_HEALTH_PORT=8081
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - '8081:8081' # Health endpoint
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
