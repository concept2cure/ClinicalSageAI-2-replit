# Risk Vocabulary Configuration — Phase 6.6.C
# Config-driven controlled vocabularies for deterministic SE row scoring.
# Tunable without code edits. Version changes must bump risk_code_map version.
---
version: '1.0.0'

# ── Technology family tokens ──
# Used by Row 2 (Technology) to detect core technology differences.
tech_families:
  energy_ablation:
    - rf
    - radiofrequency
    - laser
    - ultrasound
    - microwave
    - cryo
    - cryotherapy
    - thermal
    - ablation
  imaging_sensing:
    - optical
    - mri
    - ct
    - ecg
    - eeg
    - lidar
    - fluoroscopy
    - x-ray
  drug_delivery:
    - eluting
    - drug-coated
    - infusion
    - pump
    - drug-eluting
  algorithmic:
    - ai
    - ml
    - neural
    - adaptive
    - classifier
    - deep-learning
    - machine-learning

# ── Architecture tokens ──
# Used by Row 2 if no tech family difference detected.
arch_tokens:
  - implant
  - catheter
  - stent
  - screw
  - plate
  - mesh
  - robotic
  - handheld
  - wearable
  - cloud
  - mobile
  - endoscope
  - prosthesis
  - lead
  - electrode

# ── Indication expansion tokens ──
# Presence in subject (but not predicate) indicates expanded indications.
indication_expansion_tokens:
  - pediatric
  - home
  - ambulatory
  - continuous
  - implant
  - long-term
  - permanent
  - emergency
  - critical
  - wireless
  - remote
  - neonatal

# ── Material aliases ──
# Normalize shorthand to canonical material names before comparison.
material_aliases:
  ti: titanium
  ss: stainless steel
  ss316l: stainless steel
  peek: peek
  uhmwpe: uhmwpe
  ptfe: ptfe
  cr-co: cobalt chromium
  crco: cobalt chromium
  nitinol: nitinol
  pe: polyethylene
  hdpe: polyethylene

# ── Sterilization method enum map ──
# Normalize free-text sterilization descriptions to enum values.
sterilization_enum_map:
  eo: eo
  ethylene oxide: eo
  ethylene-oxide: eo
  gamma: gamma
  gamma radiation: gamma
  gamma irradiation: gamma
  ebeam: ebeam
  e-beam: ebeam
  electron beam: ebeam
  steam: steam
  autoclave: steam
  aseptic: aseptic
  aseptic processing: aseptic
  dry heat: dry_heat
  dry_heat: dry_heat
  chemical: chemical
  radiation: radiation_other
  none: none
  'n/a': none

# ── Energy source enum map ──
# Normalize energy source descriptions to enum values.
energy_enum_map:
  electrical: electrical
  electric: electrical
  ac power: electrical
  ac: electrical
  mains: electrical
  battery: battery
  lithium: battery
  rechargeable: battery
  mechanical: mechanical
  spring: mechanical
  pneumatic: pneumatic
  air: pneumatic
  hydraulic: hydraulic
  rf: rf
  radiofrequency: rf
  laser: laser
  ultrasound: ultrasound
  ultrasonic: ultrasound
  thermal: thermal
  heat: thermal
  none: none
  'n/a': none

# ── Tissue contact type enum map ──
# Normalize tissue contact descriptions to enum values.
tissue_contact_enum_map:
  intact skin: intact_skin
  intact_skin: intact_skin
  surface: intact_skin
  skin contact: intact_skin
  skin: intact_skin
  breached skin: breached_skin
  breached_skin: breached_skin
  wound: breached_skin
  blood: blood_path
  blood contact: blood_path
  blood path: blood_path
  blood_path: blood_path
  circulating blood: blood_path
  tissue: tissue_bone
  bone: tissue_bone
  tissue/bone: tissue_bone
  tissue_bone: tissue_bone
  implant: tissue_bone
  soft tissue: tissue_soft
  tissue_soft: tissue_soft
  mucous membrane: mucosal
  mucosal: mucosal
  mucosa: mucosal
  csf: csf
  cerebrospinal: csf
  dental: dental

# ── Contact duration enum map ──
# Normalize contact duration descriptions to enum values.
duration_enum_map:
  limited: limited
  transient: limited
  short-term: limited
  short term: limited
  '<24h': limited
  prolonged: prolonged
  extended: prolonged
  '24h-30d': prolonged
  long-term: prolonged
  permanent: permanent
  long term implant: permanent
  '>30d': permanent
