# Shadow Interrogation Service
# Adversarial AI simulation for regulatory IR prediction

# Python version
python_requires = ">=3.11"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-service"
version = "0.1.0"
description = "Shadow Interrogation Service - Adversarial AI for regulatory IR prediction"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Concept2Cure", email = "engineering@concept2cure.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.42.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pgvector>=0.2.4",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
openai = [
    "openai>=1.10.0",
]

[project.scripts]
shadow-service = "shadow_service.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadow_service*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db_required: marks tests as requiring database connection",
    "integration: marks tests as integration tests requiring database",
]
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
