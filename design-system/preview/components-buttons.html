<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row3 { display:flex; gap: 12px; align-items:center; flex-wrap: wrap; padding: 8px 0; }
button { font-family: var(--font-sans); font-size: 13px; font-weight: 500; border-radius: var(--radius-lg); border: 1px solid transparent; cursor: pointer; padding: 8px 14px; line-height: 1.2; transition: all 200ms var(--ease); }
button.primary { background: var(--accent-main-100); color: #fff; }
button.primary:hover { background: var(--accent-main-200); }
button.secondary { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
button.ghost { background: transparent; color: var(--ink); }
button.ghost:hover { background: var(--bg-200); }
button.icon { width: 32px; height: 32px; padding: 0; display:inline-flex; align-items:center; justify-content:center; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); }
button.icon:hover { background: var(--bg-200); color: var(--ink); }
button.destructive { background: #141413; color: #fff; }
button.send { width: 32px; height: 32px; padding: 0; border-radius: 9999px; background: var(--accent-main-100); color: #fff; display:inline-flex; align-items:center; justify-content:center; }
.lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-subtle); min-width: 96px; }
</style></head><body><div class="card">
  <div class="row3"><div class="lbl">Primary</div>
    <button class="primary">Send message</button>
    <button class="primary" style="background: var(--accent-main-200)">Pressed</button>
    <button class="primary" disabled style="opacity:0.5; cursor:not-allowed">Disabled</button>
  </div>
  <div class="row3"><div class="lbl">Secondary</div>
    <button class="secondary">Cancel</button>
    <button class="ghost">View all</button>
    <button class="destructive">Delete chat</button>
  </div>
  <div class="row3"><div class="lbl">Icon · 32px</div>
    <button class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <button class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
    <button class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button class="send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
  </div>
</div></body></html>
