<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card2 {
  background: white; border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 16px;
  box-shadow: var(--shadow-xs);
  transition: all 200ms var(--ease);
}
.card2:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.ttl { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--ink); }
.sub { font-size: 12px; color: var(--ink-muted); margin-top: 4px; line-height: 1.5; }
.meta { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-subtle); margin-top: 12px; font-weight: 500; }
.row { display:flex; justify-content:space-between; align-items: flex-start; }
.chip { display:inline-flex; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 500; background: var(--success-muted); color: #4e6638; letter-spacing: 0.02em;}
</style></head><body><div class="card">
  <div class="grid2">
    <div class="card2">
      <div class="row"><div class="ttl">Section 2.5 — clinical overview</div><div class="chip">Ready</div></div>
      <div class="sub">Module 2 · CTD · NDA 212345 · last edited by J. Chen 4 min ago</div>
      <div class="meta">Updated · 21 Apr 2026</div>
    </div>
    <div class="card2">
      <div class="row"><div class="ttl">510(k) precedent search</div><div class="chip" style="background: var(--warning-muted); color: #8a4b0c">In review</div></div>
      <div class="sub">12 predicates found across FDA 2019–2024 · 3 clearances pending review</div>
      <div class="meta">AnA · 10 sources cited</div>
    </div>
  </div>
</div></body></html>
