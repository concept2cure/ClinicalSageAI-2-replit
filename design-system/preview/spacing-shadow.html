<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.wrap { display:grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding-top:10px; }
.card2 { background: white; border-radius: 12px; padding: 16px; min-height: 80px; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; }
.lbl { font-size: 10px; font-family: var(--font-mono); color: var(--ink-subtle); }
.val { font-size: 11px; color: var(--ink); font-weight:500; }
.xs { box-shadow: 0 1px 2px 0 rgb(20 20 19 / 0.03); }
.sm { box-shadow: 0 1px 3px 0 rgb(20 20 19 / 0.05), 0 1px 2px -1px rgb(20 20 19 / 0.05); }
.md { box-shadow: 0 4px 6px -1px rgb(20 20 19 / 0.05), 0 2px 4px -2px rgb(20 20 19 / 0.05); }
.lg { box-shadow: 0 10px 15px -3px rgb(20 20 19 / 0.05), 0 4px 6px -4px rgb(20 20 19 / 0.05); }
</style></head><body><div class="card">
  <div class="wrap">
    <div class="card2 xs"><div class="val">xs</div><div class="lbl">resting card</div></div>
    <div class="card2 sm"><div class="val">sm</div><div class="lbl">hover / popover</div></div>
    <div class="card2 md"><div class="val">md</div><div class="lbl">menu / tooltip</div></div>
    <div class="card2 lg"><div class="val">lg</div><div class="lbl">dialog / overlay</div></div>
  </div>
</div></body></html>
