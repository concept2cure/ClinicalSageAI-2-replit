<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.scale { display:grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
.st { aspect-ratio: 1/1.1; border-radius: 6px; position:relative; border:1px solid var(--border-subtle); }
.st .n { position:absolute; bottom:4px; left:6px; font-size:9px; font-family: var(--font-mono); }
.st.light .n { color: var(--ink); }
.st.dark .n { color: white; }
.title { font-size: 11px; color: var(--ink-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
</style></head><body><div class="card">
  <div class="title">Stone — neutral scale</div>
  <div class="scale">
    <div class="st light" style="background:#ffffff"><div class="n">0</div></div>
    <div class="st light" style="background:#faf9f5"><div class="n">50</div></div>
    <div class="st light" style="background:#f4f3ee"><div class="n">100</div></div>
    <div class="st light" style="background:#ededea"><div class="n">150</div></div>
    <div class="st light" style="background:#e8e6dc"><div class="n">200</div></div>
    <div class="st light" style="background:#d6d3c8"><div class="n">300</div></div>
    <div class="st light" style="background:#b0aea5"><div class="n">400</div></div>
    <div class="st dark"  style="background:#8a8880"><div class="n">500</div></div>
    <div class="st dark"  style="background:#6b6963"><div class="n">600</div></div>
    <div class="st dark"  style="background:#4a4a46"><div class="n">700</div></div>
    <div class="st dark"  style="background:#292524"><div class="n">800</div></div>
  </div>
</div></body></html>
