# Version-update pull requests are OFF (open-pull-requests-limit: 0).
#
# Each one is a branch, and concept2cure-v2 is the only branch (CLAUDE.md
# Rule 0, .github/BRANCH_LOCK.md). On 2026-09-25 ten dependabot/* branches
# stood open beside it; the seven non-breaking bumps were applied directly on
# concept2cure-v2 and the three majors (i18next 26, nanoid 6, recharts 3)
# were closed for a deliberate upgrade on concept2cure-v2 itself.
#
# Updates now land directly on concept2cure-v2 (`npm install --save pkg@ver`,
# lockfile regenerated by npm, typecheck and tests run). Dependabot ALERTS
# still report vulnerable dependencies; they open no branch. This file does
# not govern Dependabot SECURITY updates, which are a repository setting and
# would open a branch per fix if enabled there.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # TypeScript majors are held until the lint toolchain can follow.
      #
      # On 2026-08-13 a bump to 7.0.2 (1b3c154) took out BOTH CI gates that
      # read the TypeScript source, and nobody noticed for a week:
      #   - TS 7 removed `baseUrl` and `moduleResolution: node10`, so
      #     `tsc -p tsconfig.json` rejected the config and checked ZERO files
      #     while still printing "error TS" lines the CI gate read as ordinary
      #     type errors (see scripts/ci/typecheck-no-regression.mjs).
      #   - No typescript-eslint release supports TS 7 — its peer range is
      #     `>=4.8.4 <6.1.0` — so `npm run lint` (ci.yml) crashed outright.
      #
      # A dev-dependency major that silently disables the checks protecting
      # every other dependency bump is not a routine update. LIFT THIS once
      # typescript-eslint declares TS 7 support in its peerDependencies; the
      # tsconfig is already TS 7-ready, so that is the only blocker left.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
