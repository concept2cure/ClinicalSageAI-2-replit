name: Semgrep

on:
  push:
    branches: ['concept2cure-v2', 'main', 'master']
  pull_request:
    branches: ['concept2cure-v2', 'main', 'master']
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Analyze (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory, not blocking. This scan was previously dead (wrong branch
    # filter + an invalid image tag + `--config=auto` with `--metrics=off`,
    # which is a hard error). Now that it runs on the canonical branch, keep
    # it non-blocking so pre-existing repo-wide findings surface in the
    # Security tab without gating every PR. Ratchet to blocking once the
    # backlog is triaged.
    continue-on-error: true
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep_scan
        run: |
          set +e
          # A named ruleset (not `auto`) so it works with metrics disabled —
          # `--config=auto` requires metrics to be on. Do not pass `--error`:
          # findings are reported via SARIF, they do not fail the run.
          semgrep scan \
            --config=p/default \
            --metrics=off \
            --sarif \
            --output=semgrep.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # Guarantee a SARIF file exists so the upload steps never hard-fail.
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > semgrep.sarif
          fi
          exit 0

      - name: Upload Semgrep SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
