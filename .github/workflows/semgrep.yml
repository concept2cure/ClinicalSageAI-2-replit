name: Semgrep

on:
  push:
    branches: ['concept2cure-V2', 'main', 'master']
  pull_request:
    branches: ['concept2cure-V2', 'main', 'master']
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Analyze (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep_scan
        run: |
          set +e
          semgrep scan \
            --config=auto \
            --metrics=off \
            --sarif \
            --output=semgrep.sarif \
            --error
          scan_exit_code=$?
          echo "exit_code=${scan_exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error

      - name: Fail job on Semgrep findings
        if: steps.semgrep_scan.outputs.exit_code != '0'
        run: |
          echo "Semgrep detected findings (exit code ${{ steps.semgrep_scan.outputs.exit_code }})."
          exit 1
