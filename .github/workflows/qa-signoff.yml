name: QA Signoff Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-qa-signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run QA signoff script
        run: |
          python3 scripts/check_qa_signoff.py
