name: Ops Audit Plan

on:
  pull_request:
    paths:
      - 'scripts/audits/**'
      - 'tests/ops/**'
      - 'package.json'
      - '.github/workflows/ops-audit-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # generate-last-pr-wiring-audit.mjs runs
          # `git log --merges -n 20` to enumerate the last 20 merged PRs.
          # The default shallow checkout (depth 1) returns no merge
          # commits, so the audit step exits 1 with "No merged pull
          # requests found." Fetch full history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ops audit unit tests
        run: npm run test:ops-audits

      - name: Execute strict audit plan
        run: npm run audit:last-20-prs:plan:strict

      - name: Dry-run prune generated artifacts
        run: npm run audit:prune-artifacts -- --dry-run

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-audit-reports
          path: |
            docs/audits/LAST_*_PRS_WIRING_AUDIT_*.md
            docs/audits/LAST_*_PRS_BUILD_PLAN_EXECUTION_*.md
            docs/audits/LAST_*_PRS_BUILD_PLAN_EXECUTION_*.json
          if-no-files-found: warn
