name: 'Nightly Contradiction Scan'

on:
  schedule:
    # Run at 3:00 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      program_id:
        description: 'Optional single program UUID to scan'
        required: false
      max_programs:
        description: 'Optional cap on number of programs to scan'
        required: false
      dry_run:
        description: 'Dry run (log only, no scans)'
        required: false
        default: 'false'

concurrency:
  group: nightly-contradiction-scan
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: shadow_service

jobs:
  nightly-scan:
    name: 'A8 Nightly Contradiction Scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REVIEW_ADMIN_TOKEN: ${{ secrets.REVIEW_ADMIN_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install asyncpg pydantic

      - name: Run nightly scans
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          MAX_PROGRAMS: ${{ inputs.max_programs }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python -m shadow_service.nightly_scan

      - name: Summary
        if: always()
        run: |
          echo "### 🛡️ Nightly Contradiction Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Time: \`$(date -u)\`" >> $GITHUB_STEP_SUMMARY
