name: Test Assembly CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'db/migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run unit + route tests
        run: npx vitest run --run
      - name: Check assembly_docs table (optional)
        if: ${{ secrets.TEST_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/check_assembly_docs.mjs
      - name: E2E smoke test (optional)
        if: ${{ secrets.TEST_DATABASE_URL != '' }}
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/e2e_smoke_assembly.mjs
