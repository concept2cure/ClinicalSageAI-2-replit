name: Test Assembly CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'db/migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest

    # `secrets` cannot be referenced from a step-level `if:` (it raises
    # "Unrecognized named-value: 'secrets'" and fails the workflow at
    # startup). Surfacing presence through a job-level `env` — which CAN
    # read `secrets` — lets the optional DB steps gate on `env` instead.
    env:
      HAS_TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL != '' }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run unit + route tests
        run: npx vitest run --run
      - name: Check assembly_docs table (optional)
        if: ${{ env.HAS_TEST_DATABASE_URL == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/check_assembly_docs.mjs
      - name: E2E smoke test (optional)
        if: ${{ env.HAS_TEST_DATABASE_URL == 'true' }}
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/e2e_smoke_assembly.mjs
