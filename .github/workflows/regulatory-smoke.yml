name: ECTD 4.0 Regulatory Compliance

on:
  push:
    branches: [main]
    paths:
      - 'ind_automation/**'
      - 'server/**'
  pull_request:
    branches: [main]

jobs:
  ectd4-compliance:
    name: eCTD 4.0 Compliance Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest python-docx lxml defusedxml rsa requests cryptography boto3 pyasn1 pyasn1-modules

      - name: Run eCTD 4.0 Compliance Tests
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}" \
          python -m pytest ind_automation/tests/test_ectd4_compiler.py -v \
          --tb=short --strict-markers

      - name: Test Digital Signatures
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}" python - <<'PY'
          from ind_automation.signatures.pki_signer import Part11Signature
          from ind_automation.compilers.ectd4_compiler import ECTD4Compiler

          # Minimal sample document generation
          class MockCanvas:
              def __init__(self):
                  self.study_id = 'CI-TEST'
                  self.module = '2.6.2'
                  self.section = 'Pharmacokinetics'
                  self.subsection = None
                  self.language = 'en'
                  self.created_at = '2026-01-01T00:00:00Z'
                  self.content_blocks = [{'text':'CI test', 'sdt_tag': 'ci'}]
                  self.events = []

          compiler = ECTD4Compiler(output_dir='./test-artifacts')
          canvas = MockCanvas()
          doc = compiler.compile(canvas)
          docx = compiler.generate_docx(doc, canvas)

          signer = Part11Signature()
          signed = signer.sign_document(docx, {'name': 'CI', 'role': 'QA'})
          result = signer.verify_signature(signed)
          assert result['valid'], f"Signature verification failed: {result}"
          print('✅ Digital signature verification passed')
          PY

      - name: Validate XMP Schema Compliance
        run: |
          python scripts/validate_ectd4_xmp.py \
            --test-output ./test-artifacts

      - name: Validate FHIR AuditEvent Structure
        run: |
          python scripts/validate_fhir_audit.py \
            --backbone ./test-artifacts/ectd.json

      - name: Check No Legacy 3.2.2 Artifacts
        run: |
          # Scan GENERATED output for forbidden legacy eCTD 3.2.2 patterns.
          # We check the build artifacts (reality), not source code (vibes).
          LEGACY=0
          # 1. Legacy m2-* module filenames in output
          if find ./test-artifacts -name "m2-*" 2>/dev/null | grep -q .; then
            echo "❌ Legacy eCTD 3.2.2 m2-* filenames found in output"
            find ./test-artifacts -name "m2-*"
            LEGACY=1
          fi
          # 2. Old-style regional.xml (3.2.2 uses this, 4.0 uses us-regional.xml or JSON)
          if find ./test-artifacts -name "regional.xml" -not -name "us-regional.xml" 2>/dev/null | grep -q .; then
            echo "❌ Legacy regional.xml found (expected us-regional.xml or JSON)"
            LEGACY=1
          fi
          # 3. eCTD backbone as XML instead of JSON (3.2.2 = XML, 4.0 = JSON)
          if find ./test-artifacts -name "ectd.xml" 2>/dev/null | grep -q .; then
            echo "❌ Legacy ectd.xml backbone found (expected ectd.json)"
            LEGACY=1
          fi
          if [ "$LEGACY" -eq 1 ]; then exit 1; fi
          echo "✅ No legacy 3.2.2 artifacts in generated output"

  integration-smoke:
    name: End-to-End Document Generation
    runs-on: ubuntu-latest
    needs: ectd4-compliance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & Node
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install deps
        run: |
          cd ind_automation && pip install -r requirements.txt && pip install pytest python-docx lxml defusedxml rsa requests cryptography boto3 pyasn1 pyasn1-modules
          cd ../server && npm install

      - name: Generate Test IND Document (eCTD 4.0)
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}" \
          python scripts/generate-ectd4-sample.py \
            --module 2.6.2 \
            --output ./test-artifacts

      - name: Validate eCTD.json Structure
        run: |
          python -c "
          import json
          with open('./test-artifacts/ectd.json') as f:
              backbone = json.load(f)
              assert backbone['ectdVersion'] == '4.0'
              assert len(backbone['documents']) > 0
              doc = backbone['documents'][0]
              assert 'modificationHistory' in doc
              assert doc['modificationHistory'][0]['resourceType'] == 'AuditEvent'
          "

      - name: Upload Regulatory Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ectd4-documents
          path: |
            test-artifacts/*.docx
            test-artifacts/*.json
            test-artifacts/*.xmp
          retention-days: 30
