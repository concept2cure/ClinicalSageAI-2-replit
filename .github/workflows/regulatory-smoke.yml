name: ECTD 4.0 Regulatory Compliance

on:
  push:
    branches: [main]
    paths:
      - 'ind_automation/**'
      - 'server/**'
  pull_request:
    branches: [main]

jobs:
  ectd4-compliance:
    name: eCTD 4.0 Compliance Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install pytest python-docx lxml defusedxml
      
      - name: Run eCTD 4.0 Compliance Tests
        run: |
          PYTHONPATH=/workspaces/ClinicalSageAI-2-replit/ \
          python -m pytest ind_automation/tests/test_ectd4_compiler.py -v \
          --tb=short --strict-markers
      
      - name: Validate XMP Schema Compliance
        run: |
          python scripts/validate_ectd4_xmp.py \
            --schema schemas/ectd4-xmp-schema.xsd \
            --test-output ./test-artifacts
      
      - name: Validate FHIR AuditEvent Structure
        run: |
          python scripts/validate_fhir_audit.py \
            --backbone ./test-artifacts/ectd.json
      
      - name: Check No Legacy 3.2.2 Artifacts
        run: |
          # Fail if anyone accidentally commits m2- filenames or index.xml
          if grep -r "m2-[0-9]" ind_automation/ --include="*.py" || \
             grep -r "index\.xml" ind_automation/ --include="*.py"; then
            echo "❌ Legacy eCTD 3.2.2 artifacts detected in main branch"
            exit 1
          fi
          echo "✅ No legacy 3.2.2 code detected"

  integration-smoke:
    name: End-to-End Document Generation
    runs-on: ubuntu-latest
    needs: ectd4-compliance
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python & Node
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      
      - name: Install deps
        run: |
          cd ind_automation && pip install -e .
          cd ../server && npm ci
      
      - name: Generate Test IND Document (eCTD 4.0)
        run: |
          python scripts/generate-ectd4-sample.py \
            --module 2.6.2 \
            --output ./test-artifacts
      
      - name: Validate eCTD.json Structure
        run: |
          python -c "
          import json
          with open('./test-artifacts/ectd.json') as f:
              backbone = json.load(f)
              assert backbone['ectdVersion'] == '4.0'
              assert len(backbone['documents']) > 0
              doc = backbone['documents'][0]
              assert 'modificationHistory' in doc
              assert doc['modificationHistory'][0]['resourceType'] == 'AuditEvent'
          "
      
      - name: Upload Regulatory Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ectd4-documents
          path: |
            test-artifacts/*.docx
            test-artifacts/*.json
            test-artifacts/*.xmp
          retention-days: 30
