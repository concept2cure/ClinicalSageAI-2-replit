name: Neon PR Preview DB + Schema Validation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview_db_test:
    # Opt-in only. Each run creates, tests and deletes its own isolated schema branch.
    if: github.event.action != 'closed' && vars.NEON_PROJECT_ID != '' && vars.NEON_PREVIEW_ENABLED == 'true' && vars.NEON_SAFE_PARENT_BRANCH != ''
    runs-on: ubuntu-latest
    # Posts a preview-DB status comment on the PR (github-script createComment).
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check Neon API key
        id: check_secrets
        run: |
          if [ -z "${{ secrets.NEON_API_KEY }}" ]; then
            echo "::error::NEON_API_KEY absent while Neon preview was explicitly enabled; no database verification ran"
            exit 1
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Choose Neon branch name (safe + stable)
        if: steps.check_secrets.outputs.skip != 'true'
        id: names
        run: echo "branch=preview/pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Bound ephemeral PR validation branch lifetime to one day
        if: steps.check_secrets.outputs.skip != 'true'
        id: expiry
        run: echo "expires_at=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch for this PR
        if: steps.check_secrets.outputs.skip != 'true'
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.names.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # An explicit non-production parent is required; do not copy the
          # project's default or production branch into a PR environment.
          parent_branch: ${{ vars.NEON_SAFE_PARENT_BRANCH }}
          # Do not clone patient/client records into PR preview environments.
          branch_type: schema-only
          # A one-day server-side expiration survives runner loss or cancelled
          # workflows. PR checks must not retain a long-lived database.
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Require a freshly created PR validation branch
        if: steps.check_secrets.outputs.skip != 'true'
        run: |
          if [[ "${{ steps.neon.outputs.created }}" != "true" || -z "${{ steps.neon.outputs.branch_id }}" ]]; then
            echo "::error::Neon did not confirm a fresh isolated PR branch; refusing migration"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check_secrets.outputs.skip != 'true'
        with:
          # Full history: this job diffs against the PR's base twice — to pick
          # the migrations to apply, and to scan them for destructive patterns.
          # The default depth of 1 leaves no merge base, which the apply step
          # worked around with a --depth=200 fetch and the destructive-pattern
          # check did not work around at all.
          fetch-depth: 0

      - name: Install psql client
        if: steps.check_secrets.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Resolve direct Neon DATABASE_URL
        if: steps.check_secrets.outputs.skip != 'true'
        id: db_url
        env:
          DIRECT_DB_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          DB_URL="$DIRECT_DB_URL"
          if [ -z "$DB_URL" ]; then
            echo "::error::Neon did not supply a direct DB URL; migrations must not use a pooler"
            exit 1
          fi
          # The Neon direct endpoint has no -pooler suffix. Session/DDL work
          # via the pooler can appear to pass on the wrong connection.
          if [[ "$DB_URL" == *-pooler.* ]]; then
            echo "::error::Migration target is a pooled Neon endpoint; refusing DDL"
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          echo "skip_db=false" >> "$GITHUB_OUTPUT"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Apply migrations + verify schema
        if: steps.check_secrets.outputs.skip != 'true' && steps.db_url.outputs.skip_db != 'true'
        run: |
          # The schema-only Neon preview inherits the explicitly approved
          # non-production parent's SCHEMA (no client data).
          # Running `scripts/db_migrate.sh` here would re-apply all ~166
          # migrations from scratch — most aren't idempotent, so the
          # whole step fails on something like a duplicate CREATE TABLE.
          #
          # The workflow's stated purpose is "verify the PR's migrations
          # parse + apply cleanly on top of prod schema". Limit the run
          # to migrations added in this PR's diff (relative to the merge
          # base with the base branch).
          set -e
          # `actions/checkout@v4` defaults to a shallow clone with no
          # merge-base history. Fetch enough of the base branch to
          # resolve a merge-base, with a fallback to GitHub's recorded
          # pull_request.base.sha when fetch-then-merge-base still
          # comes up empty (rare edge case on first-PR-after-rebase).
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          BASE_SHA_HINT="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=200 origin "$BASE_REF" 2>/dev/null || true
          BASE_SHA=$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          if [ -z "$BASE_SHA" ] && [ -n "$BASE_SHA_HINT" ]; then
            BASE_SHA="$BASE_SHA_HINT"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::error::No PR merge-base can be resolved; migration verification did not run"
            exit 1
          fi
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- 'db/migrations/*.sql' 'migrations/*.sql' | sort)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "::notice::No new migrations introduced by this PR."
          else
            echo "Applying new migrations:"
            for m in $NEW_MIGRATIONS; do echo "  - $m"; done
            for m in $NEW_MIGRATIONS; do
              echo "==> $m"
              PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$m"
            done
          fi

          # Optional post-migration schema verifier. Guarded because
          # scripts/db_verify.sql is referenced by the workflow but was
          # never authored.
          if [ -f scripts/db_verify.sql ]; then
            psql "$DATABASE_URL" -f scripts/db_verify.sql
          else
            echo "::notice::scripts/db_verify.sql not present; skipping post-migration schema verification."
          fi

      - name: Check for destructive migration patterns
        if: steps.check_secrets.outputs.skip != 'true'
        env:
          # The script used to hardcode `origin/main`, which does not exist in
          # this repo — git aborted, the pipeline's status came from grep, and
          # `|| true` turned it into "✅ No migration files changed in this PR."
          # on every run. Hand it the real base instead of letting it guess.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x scripts/check_no_destructive_migrations.sh
          bash scripts/check_no_destructive_migrations.sh

      - name: Run database compliance checks
        if: steps.check_secrets.outputs.skip != 'true' && steps.db_url.outputs.skip_db != 'true'
        run: |
          # Optional compliance probe. Same documented-but-never-authored
          # pattern as scripts/db_verify.sql — guard the call so the
          # workflow degrades gracefully when the script isn't present
          # instead of failing the whole job with `psql: file not found`.
          if [ -f scripts/db_compliance_check.sql ]; then
            echo "Running compliance checks (immutability triggers, RLS, etc.)..."
            psql "$DATABASE_URL" -f scripts/db_compliance_check.sql
          else
            echo "::notice::scripts/db_compliance_check.sql not present; skipping compliance probe."
          fi

      - name: Setup Node.js
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Node deps + run server tests
        if: steps.check_secrets.outputs.skip != 'true' && steps.db_url.outputs.skip_db != 'true'
        # npm ci installs what package-lock.json pins; npm install re-resolved
        # it (security audit 2026-09-24 INF-24). .npmrc carries legacy-peer-deps.
        run: |
          npm ci
          npm run codespaces:doctor:test

      - name: Verify preview's live schema inventory (baseline no-regression)
        if: steps.check_secrets.outputs.skip != 'true' && steps.db_url.outputs.skip_db != 'true'
        # Read-only: a schema-only copy must still contain the app's baseline
        # tables. This is NOT full RLS or governed authoring qualification.
        run: npm run ci:tables-live-schema

      - name: Delete exactly this run's PR validation branch
        id: delete
        # Always attempt cleanup after validation, including failures.
        # The branch is unique to this run; never delete by a reusable PR name.
        if: always() && steps.neon.outputs.created == 'true' && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Post PR comment with preview DB info
        if: success() && steps.delete.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const branch = '${{ steps.names.outputs.branch }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              // Only claim what this job actually ran. The schema verifier
              // (scripts/db_verify.sql) was never authored, so its step is a
              // guarded no-op — a comment asserting "verification passed" was
              // reporting a check that did not happen.
              body: `🗄️ **Neon PR Schema Validation — Branch Deleted**\n\nBranch: \`${branch}\`\n\n✅ Newly added migration files applied (or none added)\n✅ Codespaces/Neon policy tests and live schema inventory completed (baseline no-regression)\n\n_This is not full database provisioning, RLS or regulatory qualification. The ephemeral branch was deleted before this result was posted._`
            });

