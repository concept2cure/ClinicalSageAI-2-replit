name: Neon PR Preview DB + Schema Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview_db_test:
    # Skip if Neon secrets not configured or PR closed
    if: github.event.action != 'closed' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # Posts a preview-DB status comment on the PR (github-script createComment).
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check Neon API key
        id: check_secrets
        run: |
          if [ -z "${{ secrets.NEON_API_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ NEON_API_KEY not configured, skipping preview DB"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Choose Neon branch name (safe + stable)
        if: steps.check_secrets.outputs.skip != 'true'
        id: names
        run: echo "branch=preview/pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Create Neon branch for this PR
        if: steps.check_secrets.outputs.skip != 'true'
        id: neon
        continue-on-error: true
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.names.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # Optional for schema-only (no sensitive data):
          # parent_branch: prod-v1-schema
          # role: neondb_owner

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check_secrets.outputs.skip != 'true'
        with:
          # Full history: this job diffs against the PR's base twice — to pick
          # the migrations to apply, and to scan them for destructive patterns.
          # The default depth of 1 leaves no merge base, which the apply step
          # worked around with a --depth=200 fetch and the destructive-pattern
          # check did not work around at all.
          fetch-depth: 0

      - name: Install psql client
        if: steps.check_secrets.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Resolve Neon DATABASE_URL
        if: steps.check_secrets.outputs.skip != 'true'
        id: db_url
        run: |
          DB_URL='${{ steps.neon.outputs.db_url }}'
          if [ -z "$DB_URL" ]; then
            DB_URL='${{ steps.neon.outputs.db_url_pooled }}'
          fi
          if [ -z "$DB_URL" ]; then
            DB_URL='${{ steps.neon.outputs.db_url_with_pooler }}'
          fi

          if [ -z "$DB_URL" ]; then
            echo "skip_db=true" >> $GITHUB_OUTPUT
            echo "⚠️ Neon preview DB URL unavailable; skipping DB validation steps"
          else
            echo "skip_db=false" >> $GITHUB_OUTPUT
            echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV
          fi

      - name: Apply migrations + verify schema
        if: steps.check_secrets.outputs.skip != 'true' && steps.db_url.outputs.skip_db != 'true'
        run: |
          # The Neon preview branch inherits from the project's default
          # parent (which already has the full migration history applied).
          # Running `scripts/db_migrate.sh` here would re-apply all ~166
          # migrations from scratch — most aren't idempotent, so the
          # whole step fails on something like a duplicate CREATE TABLE.
          #
          # The workflow's stated purpose is "verify the PR's migrations
          # parse + apply cleanly on top of prod schema". Limit the run
          # to migrations added in this PR's diff (relative to the merge
          # base with the base branch).
          set -e
          # `actions/checkout@v4` defaults to a shallow clone with no
          # merge-base history. Fetch enough of the base branch to
          # resolve a merge-base, with a fallback to GitHub's recorded
          # pull_request.base.sha when fetch-then-merge-base still
          # comes up empty (rare edge case on first-PR-after-rebase).
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          BASE_SHA_HINT="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=200 origin "$BASE_REF" 2>/dev/null || true
          BASE_SHA=$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          if [ -z "$BASE_SHA" ] && [ -n "$BASE_SHA_HINT" ]; then
            BASE_SHA="$BASE_SHA_HINT"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::notice::No merge-base resolvable; skipping migration apply."
            exit 0
          fi
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- 'db/migrations/*.sql' 'migrations/*.sql' | sort)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "::notice::No new migrations introduced by this PR."
          else
            echo "Applying new migrations:"
            for m in $NEW_MIGRATIONS; do echo "  - $m"; done
            for m in $NEW_MIGRATIONS; do
              echo "==> $m"
              PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$m"
            done
          fi

          # Optional post-migration schema verifier. Guarded because
          # scripts/db_verify.sql is referenced by the workflow but was
          # never authored.
          if [ -f scripts/db_verify.sql ]; then
            psql "$DATABASE_URL" -f scripts/db_verify.sql
          else
            echo "::notice::scripts/db_verify.sql not present; skipping post-migration schema verification."
          fi

      - name: Check for destructive migration patterns
        if: steps.check_secrets.outputs.skip != 'true'
        env:
          # The script used to hardcode `origin/main`, which does not exist in
          # this repo — git aborted, the pipeline's status came from grep, and
          # `|| true` turned it into "✅ No migration files changed in this PR."
          # on every run. Hand it the real base instead of letting it guess.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x scripts/check_no_destructive_migrations.sh
          bash scripts/check_no_destructive_migrations.sh

      - name: Run database compliance checks
        if: steps.check_secrets.outputs.skip != 'true' && steps.db_url.outputs.skip_db != 'true'
        run: |
          # Optional compliance probe. Same documented-but-never-authored
          # pattern as scripts/db_verify.sql — guard the call so the
          # workflow degrades gracefully when the script isn't present
          # instead of failing the whole job with `psql: file not found`.
          if [ -f scripts/db_compliance_check.sql ]; then
            echo "Running compliance checks (immutability triggers, RLS, etc.)..."
            psql "$DATABASE_URL" -f scripts/db_compliance_check.sql
          else
            echo "::notice::scripts/db_compliance_check.sql not present; skipping compliance probe."
          fi

      - name: Setup Node.js
        if: steps.check_secrets.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Node deps + run server tests
        if: steps.check_secrets.outputs.skip != 'true' && steps.db_url.outputs.skip_db != 'true'
        run: |
          npm install
          npm run test:unit --if-present

      - name: Post PR comment with preview DB info
        if: success() && steps.check_secrets.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const branch = '${{ steps.names.outputs.branch }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              // Only claim what this job actually ran. The schema verifier
              // (scripts/db_verify.sql) was never authored, so its step is a
              // guarded no-op — a comment asserting "verification passed" was
              // reporting a check that did not happen.
              body: `🗄️ **Neon Preview DB Created**\n\nBranch: \`${branch}\`\n\n✅ Migrations applied successfully\n✅ Tests completed\n\n_This branch will be automatically deleted when the PR is closed._`
            });

  cleanup_preview_db:
    if: github.event.action == 'closed' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # Posts a cleanup-confirmation comment on the PR (github-script createComment).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Delete Neon branch for this PR
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        continue-on-error: true # Don't fail if branch doesn't exist
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Post cleanup confirmation
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧹 **Neon Preview DB Cleaned Up**\n\nThe preview database branch \`preview/pr-${{ github.event.pull_request.number }}\` has been deleted.`
            });
