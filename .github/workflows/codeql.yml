name: CodeQL

on:
  push:
    branches: ['concept2cure-v2', 'main', 'master']
  pull_request:
    branches: ['concept2cure-v2', 'main', 'master']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  # A newer push must NOT cancel this commit's analysis on the canonical branch.
  #
  # config/release-evidence-policy.v1.json lists "CodeQL / Analyze (CodeQL
  # javascript-typescript)" and "… (CodeQL python)" among the jobs a release
  # candidate REQUIRES, and ci.yml's assemble-release-evidence job reads that
  # conclusion from the CodeQL run at this exact SHA. A group keyed only on the
  # ref meant every push superseded the previous commit's analysis: over the
  # seventeen hours to 2026-09-06T01:04Z, 74 of the last 100 canonical-branch
  # CodeQL runs ended `cancelled`, and each of those commits recorded
  # `required workflow CodeQL/Analyze (…) is cancelled` and could not produce a
  # release-evidence package at all. The gate was right; the scan was missing.
  #
  # Keyed by SHA on the canonical branch, so each commit's analysis runs to
  # completion and no two commits ever share a group. Everywhere else — pull
  # requests, forks, the weekly schedule off other refs — superseding an
  # in-flight scan is still the right economy and is unchanged.
  group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name == 'concept2cure-v2' && github.sha || 'ref' }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
          # Excludes TEST paths only — every shipped line is still scanned, no
          # query disabled, no production alert suppressed. See the file's
          # header for the reasoning and for how to reverse it.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: '/language:${{ matrix.language }}'
