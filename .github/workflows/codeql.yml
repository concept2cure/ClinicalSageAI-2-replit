name: CodeQL

on:
  push:
    branches: ['concept2cure-v2', 'main', 'master']
  pull_request:
    branches: ['concept2cure-v2', 'main', 'master']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
          # Excludes TEST paths only — every shipped line is still scanned, no
          # query disabled, no production alert suppressed. See the file's
          # header for the reasoning and for how to reverse it.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: '/language:${{ matrix.language }}'
