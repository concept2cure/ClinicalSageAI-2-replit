name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Semgrep runs in its own job. As a container action it executes as root in
  # the shared workspace, and the files it leaves behind are root-owned — which
  # is why the dependency install in this workflow failed with EACCES on
  # package-lock.json on every run. Isolating it keeps the SAST scan while
  # giving the validation job a workspace it owns.
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/ci

  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins instead of resolving and rewriting it, which is both the
      # reproducible choice for CI and the convention in this repo's other
      # workflows.
      - name: Install dependencies
        id: install
        run: npm ci

      - name: Set PR base ref
        run: echo "BASE_REF=${{ github.base_ref }}" >> $GITHUB_ENV

      - name: Security pattern check
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Hard gate. Scans server/ for the bug classes PRs #496-#503 fixed:
        # tenant-trust from req.body / req.query / x-*-id headers, direct
        # jwt.verify (must use verifyJwtWithRotation), and hardcoded org-id
        # fallbacks. Inline `// security-allow: <reason>` annotations are
        # honored for deliberate, audited exceptions.
        run: npm run check:security-patterns

      - name: Compliance claim check
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Hard gate. Customer-facing copy must not assert compliance the
        # platform cannot evidence. The signup screen previously advertised
        # "SOC 2 Type II" — for which no report of any type exists — alongside
        # blanket encryption-at-rest and mandatory MFA, none of which were true.
        # These are exactly the claims a regulated-industry buyer's procurement
        # team audits, so the failure mode is a security questionnaire answered
        # wrongly in writing. Deliberate exceptions annotate the line with
        # `compliance-claim-allow: <reason>`.
        run: npm run check:compliance-claims

      - name: Microcopy tone check
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Hard gate. Customer-facing copy must not carry exclamation marks or
        # pictograph emoji — a design-system non-negotiable the 2026-07 UI/UX
        # audit found violated in the exact sites the rule was meant to
        # govern (signup CTAs, error boundaries, AnA fallback strings). PR
        # #1260 fixed the named sites; this gate stops the drift. The check
        # is narrow (sentence-terminating `!` only, surrogate-pair emoji only
        # — functional dingbats like ✓✕⚠☰ are allowed) so it does not
        # generate noise. Deliberate exceptions annotate the line with
        # `microcopy-allow: <reason>`.
        run: npm run check:microcopy

      - name: GA completion ledger check
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Hard gate. docs/GA_COMPLETION_LEDGER_2026-08.md is the single register
        # of open GA work across every space; its failure mode is going stale —
        # a row citing a renamed file, a row marked `done` on an agent's
        # say-so, two rows sharing an ID. All three have happened here. The
        # check refuses a `done` row whose evidence does not exist, and refuses
        # work specified against a document that is not in the repo. A path an
        # `open` row names as its deliverable is reported, never failed.
        run: npm run check:ledger

      - name: Document alias map holds identities only
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Hard gate. c2c_document_aliases is an identity map, not a registry.
        # The registry that owned identity AND metadata AND placement was built
        # here once and reverted, because it competed with the stores that
        # already own those things. It would come back one reasonable-looking
        # column at a time — a title "just for debugging", a status "so we
        # don't have to join" — each defensible alone, the set being the
        # reverted design. This says no once, to all of them.
        run: npm run ci:document-alias-attribute-free

      - name: Surfaces are discoverable, or declared not to be
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Hard gate. The product renders 118 surfaces and the rail exposes 14;
        # the rest are found through the Apps catalog. Nothing kept those two
        # lists in step, so eight backed surfaces — mounted routes, live API
        # calls, one across seventeen endpoints — were reachable only by
        # someone who already knew the URL. A surface a user cannot find is,
        # to that user, a surface that does not exist. Exclusions are allowed
        # and must carry a reason.
        run: npm run ci:surface-discoverability

      - name: AnA can see the screen she is asked about
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Ratchet, not a hard requirement. A surface tells AnA what it is showing
        # via usePublishSurfaceContext; the shell forwards it and the server
        # renders it into the prompt. That pipeline was completed end to end and
        # then three surfaces out of 118 called the publisher — so on the other
        # 115 AnA was handed a live conversation and an empty screen, and would
        # answer "what should I do next?" from the surface id alone. Nothing
        # detected it: publisher and consumer were both tested, and the thing
        # between them was nobody's test. Adoption may rise and may never fall;
        # the remaining backlog is reported, not failed.
        run: npm run ci:ana-surface-context

      - name: No server error carries the failure text to the client
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Ratchet, not a hard requirement. serverError() copied err.message into
        # the response body while its docstring claimed the envelope was
        # sanitized, so a route with a missing relation answered the browser
        # with `relation "software_lifecycle_items" does not exist` — the exact
        # string the MDX work order's verify step forbids, delivered to whoever
        # holds the session. Fixing that helper closed 272 call sites and left
        # 843 that answer a 5xx without it, mostly a copy-pasted local fail().
        # Client-side redaction does not close this: it scrubs at render time
        # while the API still ships the string to a proxy log or a saved HAR.
        # The baseline may shrink and may never grow.
        run: npm run ci:server-error-leaks

      - name: No API route or table name in user-visible copy
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Hard gate, and it was running nowhere. The script has existed since
        # W0-4 and was referenced only from package.json — absent from all 19
        # workflows and both husky hooks — so the rule it enforces was checked
        # only when somebody remembered to run it by hand.
        run: npm run ci:internals-in-copy

      - name: No clearance copy chosen by an empty collection
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The same omission as the step above, one gate over. This one exists to
        # make BIOPHARMA_WORK_ORDER.md's standing checklist item — "no AI
        # narrative asserts readiness or absence of blockers over an empty state"
        # — executable rather than checked by a human reading screens. It
        # self-tests against the recovered pre-fix sources of NdaCockpit and
        # BiopharmaSpecialty, carries a baseline that may only shrink, and until
        # now ran nowhere. It caught real defects during the honest-state sweep
        # only because someone ran it by hand.
        run: npm run ci:empty-state-honesty

      - name: No control promising an action it only asks about
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Twice, months apart and in unrelated code, a control named a governed
        # act and its handler only sent a sentence to the chat pane: an "Attach
        # to dossier" button that attached nothing, and a "Cite" button that
        # created no citation. Both were caught by a human reading screens. The
        # self-test runs against those two recovered pre-fix sources, so the gate
        # is proven on the code that actually shipped the defect.
        run: npm run ci:action-overclaim

      - name: No success message before the response is checked
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # apiRequest returns a 401 instead of throwing it. Three handlers, months
        # apart, leaned on the throw alone and painted "recorded" / "attached" /
        # "frozen and sealed" over a refused request on an expired session. The
        # self-test runs against the recovered pre-fix freeze handler and proves
        # the three repaired surfaces silent.
        run: npm run ci:success-before-ok

      - name: No hand-rolled error-envelope reads
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # A surface that reads `json.error` / `typeof error === 'string'` by hand
        # skips the two filters serverMessage applies — isErrorCode and
        # looksInternal — so an enum token or an internal string reaches the UI.
        # The gate existed with a baseline and ran nowhere; four fresh drift
        # sites had already landed (DocumentAuthoring x2, HaqManager, Onboarding),
        # each now routed through the canonical reader. Baseline 0.
        run: npm run ci:error-envelope

      - name: Filing-catalog copy stays canonical
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Passes clean today and was running nowhere; wiring it stops the next
        # drift silently.
        run: npm run check:catalog-copy

      - name: INSERT columns are declared in the model
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # A shrink-only ratchet, and it was running nowhere. The baseline had 11
        # stale entries whose violations no longer occur; regenerating dropped
        # exactly those 11 and absorbed nothing new (diff -11/+0). 49 real ones
        # remain, awaiting burn-down; the ratchet now guards against the count
        # growing.
        run: npm run ci:insert-columns-declared

      - name: Gates that existed but ran nowhere
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # An audit of what CI actually executes found 88 gate files, 67 of them
        # wired and 21 not. These twelve pass today and are enforced from here;
        # several are load-bearing rather than cosmetic — session-scoped RLS
        # bypass, ORM table reachability, governed export routes, and the
        # ungated-fixture-fallback rule CLAUDE.md states as "no fixture data in
        # governed paths".
        #
        # Three of the remaining unrun gates FAIL today and are deliberately not
        # wired here, because wiring a failing gate breaks the build for
        # everyone: ci:error-envelope, ci:insert-columns-declared and
        # ci:tenant-resolvers. Each needs its violations resolved first, and
        # ci:tenant-resolvers in particular reports a real tenant-isolation
        # divergence that needs a decision, not a quick fix.
        run: |
          npm run ci:canonicalizers
          npm run ci:commonjs-require
          npm run ci:governed-export-consequence-shape
          npm run ci:governed-export-routes
          npm run ci:migration-set-order
          npm run ci:model-migration-agreement
          npm run ci:node-runtime
          npm run ci:orm-reachability
          npm run ci:reasoning-tier-ga-readiness
          npm run ci:reasoning-tier-uat-evidence
          npm run ci:session-scoped-rls-bypass
          npm run ci:fixture-fallback

      - name: Verify tests for changed code
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: bash scripts/ai/verify-tests.sh

      - name: Check for large files
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: |
          echo "Checking for files over 500 lines..."
          LARGE_FILES=$(find . -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" | \
            grep -v node_modules | grep -v dist | grep -v _deprecated | \
            xargs wc -l 2>/dev/null | awk '$1 > 500 {print}' | grep -v total || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "⚠️ Warning: Large files detected:"
            echo "$LARGE_FILES"
          fi

      - name: Check for console.log
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: |
          echo "Checking for console.log statements..."
          CONSOLE_LOGS=$(git diff "origin/$BASE_REF"...HEAD --name-only | \
            grep -E '\.(ts|tsx|js|jsx)$' | \
            xargs grep -l 'console\.log' 2>/dev/null | \
            grep -v _deprecated || true)
          if [ -n "$CONSOLE_LOGS" ]; then
            echo "⚠️ Warning: console.log found in changed files:"
            echo "$CONSOLE_LOGS"
          fi

      - name: Check for deprecated imports
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: |
          echo "Checking for deprecated imports..."
          DEPRECATED=$(git diff "origin/$BASE_REF"...HEAD --name-only | \
            grep -E '\.(ts|tsx|js|jsx)$' | \
            xargs grep -lE "from ['\"].*/_deprecated/" 2>/dev/null || true)
          if [ -n "$DEPRECATED" ]; then
            echo "❌ Error: Imports from deprecated folders detected:"
            echo "$DEPRECATED"
            exit 1
          fi

      - name: Run linter on changed files
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # This step used to end in `--max-warnings 0 || echo "Lint warnings found"`.
        # The `|| echo` swallowed eslint's exit code, so the per-PR lint gate could
        # not fail — ever. It reported problems and passed regardless.
        #
        # The fix is deliberately not "delete `|| echo` and keep --max-warnings 0".
        # A bare `eslint .` currently reports 6,268 warnings repo-wide (0 errors),
        # so failing on any warning would red every PR on day one and this line
        # would simply be reverted. Instead: eslint's own exit code now decides,
        # which fails on ERRORS (the 13 rules configured as 'error') and lets the
        # pre-existing warning backlog through.
        #
        # Follow-up, tracked in the 2026-07 audit remediation plan: ratchet
        # warnings down and reintroduce --max-warnings with a real budget. Note
        # also that eslint.config.js ignores client/src/** entirely (871 files),
        # so this gate does not see the UI at all yet.
        #
        # `--diff-filter=d` excludes DELETED files. Without it, `git diff
        # --name-only` lists paths this PR removed, eslint is handed a file that
        # no longer exists, and it exits 2 with "No files matching the pattern".
        # That made the gate fail on any PR that deletes a .ts/.tsx/.js/.jsx
        # file — which is what happened the first time a PR did (a doc cleanup
        # that removed an archived runMigrations.ts).
        #
        # This bug was always here. It could not surface while the step ended in
        # `|| echo`, because that swallowed every non-zero exit including this
        # one. Making the gate able to fail is what revealed it was also being
        # invoked wrongly.
        run: |
          FILES=$(git diff "origin/$BASE_REF"...HEAD --name-only --diff-filter=d | grep -E '\.(ts|tsx|js|jsx)$' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            npx eslint $FILES
          fi
