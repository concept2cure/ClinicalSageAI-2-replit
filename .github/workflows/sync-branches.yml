name: Sync Branches with Main

on:
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  
  # Scheduled execution (runs weekly on Monday at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 1'
  
  # Can be triggered by repository dispatch
  repository_dispatch:
    types: [sync-branches]

# Permissions needed for the workflow
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-branches:
    name: Synchronize Branches with Main
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Fetch all branches
        run: |
          git fetch --all --prune
          echo "Available branches:"
          git branch -r
      
      - name: Run branch synchronization
        id: sync
        run: |
          # Make script executable
          chmod +x scripts/sync-branches.sh
          
          # Run sync script and capture output
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN MODE - No changes will be pushed"
            echo "This would sync branches but changes won't be pushed to remote"
            # In a real implementation, you'd modify the script to support dry-run
          else
            # Run the sync script
            ./scripts/sync-branches.sh 2>&1 | tee sync-output.log || echo "SYNC_FAILED=true" >> $GITHUB_ENV
          fi
      
      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_number }}
          path: sync-output.log
          retention-days: 90
      
      - name: Check for conflicts
        id: check-conflicts
        if: always()
        run: |
          if grep -q "MERGE CONFLICT detected" sync-output.log 2>/dev/null; then
            echo "CONFLICTS_FOUND=true" >> $GITHUB_ENV
            echo "conflicts_found=true" >> $GITHUB_OUTPUT
            
            # Extract conflict branches
            grep "MERGE CONFLICT detected in branch:" sync-output.log | sed 's/.*branch: //' > conflict-branches.txt || true
          else
            echo "CONFLICTS_FOUND=false" >> $GITHUB_ENV
            echo "conflicts_found=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create issue for conflicts
        if: env.CONFLICTS_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let conflictBranches = '';
            try {
              conflictBranches = fs.readFileSync('conflict-branches.txt', 'utf8');
            } catch (e) {
              conflictBranches = 'Unable to read conflict branches';
            }
            
            const issueTitle = '🔀 Branch Sync Conflicts Detected';
            const issueBody = `## Branch Synchronization Conflicts
            
            The automated branch synchronization process detected merge conflicts that require manual resolution.
            
            ### Conflicting Branches
            
            The following branches have conflicts when merging from \`main\`:
            
            \`\`\`
            ${conflictBranches}
            \`\`\`
            
            ### Resolution Steps
            
            For each conflicting branch:
            
            1. Checkout the branch locally:
               \`\`\`bash
               git checkout <branch-name>
               \`\`\`
            
            2. Merge main into the branch:
               \`\`\`bash
               git merge main
               \`\`\`
            
            3. Resolve conflicts using your preferred tools
            
            4. Test the resolved code thoroughly
            
            5. Commit the resolution:
               \`\`\`bash
               git commit -m "Resolve merge conflicts with main"
               \`\`\`
            
            6. Push to remote:
               \`\`\`bash
               git push origin <branch-name>
               \`\`\`
            
            ### Governance Compliance
            
            - ✅ Main branch integrity preserved
            - ✅ Conflicts detected and reported
            - ⚠️ Manual resolution required
            - ℹ️ See [Branch Sync Governance](.github/BRANCH_SYNC_GOVERNANCE.md)
            
            ### Sync Report
            
            Full sync report available in workflow artifacts:
            - Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This issue was automatically created by the branch sync workflow.*
            *Workflow run: ${{ github.run_id }}*
            `;
            
            // Check if an open issue already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'branch-sync,conflicts'
            });
            
            if (existingIssues.data.length > 0) {
              // Update existing issue
              const issue = existingIssues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## New Conflicts Detected\n\n${issueBody}\n\n*Updated: ${new Date().toISOString()}*`
              });
              
              console.log(`Updated existing issue #${issue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['branch-sync', 'conflicts', 'automation']
              });
              
              console.log(`Created new issue #${issue.data.number}`);
            }
      
      - name: Post success summary
        if: env.CONFLICTS_FOUND == 'false' && env.SYNC_FAILED != 'true'
        run: |
          echo "## ✅ Branch Sync Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All branches successfully synchronized with main." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Governance Compliance" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Main branch integrity preserved" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Updates flowed FROM main TO branches" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ No conflicts detected" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Audit trail maintained" >> $GITHUB_STEP_SUMMARY
      
      - name: Post conflict summary
        if: env.CONFLICTS_FOUND == 'true'
        run: |
          echo "## ⚠️ Branch Sync Completed with Conflicts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Some branches have merge conflicts that require manual resolution." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Governance Compliance" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Main branch integrity preserved" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Conflicts detected and reported" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Manual resolution required" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Audit trail maintained" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "An issue has been created to track conflict resolution." >> $GITHUB_STEP_SUMMARY
      
      - name: Fail if sync failed
        if: env.SYNC_FAILED == 'true'
        run: |
          echo "## ❌ Branch Sync Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The branch synchronization process encountered errors." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please review the workflow logs and sync report artifact." >> $GITHUB_STEP_SUMMARY
          exit 1
