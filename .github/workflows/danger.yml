name: Danger PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  danger:
    name: Danger.js Automated Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Danger
        run: npx danger ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
