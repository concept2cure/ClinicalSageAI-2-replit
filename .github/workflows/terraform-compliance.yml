name: Terraform Compliance Validation (Plan Only)

on:
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
    steps:
      # Every `uses:` in this repo's workflow tree is pinned to a full commit
      # SHA with the human-readable tag in a trailing comment. A tag is a mutable
      # pointer — whoever can move it can run arbitrary code in this job — so the
      # SHA is the only reference that actually pins what executes. Read the
      # comment for the version; change BOTH when upgrading.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform Security Scan (Checkov)
        # Was `@master` (mutable branch ref — an attacker controlling that
        # branch could run arbitrary code in this job), then `@v12` (a mutable
        # major tag with the same exposure). Now pinned to the commit the `v12`
        # tag resolved to at the time of pinning.
        uses: bridgecrewio/checkov-action@358405ddafaa109ad35d3d607bbc7cf933c742d9 # v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: sarif

      - name: Terraform Plan (Read-only)
        working-directory: terraform/environments/staging
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -no-color -out=tfplan

      - name: Comment PR with Plan (snippet)
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/staging/tfplan', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Terraform plan generated (staging). Reviewers: please verify no production resources referenced. (attachment omitted)`
            });
