name: Terraform Compliance Validation (Plan Only)

on:
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Security Scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: sarif

      - name: Terraform Plan (Read-only)
        working-directory: terraform/environments/staging
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -no-color -out=tfplan

      - name: Comment PR with Plan (snippet)
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/staging/tfplan', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Terraform plan generated (staging). Reviewers: please verify no production resources referenced. (attachment omitted)`
            });
