name: Cortex CSR Evidence

on:
  push:
    branches: [concept2cure-v2]
    paths:
      - 'server/routes/ana-cortex.ts'
      - 'server/services/clinical-regulatory-evidence/**'
      - 'server/services/csr/**'
      - 'tests/cortex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cortex-csr-evidence.yml'
  pull_request:
    paths:
      - 'server/routes/ana-cortex.ts'
      - 'server/services/clinical-regulatory-evidence/**'
      - 'server/services/csr/**'
      - 'tests/cortex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cortex-csr-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pin as ci.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Cortex extraction, adapter and authoring handler behaviors
        # Actual repository TS modules, transpiled by its installed TypeScript.
        # Persistence, authentication and model transport doubles are explicit;
        # this is NOT live database/model or whole-product qualification.
        run: node --test tests/cortex/*.test.mjs
