name: Release evidence gate
on:
  workflow_call:
    inputs:
      evidence-artifact:
        description: Artifact from this workflow run containing release-evidence-input.json and its primary evidence files
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  validate-release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.evidence-artifact }}
          path: .
      - name: Require release input assembled from this run's primary artifacts
        run: test -f release-evidence-input.json
      - run: npm run release:evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
