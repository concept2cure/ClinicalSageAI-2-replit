name: Test DOCX Generator

on:
  push:
    branches: [ main, chore/logging-apply-worker, '**']
  pull_request:
    branches: [ main ]

jobs:
  test-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install service requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements.txt

      - name: Prepare test output directory
        run: mkdir -p services/test_outputs
        env:
          TEST_OUTPUT_DIR: services/test_outputs

      - name: Run generator tests
        env:
          TEST_OUTPUT_DIR: services/test_outputs
        run: |
          pytest -q services/tests/test_generator.py -q

      - name: Start E2E docker-compose
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for API to be ready
        run: |
          # Wait for the API to respond on port 8000 (max 30s)
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/docs > /dev/null; then
              echo "API ready" && break
            fi
            sleep 1
          done

      - name: Wait for Celery worker to respond
        run: |
          # Poll the worker with celery inspect ping (max 90s). The worker
          # image installs docker and other deps which can cause cold-starts on
          # shared CI runners; increase timeout to be tolerant.
          for i in {1..90}; do
            if docker compose exec -T worker celery -A services.celery_app inspect ping -d >/dev/null 2>&1; then
              echo "Worker responsive" && break
            fi
            sleep 1
          done
          # If the worker never became responsive, dump the worker logs to help
          # debugging. This will appear in the workflow logs.
          if ! docker compose exec -T worker celery -A services.celery_app inspect ping -d >/dev/null 2>&1; then
            echo "Worker did not respond in time; dumping worker logs:" >&2
            docker compose logs worker || true
            exit 1
          fi

      - name: Run E2E async test
        env:
          TEST_OUTPUT_DIR: services/test_outputs
        run: |
          pytest -q services/tests/test_e2e_async.py -q

      - name: Tear down E2E docker-compose
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml down

      - name: Upload generated DOCX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-docx
          path: services/test_outputs/**
