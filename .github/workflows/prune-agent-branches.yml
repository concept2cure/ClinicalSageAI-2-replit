# Prune the agent branches CLAUDE.md Rule 0 forbids.
#
# WHY THIS EXISTS AS A WORKFLOW. `concept2cure-v2` is the only branch that may
# exist (CLAUDE.md Rule 0), yet the remote carries hundreds of `claude/*`,
# `codex/*`, `copilot/*` and `openai/*` refs left by agent sessions. Deleting
# them needs credentials that may delete refs: an agent session's git
# credentials are scoped to ref UPDATES and the remote answers 403 on every
# deletion, so the cleanup cannot run from a session. GITHUB_TOKEN inside this
# repo can, which is why the prune lives here.
#
# SAFETY. Manual dispatch only, dry run by DEFAULT, and a real run additionally
# requires typing the branch count as `confirm`. Nothing outside the agent
# prefixes is eligible, and `concept2cure-v2`, `dependabot/*`, `deps/*` and the
# default branch are refused even if a prefix somehow matched. Every ref this
# job deletes is printed with its tip SHA in the job summary FIRST, so the tips
# stay recoverable (`git fetch origin <sha>`) for as long as GitHub keeps
# unreachable objects.
name: Prune agent branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting it'
        type: boolean
        required: true
        default: true
      confirm:
        description: 'To really delete, type the exact number of branches the dry run reported. Ignored when dry_run is true.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: prune-agent-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Collect, report, and prune
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        with:
          script: |
            const AGENT_PREFIXES = /^(claude|codex|copilot|openai|cursor|agent|ai|bot)\//;
            // Refused even if a prefix somehow matched them.
            const NEVER = new Set([context.payload.repository.default_branch, 'concept2cure-v2']);
            const NEVER_PREFIXES = /^(dependabot|deps|revert)\//;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const targets = branches.filter(b =>
              AGENT_PREFIXES.test(b.name) && !NEVER.has(b.name) && !NEVER_PREFIXES.test(b.name) && !b.protected
            );
            const kept = branches.filter(b => !targets.includes(b));

            const dryRun = String(process.env.DRY_RUN) === 'true';
            const confirm = (process.env.CONFIRM || '').trim();

            // The recovery record goes into the summary BEFORE anything is
            // deleted, so a wrong run is still recoverable from these SHAs.
            core.summary
              .addHeading(dryRun ? 'Dry run — nothing deleted' : 'Pruning agent branches')
              .addRaw(`\n${targets.length} eligible, ${kept.length} kept.\n\n`)
              .addDetails('Kept', kept.map(b => `- \`${b.name}\``).join('\n') || '_none_')
              .addDetails(
                'Eligible (tip SHAs — recover with `git fetch origin <sha>`)',
                targets.map(b => `- \`${b.name}\` ${b.commit.sha}`).join('\n') || '_none_',
              );

            if (dryRun) {
              core.summary.addRaw(
                `\nTo delete these, re-run with dry_run unchecked and confirm = \`${targets.length}\`.\n`,
              );
              await core.summary.write();
              core.notice(`Dry run: ${targets.length} agent branches eligible, ${kept.length} kept.`);
              return;
            }

            if (confirm !== String(targets.length)) {
              await core.summary.write();
              core.setFailed(
                `Refusing to delete: confirm was "${confirm}" but ${targets.length} branches are eligible. ` +
                `Re-run with confirm = ${targets.length} once that count looks right.`,
              );
              return;
            }

            let deleted = 0;
            const failures = [];
            for (const b of targets) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${b.name}`,
                });
                deleted++;
              } catch (err) {
                failures.push(`- \`${b.name}\`: ${err.status ?? ''} ${err.message}`);
              }
            }

            core.summary.addRaw(`\nDeleted ${deleted} of ${targets.length}.\n`);
            if (failures.length) {
              core.summary.addDetails('Failed', failures.join('\n'));
            }
            await core.summary.write();

            if (failures.length) {
              core.setFailed(`${failures.length} branch deletions failed; see the job summary.`);
            } else {
              core.notice(`Deleted ${deleted} agent branches; ${kept.length} kept.`);
            }
