name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  merge_group:
    branches: ['**']
  schedule:
    - cron: '0 6 * * *'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Guardrails — eCTD migration headers (reg audit)
        run: ./scripts/ci/require-migration-headers.sh

      - name: Guardrails — ban direct new Pool()
        run: scripts/ci/ban-new-pool.sh

      - name: Guardrails — migration prefix collisions (no regressions)
        run: npm run ci:migration-prefix-collisions

      - name: Guardrails — RLS allowlist TS↔SQL parity
        run: npm run ci:rls-allowlist-sync

      - name: Guardrails — tenant column types (no TEXT-typed tenant cols)
        run: npm run ci:tenant-column-types

      - name: Guardrails — tenant-isolation in raw SQL (no regressions)
        run: npm run ci:tenant-isolation:no-regression

      - name: Guardrails — no leaky dev-auth gates in prod paths
        run: npm run ci:no-dev-auth-in-prod

      - name: Guardrails — password hygiene
        run: npm run ci:password-hygiene

      - name: Guardrails — route mount authority audit (no regressions)
        run: npm run ci:audit-route-mounts:no-regression

      - name: Guardrails — route ownership matrix artifact (required review evidence)
        run: npm run ci:route-ownership-matrix:check

      - name: Audit — repo health scan (no regressions)
        run: npm run audit:repo-health:no-regression

      - name: Upload governance audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-audits-lint
          path: |
            docs/reports/repo-health-scan-latest.json
            docs/reports/route-mount-audit-latest.json
            docs/reports/route-ownership-matrix-latest.md
          retention-days: 14

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check (no regression vs baseline)
        # Strict `npm run typecheck` would fail on the ~2,598 pre-existing
        # type errors that became visible when the parse error in
        # server/routes/auth.ts:842 was fixed (tsc had been bailing on
        # that parse error and never typechecking transitive imports).
        # The no-regression gate pins the baseline and fails only on net
        # new errors. Same pattern as ci:migration-prefix-collisions.
        # Run `npm run ci:typecheck:write-baseline` after a PR reduces
        # the count to ratchet it down.
        run: npm run ci:typecheck:no-regression

      - name: Run beta-slice TypeScript check
        run: npm run beta:typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          CI: true

  ana-readiness-tests:
    name: AnA Readiness Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run AnA readiness suite
        run: npm run test:ana
        env:
          CI: true
          SKIP_DB_STARTUP_TEST: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concept2cure-ri_test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          POSTGRES_DB: concept2cure-ri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply GCC migrations
        run: |
          for migration in $(ls db/migrations/*_gcc_*.sql | sort); do
            echo "Applying $migration"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres:${{ env.TEST_DB_PASSWORD }}@localhost:5432/concept2cure-ri_test

      - name: Smoke — apply RLS rollout migrations (0019/0020/0021)
        # These migrations target the production schema. On a fresh test DB
        # they each execute but find nothing to mutate (no tenant-keyed
        # tables), so they prove the SQL parses and runs cleanly without
        # changing behavior. This catches DO-block syntax bugs before
        # staging/prod, where a botched migration would be far costlier.
        run: |
          for f in \
            migrations/0019_tenant_column_audit.sql \
            migrations/0020_coerce_text_tenant_columns.sql \
            migrations/0021_enable_rls_everywhere.sql; do
            echo "Applying $f"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          DATABASE_URL: postgresql://postgres:${{ env.TEST_DB_PASSWORD }}@localhost:5432/concept2cure-ri_test

      - name: Run integration tests
        run: npm test -- --passWithNoTests
        env:
          CI: true
          RUN_INTEGRATION_TESTS: 'true'
          TEST_DATABASE_URL: postgresql://postgres:${{ env.TEST_DB_PASSWORD }}@localhost:5432/concept2cure-ri_test

  aios-audit-assets:
    name: AIOS Audit Assets
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate AIOS evidence pack and enforce release gates
        run: make aios-gate

      - name: Validate AIOS audit assets
        run: make aios-validate

      - name: Run AIOS audit tooling tests
        run: make aios-test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, ana-readiness-tests, integration-tests, aios-audit-assets]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan (deps + secrets)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Trivy config scan (Dockerfile/IaC)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          skip-dirs: node_modules

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test -- --coverage --passWithNoTests
        env:
          CI: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=concept2cure_Concept2Cure.RI-2-replit
            -Dsonar.organization=concept2cure
            -Dsonar.sources=server,client/src,shared
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/_archive/**,**/_deprecated_migrations/**
            -Dsonar.tests=server,client/src
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.tsconfigPath=tsconfig.json
            -Dsonar.qualitygate.wait=true

  nightly-governance:
    name: Nightly Governance Strict
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Route mount audit (strict debt gate)
        run: npm run ci:audit-route-mounts:full-strict
      - name: Repo health audit (strict debt gate)
        run: npm run audit:repo-health:full-strict
      - name: Upload nightly governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-audits-nightly
          path: |
            docs/reports/repo-health-scan-latest.json
            docs/reports/route-mount-audit-latest.json
          retention-days: 30
