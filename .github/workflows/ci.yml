name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  merge_group:
    branches: ['**']
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: several guards in this job scope themselves to what a
          # PR CHANGED, and need a base ref to diff against. At the default
          # fetch-depth of 1 there is no HEAD~1 and no origin/<base>, so
          # require-migration-headers.sh resolved no base and fell back to a
          # working-tree diff that is empty on a clean checkout — reporting
          # "No migration changes detected" on every PR, including ones that
          # added migrations. See scripts/ci/require-migration-headers.sh.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Guardrails — Node 22 runtime contracts
        if: '!cancelled()'
        run: node scripts/ci/check-node-runtime.mjs

      # The guard's own detection logic is code that can regress; the self-test
      # mutates each contract surface and requires the guard to reject it (it
      # refuses to run against an already-dirty baseline, so it cannot pass
      # vacuously).
      - name: Guardrails — Node 22 guard rejects simulated drift
        if: '!cancelled()'
        run: node scripts/ci/check-node-runtime.mjs --self-test

      - name: Install dependencies
        id: install
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET)
        # that otherwise fail the whole pipeline (every other job needs: lint).
        run: |
          for attempt in 1 2 3; do
            npm install && exit 0
            echo "::warning::npm install failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm install failed after 3 attempts"; exit 1

      # The manifest gate's fail-closed logic must be exercised on every push,
      # not only when a release workflow eventually calls it. AFTER install:
      # cli.mjs (which these tests spawn) imports ajv from node_modules — this
      # step sat before Install once and its failure skipped install, taking
      # every if:!cancelled() step below down with spurious module errors.
      - name: Guardrails — release-evidence manifest gate self-tests
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run test:release-evidence

      - name: Guardrails — eCTD migration headers (reg audit)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: ./scripts/ci/require-migration-headers.sh

      - name: Guardrails — ban direct new Pool()
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: scripts/ci/ban-new-pool.sh

      - name: Guardrails — migration prefix collisions (no regressions)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:migration-prefix-collisions

      - name: Guardrails — RLS allowlist TS↔SQL parity
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:rls-allowlist-sync

      - name: Guardrails — duplicate CREATE TABLE across BOTH migration lineages
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The prefix-collision guard scans migrations/ only and the manifest
        # generator scans db/migrations/ only — neither sees cross-lineage table
        # collisions, and neither checks table NAMES. See ADR-0006 / conflict C-6.
        run: npm run ci:duplicate-table-ddl

      - name: Guardrails — golden-journey migrations must be on a durable apply path
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The C-6/C-8/C-10/C-11/C-16/C-17 class from the applier side: a migration
        # a golden journey provisions and depends on, that no real deploy runs —
        # merged, green, and applied to the throwaway journey DB only. The
        # duplicate/unbacked guards cannot see this: the table IS created (on the
        # journey's PGlite) and the SQL DOES have a backing file; what is missing
        # is a durable applier. See ledger C-6 / this migration's C-23 entry.
        run: npm run ci:journey-migration-reachability

      - name: Guardrails — server SQL references a table no APPLIER creates
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The general case of the guard above (ledger C-32). ci:unbacked-tables
        # asks "does a .sql file create this table?" and counts any non-archived
        # migration — regardless of whether an applier ever RUNS it. So a file
        # sitting in db/migrations/ on no apply path makes its tables look backed
        # while they exist on no real database and every endpoint querying them
        # 500s. This guard asks the durability question for EVERY server-
        # referenced table. Baselined; anything new fails.
        run: npm run ci:migration-reachability

      - name: Guardrails — server SQL references a table nothing creates
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The C-8/C-10/C-11/C-12/C-14 class: shipped code with no storage. Unit
        # tests vi.mock the db module so a mock accepts any table name; the
        # failure surfaces only in production, as a 500 (unguarded query) or as
        # a silent no-op (query inside try/catch). See ledger C-14.
        run: npm run ci:unbacked-tables

      - name: Guardrails — source files nothing can reach
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The inverse of the unbacked-table class: not a table with no code, but
        # code with no caller. Nothing imports the module, so its routes are
        # unmounted and nothing it contains can run — yet it greps like product.
        #
        # `audit:dead-code` (knip) was meant to cover this and could not: two
        # config-load failures abort its analysis, so it reported zero
        # unreferenced files while calling @anthropic-ai/sdk unused, and it ran
        # with --no-exit-code so the job passed regardless.
        run: npm run ci:unreferenced-modules

      - name: Guardrails — no live credentials committed to the tree
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # A live `neondb_owner` Postgres password sat in two tracked files from
        # 2026-01-23 (a getting-started doc, in plaintext AND as a URL; and a
        # seed script, as the fallback used whenever DATABASE_URL was unset).
        # Two different passwords, same endpoint, both the OWNER role — above
        # the non-superuser app_service role the whole tenant-RLS program relies
        # on. Nothing in CI could block it: semgrep.yml is deliberately
        # continue-on-error so a broad ruleset with a triage backlog does not
        # gate every PR. This guard is narrow enough to be blocking on day one.
        run: npm run ci:committed-secrets

      - name: Guardrails — requirements.txt pins must install on the declared Python
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Dependabot #1014 proposed numpy 2.4.6 -> 2.5.1. numpy 2.5.1 is
        # requires_python >=3.12 and ships only cp312/cp313/cp314 wheels; this
        # project declares python-3.11 (.replit line 1, and every setup-python
        # in CI). With an exact pin pip hard-fails rather than degrading.
        #
        # The hole was not the bad pin, it was the silence: NOTHING installs the
        # root requirements.txt. All four CI references resolve to sub-project
        # manifests (shadow_service/, ind_automation/, services/), and neither
        # Dockerfile installs it — so merging that bump would have turned no job
        # red and surfaced only at deploy time on the 3.11 runtime.
        #
        # Reads the target interpreter from .replit rather than hardcoding it,
        # so a real Python upgrade moves the check instead of stranding it.
        # A PyPI outage skips loudly (never silently) so it cannot wedge CI.
        run: npm run ci:requirements-pins

      - name: Guardrails — content cannot be saved without its data lineage
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Every span of a saved document must trace to where it came from. The
        # gate that enforces it is a few lines inside a 6,000-line router, so a
        # refactor, an "optimisation" that drops the transaction, or a bad merge
        # resolution all remove it in silence — saves keep working, and the loss
        # only surfaces when someone asks where a sentence came from and the
        # answer is missing for whatever period the gate was absent.
        #
        # This asserts the shape structurally: a transaction around the content
        # write, the lineage write enlisted in it, and the coverage check
        # enlisted too. Verified to fail on each of those removed individually.
        run: npm run ci:lineage-save-gate

      - name: Guardrails — a store nothing writes may not gain readers
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:writerless-stores

      - name: Guardrails — the document alias map holds no attributes
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # c2c_document_aliases is identity only (Document Identity Contract
        # slice C2, ledger L10). The registry that also owned title, status and
        # placement was built once and reverted; the way it comes back is one
        # reasonable-looking column at a time, and this says no to each.
        run: npm run ci:document-alias-attribute-free

      - name: Guardrails — every artifact producer emits a provenance event
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # A write to concept2cure_artifacts is a document the platform builds;
        # each must record a concept2cure_provenance_events row so the document's
        # lifecycle is uniformly traceable. Baseline-based: a shrinking set of
        # pre-existing producers is grandfathered, but no NEW producer may write
        # artifact content without provenance, and baseline entries that become
        # compliant must be removed. Debt can only go down.
        run: npm run ci:artifact-provenance

      - name: Guardrails — no direct Pool construction in runtime code
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Was enforced nowhere. Its scan list also named ten of server/'s ~35
        # directories, so server/src, server/bootstrap, server/lib and others
        # were invisible to it; it now scans server/ with exclusions instead.
        run: npm run ci:ban-new-pool

      - name: Guardrails — eCTD stub bundle + generated risk-code types
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Both were pre-push-hook only, so a `git push --no-verify` skipped them
        # and nothing checked the branch.
        run: |
          npm run ci:ectd-stubs
          npm run ci:risk-codes

      - name: Guardrails — security patterns (tenant / identity / role trust)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Existed only as a pre-commit hook, so it was skipped by any commit made
        # with --no-verify and never enforced on the branch. It now blocks in CI.
        # Covers the PR #496-500 tenant-trust rules plus identity-trust-header
        # (ledger C-18), which caught 11 further violations across four files on
        # its first run — including a header-supplied userId passed straight into
        # a document query.
        run: npm run check:security-patterns

      - name: Guardrails — proof surface must not shrink or overclaim
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The proof hierarchy (docs/architecture/PROOF_HIERARCHY.md) is only a
        # ladder if it stays standing. This fails if a baselined proof file is
        # deleted, if a journey/proof stops emitting its manifest, or if the
        # hierarchy doc references a proof file that no longer exists — the
        # silent-rot class that no individual test would catch.
        run: npm run ci:proof-tier

      - name: Proof tier — schema contracts + golden journeys + export contracts
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # These run inside `npm test` too, but they get their own blocking step
        # because they are the acceptance evidence for the C-8/C-10/C-11/C-12/
        # C-14/C-16 remediations and must fail loudly and early, not be buried in
        # a full-suite run. They need no external database: the harness applies
        # the real migration files to an in-process Postgres (PGlite). The
        # export-contract proofs reopen real emitted PDF/DOCX bytes with
        # independent readers (tiers 6-7 of the proof hierarchy).
        run: npm run test:proof-tier

      - name: Guardrails — i18n locale integrity (key/placeholder/markup parity)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: node scripts/ci/check-i18n-integrity.mjs

      # ── Honest-state gates ──────────────────────────────────────────────────
      # These five lived only in pr-checks.yml, which runs on pull_request — and
      # under CLAUDE.md Rule 0 there are no pull requests, so they had never
      # once run in CI on the trunk. Every catch they made was someone running
      # them by hand. They run here, on every push, like the rest.
      - name: Guardrails — surfaces are discoverable, or declared not to be
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:surface-discoverability

      - name: Guardrails — no API route or table name in user-visible copy
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:internals-in-copy

      - name: Guardrails — no clearance copy chosen by an empty collection
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:empty-state-honesty

      - name: Guardrails — no control promising an action it only asks about
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:action-overclaim

      - name: Guardrails — no success message before the response is checked
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:success-before-ok

      - name: Guardrails — no invented signer or applicant identity
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:fabricated-identity

      - name: Guardrails — audit_logs fixtures accept the audit writer's columns
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The chained audit write is fail-closed: the §11.10(e) row and the
        # mutation it records commit together or neither does. A test fixture
        # whose audit_logs lacks a column writeChainedAuditRow writes does not
        # merely skip the log — it rolls the mutation back, so the suite can
        # only stay green by never reaching a governed write. Eleven fixtures
        # were in that state, which is how the section save went un-chained
        # without a single test noticing. Zero baseline.
        run: npm run ci:audit-logs-fixture

      - name: Guardrails — tenant column types (no TEXT-typed tenant cols)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:tenant-column-types

      - name: Guardrails — org path params are checked against the caller
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # IDOR class. RLS does not backstop it: organization_users, api_keys and
        # four other tables are deliberately unpoliced so they can be read
        # pre-auth, so for routes touching them the application check is the
        # ONLY control. Zero baseline — all 43 routes pass today.
        run: npm run ci:org-path-param-guards

      - name: Guardrails — every biostat form field is one the server reads
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The workbench declares its calculators as data; the handlers read
        # req.body untyped and ignore anything unrecognised. So a mistyped key
        # does not throw and does not 400 — the form renders, the request
        # succeeds, the server silently uses its default, and the user is shown
        # a number computed from an input they believe they supplied. No type in
        # either language spans that boundary. Zero baseline.
        run: npm run ci:biostat-calculator-keys

      - name: Guardrails — no tenant-blind Drizzle models
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Sibling to the gate above, and deliberately separate: that one checks
        # the TYPE of a declared tenant column and cannot see one that is
        # ABSENT. A model missing the column leaves every route built on it
        # structurally unable to filter by tenant.
        run: npm run ci:tenant-blind-models

      - name: Guardrails — WCAG AA contrast on design tokens
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Contrast is arithmetic on two hex values, so this cannot drift into
        # false positives. It caught --error never being declared for dark mode:
        # the light red cascaded onto the dark page at 2.69:1, under even the
        # 3:1 non-text floor.
        run: npm run ci:token-contrast

      - name: Guardrails — tenant-isolation in raw SQL (no regressions)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:tenant-isolation:no-regression

      - name: Guardrails — every tenant entry point considers entitlement
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Isolation asks "can A see B's data"; this asks "may A be operating at
        # all", on every way INTO tenant data — not just the /api chain the
        # lifecycle guard is mounted on. Four surfaces (the public API, two
        # sockets, a cron sweep) were found bypassing that guard one at a time;
        # this makes the surface enumerable instead of found-by-reading.
        run: npm run ci:tenant-entry-points

      - name: Guardrails — request values must not reach a path unconstrained
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # RLS protects rows; it does nothing for files. Three instances of the
        # same shape were found by hand in one afternoon — one of them MOUNTED,
        # with the per-tenant vault inside its allowlist, so one customer could
        # read another's regulatory document. Finding the fourth by reading code
        # is not a plan. Express decodes %2F, so a single route param can carry
        # `../../` — "it is only one segment" is not a defence.
        run: npm run ci:path-containment

      - name: Guardrails — workflows must not invoke files that do not exist
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:workflow-targets

      - name: Guardrails — ECS deploy uses pinned task-def revisions (rollback safety)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The production deploy registers a pinned task-def revision
        # (image @sha256:<digest>) and updates the service by ARN.
        # --force-new-deployment is banned because it cannot guarantee a
        # specific image is deployed. Re-introducing it defeats rollback.
        run: bash scripts/check_no_force_new_deployment.sh

      - name: Guardrails — tenant baseline ↔ justification parity
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:baseline-justifications

      - name: Guardrails — requestDb (RLS) adoption (no regressions)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: node scripts/ci/audit-requestdb-coverage.mjs --strict-no-regression

      - name: Guardrails — no leaky dev-auth gates in prod paths
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:no-dev-auth-in-prod

      - name: Guardrails — password hygiene
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:password-hygiene

      - name: Guardrails — SAML SSO fail-closed (no auth bypass)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:saml-fail-closed

      - name: Guardrails — design-system non-negotiables (Lucide-only, no spring)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:design-system

      - name: Guardrails — regulated-data delete audit coverage (Part 11)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:regulated-delete-audit

      - name: Guardrails — no unreachable catch around an audit write (Part 11)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: |
          npm run ci:dead-audit-catch:self-test
          npm run ci:dead-audit-catch

      - name: Guardrails — route mount authority audit (no regressions)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:audit-route-mounts:no-regression

      - name: Guardrails — route ownership matrix artifact (required review evidence)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:route-ownership-matrix:check

      - name: Guardrails — AI gateway bypass (no direct LLM clients)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:gateway-bypass

      - name: Guardrails — jwt.verify pins algorithms (no alg-confusion)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:jwt-verify-pinned

      - name: Guardrails — legacy dependency quarantine (supabase-js, aws-sdk v2)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-legacy-dep-quarantine

      - name: Guardrails — no mock data in prod routes (no regressions)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:no-mock-in-prod-routes

      - name: Guardrails — js/ts shadow guard (no new same-basename .js/.ts pairs)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:js-ts-shadows

      - name: Guardrails — DOCX runtime canonicality (approved runtimes only)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-docx-runtime

      - name: Guardrails — PDF runtime canonicality (approved entry points only)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-pdf-runtime

      - name: Guardrails — cross-shell CSS collisions (ratchet, may only shrink)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-shell-css-collisions

      # Same selector defined twice unconditionally in one file: the later rule
      # wins silently. jsdom applies no stylesheet, so a component test asserts
      # a correct DOM while the pixels are wrong — no other gate here sees it.
      - name: Guardrails — CSS selector shadowing (allowlist, may only shrink)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-css-selector-shadowing

      # A literal `tone-*` class with no CSS rule renders an unstyled chip.
      # Same blind spot as above: jsdom applies no stylesheet, so a component
      # test passes while the chip has no appearance. A prose warning was tried
      # first and was copied past twice.
      - name: Guardrails — chip tones must have a CSS rule
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-chip-tones

      # `.de-toast .ico` is green, so a one-tone toast announces failures with a
      # success tick. Twenty-eight surfaces had each hand-rolled that one-tone
      # toast, so fixing it on Word export and on the §11.50 signature dialog
      # left twenty-six. Now there is one implementation and this refuses a
      # twenty-ninth — including the invisible case, a tone narrowed away at a
      # prop boundary, which TypeScript accepts without a word.
      - name: Guardrails — one toast implementation, and it can say "failed"
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:toast-canonicality

      - name: Guardrails — phantom design tokens (ratchet, may only shrink)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-phantom-tokens

      - name: Guardrails — client reachability from main.tsx (ratchet, may only shrink)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-client-reachability

      # The server-side counterpart, and the one that cost the most. Six bootstrap
      # files loaded their routers as `import(c.mod)` with a runtime string;
      # esbuild cannot resolve those, so 112 route families and all 13 regional
      # blueprints were absent from dist/index.js while the boot log reported each
      # as mounted. This builds the real bundle and asks the metafile, so a fix
      # that regresses is caught before it ships rather than by a 404 in
      # production. ~40s — too slow for the unit suite, which is why it is a step.
      - name: Guardrails — every registered route + blueprint reaches the bundle
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-bundle-reachability

      # The level below the mount audit. Two routers sharing an app.use prefix is
      # legitimate composition, but if both define the same method+path Express
      # keeps the first and the second is unreachable — the same silence that hid
      # six duplicate ops endpoints, one layer deeper. 10 prefixes here carry more
      # than one router; this asserts none of them collides.
      - name: Guardrails — no route defined twice under a shared prefix
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-route-collisions

      # A rule pack is the outline a customer's submission gets built against,
      # and they do not all have the same standing: ICH M4 is a harmonised
      # standard, 21 CFR 814.20(b) enumerates its own contents, and a UK device
      # outline is a reasoned construction because UK MDR 2002 enumerates
      # nothing. The table asserted all of them with equal authority until
      # migrations/20260810c. This keeps a newly seeded pack from going back to
      # saying nothing about where it came from.
      - name: Guardrails — every rule pack declares what it was built from
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-rule-pack-provenance

      # The direction nobody was asking. `audit:orphaned-endpoints` finds server
      # routes nobody calls; this finds CLIENT CALLS with no server route, which
      # is the one that costs a customer something. Asking it the first time
      # found twelve surfaces whose endpoints 404d while the UI showed fixture
      # data and no error.
      - name: Guardrails — every client /api call has a server route
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-client-api-calls

      # tsconfig's include does not cover tests/, so `tsc --noEmit` has never
      # looked at a test file. This is the piece of that coverage that matters:
      # a test importing a module that no longer exists cannot run at all.
      - name: Guardrails — every local import in every test file resolves
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-test-imports

      # A stylesheet nothing imports is never handed to the bundler, so it
      # styles nothing on any surface. Ratchet at the measured 17; may only
      # shrink, by deleting a dead sheet or restoring a missing import.
      - name: Guardrails — orphaned stylesheets (ratchet, may only shrink)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-orphaned-stylesheets

      # A test file whose name matches no include glob is not reported as
      # skipped — it is not reported at all, so the suite goes green and the
      # file looks like coverage indefinitely. client/src/__tests__/
      # FileContext.test.jsx had never run once, covering live code.
      - name: Guardrails — every test file is reachable by a runner
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-unrun-tests

      # tests/setup.ts mocks `pg` for the whole default project, and the
      # "Integration Tests" job below — which stands up a real Postgres and
      # applies migrations to it — ran under that mock: every query resolved to
      # { rows: [], rowCount: 0 } without a packet leaving the process, so the
      # DB-backed suite proved nothing and reported green. Real-database tests
      # are now `*.dbtest.ts` under vitest.db.config.ts, excluded from every
      # mocked config. This fails the PR that would undo that separation.
      - name: Guardrails — real-database tests never inherit the pg mock
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:db-test-isolation

      - name: Guardrails — embedding runtime canonicality (corpus policy)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-embedding-runtime

      - name: Guardrails — editor extension integrity (@tiptap imports declared)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:check-editor-integrity

      - name: Guardrails — Reasoning Tier readiness suite (governed exports + GA evidence)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Aggregate of ci:governed-export-routes, ci:governed-export-consequence-shape,
        # ci:reasoning-tier-ga-readiness and ci:reasoning-tier-uat-evidence — the gate
        # named as a GA criterion in docs/release/REASONING_TIER_GA_GATES.md.
        run: npm run ci:reasoning-tier-readiness

      - name: Guardrails — design-token cascade (ADVISORY)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Advisory-only: 12 pre-existing unresolved var() references live in
        # client/src/concept2cure/{biopharma,pdev}/app.css and
        # client/src/styles/projects-prototype.css (module-scoped --rail-*/--pdev-*
        # layout vars plus --border-100/--border-200/--error-text aliases). The fix
        # belongs in those stylesheets / the index.css shim. Flip to blocking once
        # `npm run ci:token-cascade` is clean.
        continue-on-error: true
        run: npm run ci:token-cascade

      - name: Audit — repo health scan (no regressions)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run audit:repo-health:no-regression

      - name: Audit — orphaned endpoints (threshold 600)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # Regenerates docs/reports/orphan-endpoints-latest.{json,md} and fails
        # if the orphan count exceeds 570 (current: 556). Ratchet the threshold
        # down in package.json as the backlog is triaged.
        #
        # Tightened from 900 -> 600 -> 570. The count had fallen to 556 without
        # the gate following it, leaving 344 of slack — enough for the backlog
        # to grow by more than half again while CI reported green. A ratchet
        # that trails reality by that much is not a ratchet.
        #
        # The 14 of remaining headroom is deliberate, for the reason the 600
        # step gave: a feature branch legitimately adds endpoints before the
        # client that calls them exists, and a PR adding more than that is worth
        # a conversation rather than a silent pass.
        #
        # Why 570 and not 556. Orphans are computed as `declared - consumed`, so
        # this gate is equally sensitive to DELETING CLIENT CODE as to adding
        # endpoints. Pinned at exactly 556, a PR that removes the last caller of
        # a few endpoints fails CI having added none — the gate would punish
        # deleting dead client code, which is the opposite of what it is for.
        # The 2026-07 audit originally proposed 556; that was wrong, and this
        # comment is the rebuttal. See Chapter 15, "Correction to item 0.8".
        run: npm run audit:orphaned-endpoints:strict

      - name: Upload governance audit artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governance-audits-lint
          path: |
            docs/reports/repo-health-scan-latest.json
            docs/reports/route-mount-audit-latest.json
            docs/reports/route-ownership-matrix-latest.md
            docs/reports/orphan-endpoints-latest.json
            docs/reports/orphan-endpoints-latest.md
          retention-days: 14

      # ── The verification steps below run even when a guardrail above failed ──
      #
      # These three are the only steps in this job that read the TypeScript
      # source, and until now they were steps 71-73 of 73. GitHub skips every
      # remaining step once one fails, so ANY of the ~70 guardrails above
      # silently disabled all three — and a skipped step is not red, it is
      # simply absent from the summary.
      #
      # Observed, not theorised: on b3b2005 the tenant-isolation guardrail
      # (step 29) failed, so ESLint and the typecheck gate never ran. The
      # typecheck restoration that had just landed was invisible in CI, and
      # every downstream job (`needs: lint`) skipped with it.
      #
      # `!cancelled()` — not `always()` — so a deliberately cancelled run still
      # stops. The job still fails if a guardrail failed; these simply also
      # report, so a green typecheck can never again be indistinguishable from
      # one that was never executed.
      - name: Run ESLint
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # JSON to a file so the warning ratchet below reuses THIS run instead
        # of linting the tree twice; the exit code still enforces 0 errors.
        # Readable output for humans is re-rendered only on failure.
        run: npx eslint . --format json --output-file eslint-report.json

      - name: Render ESLint findings (failure only)
        if: failure()
        run: npm run lint || true

      - name: Guardrails — ESLint warning ratchet (may only shrink)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run ci:eslint-ratchet
        env:
          ESLINT_RATCHET_REPORT_JSON: eslint-report.json

      # Every node:test suite under scripts/ci/__tests__ — the guards' own
      # fail-closed proofs — runs on every push, so a guard whose detection
      # logic regresses cannot keep passing silently.
      - name: Guardrails — CI guard self-tests
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run test:ci-scripts

      - name: Run TypeScript check (no regression vs baseline)
        if: "!cancelled() && steps.install.conclusion == 'success'"
        # The .typecheck-baseline.json count has been ratcheted down to 0
        # (from ~2,598 when the server/routes/auth.ts parse error was fixed
        # and the pre-existing debt became visible), so this gate now fails
        # on ANY type error. It stays on the no-regression harness (same
        # pattern as ci:migration-prefix-collisions) so the baseline history
        # is preserved and any future intentional baseline change remains an
        # explicit, reviewed edit.
        run: npm run ci:typecheck:no-regression

      - name: Run beta-slice TypeScript check
        if: "!cancelled() && steps.install.conclusion == 'success'"
        run: npm run beta:typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    # Runs even when `lint` fails. `needs` still orders it after lint, but
    # without this a single broken guardrail SKIPS the entire suite — and a
    # skipped job reports neither pass nor fail.
    #
    # That is not hypothetical. One failing step (Proof tier) held this job
    # skipped for three days, and when it finally ran it was 35 failures across
    # 20 files. None of them was a product bug: every one was a fixture that had
    # not kept up with a fail-closed guard someone added deliberately. So each of
    # those guards had shipped unverified, and the debt compounded silently
    # because the suite that would have shown it never ran.
    #
    # The marginal cost is small and lands exactly where it is wanted: this job
    # already runs on every push where lint passes, so the only ADDITIONAL runs
    # are the ones where lint is broken — which is precisely when you most need
    # to know whether the tests still pass.
    if: '!cancelled()'
    # Primary test gate now runs against a real Postgres so the safety-critical
    # RLS/tenant-isolation/audit/migration suites EXECUTE here instead of
    # self-skipping on a missing DB (they previously "passed" by skipping —
    # false assurance, GA testing finding). Mirrors the proven integration-tests
    # service + migration setup. RUN_INTEGRATION_TESTS is intentionally NOT set,
    # so this stays the DB-backed CORE suite while integration-tests remains the
    # heavier full-integration gate.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: concept2cure-ri_test
          # Auth method = trust; no credential literal in the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"; exit 1

      - name: Install Postgres client + xmllint (eCTD qualification)
        # libxml2-utils provides xmllint, which the eCTD qualification harness
        # (server/services/ectd/qualification) uses to validate generated
        # backbones for real. Its suite skipIf's when the binary is absent —
        # installing it here is what makes CI actually run that conformance
        # evidence rather than silently skipping it.
        run: sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils

      - name: Setup Python (document runtime)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install document runtime (python-docx + lxml)
        # Enforces the AnA document-surgery e2e (author/build/surgical/validate/
        # verify) instead of letting it self-skip. Versions pinned to
        # requirements.txt so CI exercises the same runtime AnA uses in prod.
        run: pip install "python-docx==1.2.0" "lxml==6.1.1"

      - name: Apply GCC migrations
        run: |
          for migration in $(ls db/migrations/*_gcc_*.sql | sort); do
            echo "Applying $migration"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      - name: Run tests
        run: npm test
        env:
          CI: true
          # Require the document runtime here: the AnA doc-surgery e2e FAILS
          # (does not skip) if python-docx is unavailable, so a broken runtime
          # can never masquerade as a pass.
          ANA_DOCX_E2E_REQUIRED: '1'
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

  coverage:
    name: Coverage (advisory)
    runs-on: ubuntu-latest
    needs: lint
    # Closes the GA testing finding "never measures coverage". Runs the vitest
    # suite with the v8 coverage provider against a real Postgres so the
    # DB-backed paths are counted, and reports the numbers every run. Advisory
    # for now (thresholds overridden to 0 in test:coverage so it never blocks) —
    # the 70/60/70/70 target in vitest.config.ts is the goal; once the suite
    # reaches it, drop the threshold overrides in test:coverage to enforce.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: concept2cure-ri_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply GCC migrations
        run: |
          for migration in $(ls db/migrations/*_gcc_*.sql | sort); do
            echo "Applying $migration"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      # @vitest/coverage-v8 is an OPTIONAL peer of vitest, so `npm ci` does not
      # install it. Install it transiently (--no-save keeps package.json and the
      # lockfile untouched / in sync for every other job) just for this advisory
      # coverage run.
      - name: Install coverage provider
        run: npm install --no-save @vitest/coverage-v8@4.1.7

      - name: Measure coverage
        # Inlined (not a package.json script) so package.json stays unchanged —
        # this is an advisory CI-only measurement. Thresholds overridden to 0 so
        # it reports actual coverage every run without ever blocking; the
        # 70/60/70/70 target in vitest.config.ts is the goal to enforce later.
        # continue-on-error: this job MEASURES coverage; it must never fail the
        # PR (test pass/fail is owned by the Test job, not this one).
        continue-on-error: true
        run: NODE_OPTIONS="--max-old-space-size=4096" npx vitest run --config vitest.config.ts --coverage --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
        env:
          CI: true
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  security-tests:
    name: Security Contract Tests
    runs-on: ubuntu-latest
    # Intentionally independent of `lint`. The other test jobs `needs: lint`, so
    # they are skipped whenever the lint job is red (e.g. pre-existing
    # tenant-isolation baseline drift). A security regression must always report,
    # so this gate runs on its own.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"; exit 1

      # Tenant-isolation + prompt-injection contract tests. These mock the data
      # layer (no DB), so they run fast and gate every PR independently of the
      # heavier DB-backed suite.
      - name: Run security contract tests
        run: npm run test:security
        env:
          CI: true

  ana-readiness-tests:
    name: AnA Readiness Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"; exit 1

      - name: Run AnA readiness suite
        run: npm run test:ana
        env:
          CI: true
          SKIP_DB_STARTUP_TEST: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concept2cure-ri_test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: concept2cure-ri_test
          # Auth method = trust; no credential literal in the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"; exit 1

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply GCC migrations
        run: |
          for migration in $(ls db/migrations/*_gcc_*.sql | sort); do
            echo "Applying $migration"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      - name: Smoke — apply RLS rollout migrations (0019/0020/0021)
        # These migrations target the production schema. The smoke runs
        # against a SEPARATE fresh DB (not the one the GCC migrations
        # mutated above) so it tests "SQL parses + executes cleanly on
        # an empty schema" — the original intent. Running it against
        # the GCC-loaded DB would also exercise the seed-data drift the
        # 0020 + 0021 coercers are supposed to catch in production,
        # which is what 0019's audit step already covers separately.
        run: |
          PAGER=cat psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS "concept2cure-ri_rls_smoke"' \
            -c 'CREATE DATABASE "concept2cure-ri_rls_smoke"'
          for f in \
            migrations/0019_tenant_column_audit.sql \
            migrations/0020_coerce_text_tenant_columns.sql \
            migrations/0021_enable_rls_everywhere.sql; do
            echo "Applying $f"
            PAGER=cat psql "$DATABASE_URL_SMOKE" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          DATABASE_URL_ADMIN: postgresql://postgres@localhost:5432/postgres
          DATABASE_URL_SMOKE: postgresql://postgres@localhost:5432/concept2cure-ri_rls_smoke

      - name: Run integration tests
        # vitest tests read DATABASE_URL via server/db/runtime.ts (per
        # server/db/getDatabaseUrl.ts the env-var fallback order is
        # DATABASE_URL → NEON_DATABASE_URL → DATABASE_NEON_NEW_SECRET).
        # The job had only TEST_DATABASE_URL set, so the pool couldn't
        # connect and ~100 server-side test files failed with
        # "Database connection not available." Mirror the value to
        # DATABASE_URL so the runtime actually sees it.
        run: npm test
        env:
          CI: true
          RUN_INTEGRATION_TESTS: 'true'
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      # ── The step that actually uses the database this job provisions ────────
      #
      # Everything above runs under tests/setup.ts, which mocks `pg` process-
      # wide. That mock is right for unit tests and wrong here: it meant this
      # job — a real PostgreSQL service, real migrations applied to it — never
      # opened a socket from a test. `new Pool().query(...)` answered
      # { rows: [], rowCount: 0 }, and an empty result is indistinguishable from
      # a query that never ran, so the suite was green either way.
      #
      # `*.dbtest.ts` runs under vitest.db.config.ts with NO pg mock, and
      # tests/setup.db.ts fails the run if one is ever present. It also fails
      # rather than skips when the database is unreachable: a database test that
      # quietly does not run is the defect this whole split exists to end.
      #
      # RLS_ENFORCE=on is the mode production hard-requires, and until this step
      # existed no CI job ran a single test in it.
      # ── The database the real-database tests actually need ──────────────────
      #
      # These suites were pointed at concept2cure-ri_test, which this job builds
      # from the `*_gcc_*` migrations alone. That schema has `organizations` and
      # almost nothing else — no `users`, no `audit_logs`, no `c2c_documents`,
      # no `regulatory_programs`, no `unified_documents`, and neither
      # `organizations_slug_unique` nor `users_email_unique`. So
      # c2c-project-persistence died in beforeAll with `42P10 invalid ON CONFLICT
      # specification` (no unique index to infer an arbiter from) and
      # workflow-approval-tables with `42P01 relation "unified_documents" does
      # not exist` — 18 assertions never ran.
      #
      # Nobody had seen it: this step only executes when the step above it
      # passes, and that one had been failing. The moment it went green, these
      # two surfaced.
      #
      # The right database for a suite whose whole premise is "the real deployed
      # shape" is one built the way a deployment builds it. install-fresh cannot
      # run over the GCC-migrated database (it fails applying
      # 0005_csr_knowledge_database.sql onto that partial schema), so this
      # provisions a SEPARATE one from blank — the same install-fresh +
      # deploy-migrate pair blank-db-provisioning proves works. Verified: 8 files
      # / 65 tests pass against it, versus 2 files failing on the GCC-only one.
      - name: Provision a deploy-shaped database for the real-database tests
        run: |
          set -euo pipefail
          PAGER=cat psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS "concept2cure-ri_dbtest"' \
            -c 'CREATE DATABASE "concept2cure-ri_dbtest"'
          node scripts/db/install-fresh.mjs
          node scripts/db/deploy-migrate.mjs
        env:
          ADMIN_URL: postgresql://postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_dbtest
          APP_SERVICE_DB_PASSWORD: ci-dbtest-app-service-password

      - name: Run real-database tests (unmocked pg, RLS_ENFORCE=on)
        run: npm run test:db
        env:
          CI: true
          NODE_ENV: test
          RLS_ENFORCE: 'on'
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_dbtest
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_dbtest
          APP_DATABASE_URL: postgresql://app_service:ci-dbtest-app-service-password@localhost:5432/concept2cure-ri_dbtest

  # ── Blank-database provisioning + deploy-migration proof ──────────────────
  #
  # C2C-DB-001 / REM-7. Proves, against a genuinely empty Postgres, that:
  #   1. the deploy-time migration REFUSES an unprovisioned database (exit 3)
  #      instead of laying an island of tables onto an empty schema;
  #   2. the from-scratch installer turns that empty database into the full
  #      application schema;
  #   3. the deploy-time migration then succeeds and its readiness contract
  #      holds — the same contract /readyz enforces at boot; and
  #   4. re-running it is a no-op, because a deploy runs it on every release.
  #
  # This exists because "the provisioning path works" was, until now, a claim no
  # job tested. Every other DB-backed job here runs against a schema some earlier
  # step already created, so a break in the from-scratch path would surface for
  # the first time on a real deployment.
  blank-db-provisioning:
    name: Blank DB Provisioning + Deploy Migration
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        # pgvector, not stock postgres: the installer creates the `vector`
        # extension, which stock postgres cannot provide.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: c2c_blank_proof
          # Auth method = trust; no credential literal in the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sslmode=disable so scripts/db/connection.mjs selects the local, no-TLS
      # branch rather than trying to verify a certificate the service has none of.
      DATABASE_URL: postgresql://postgres@localhost:5432/c2c_blank_proof?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"; exit 1

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Assert the database really is blank
        run: |
          COUNT=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables before provisioning: $COUNT"
          [[ "$COUNT" == "0" ]] || { echo "::error::Fixture is not a blank database"; exit 1; }

      - name: Deploy migration must REFUSE an unprovisioned database
        # The fail-closed leg. Exit 3 is deploy-migrate.mjs's distinct
        # "never provisioned" code; any other outcome — success included — is a
        # failure of this test, because succeeding here would mean the deploy
        # path is willing to half-provision production.
        run: |
          set +e
          node scripts/db/deploy-migrate.mjs
          CODE=$?
          set -e
          echo "exit code: $CODE (expected 3)"
          [[ "$CODE" == "3" ]] || { echo "::error::Expected exit 3 on a blank DB, got $CODE"; exit 1; }

          AFTER=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables after refusal: $AFTER"
          [[ "$AFTER" == "0" ]] || { echo "::error::Refused run still created $AFTER tables"; exit 1; }

      - name: Provision from scratch
        run: node scripts/db/install-fresh.mjs

      - name: Deploy migration succeeds on the provisioned database
        run: node scripts/db/deploy-migrate.mjs

      - name: Deploy migration is idempotent (every release re-runs it)
        run: node scripts/db/deploy-migrate.mjs

      - name: RLS coverage — every org-keyed table carries the tenant policy
        # The live two-tenant policy behaviour is proven by
        # server/db/__tests__/rlsPolicy.integration.test.ts. This is the COVERAGE
        # half the burndown flagged as environment-blocked: on the fully
        # provisioned + deploy-migrated schema (install-fresh applies 0021 in
        # step 6/8; deploy-migrate then adds the C2C set but does NOT re-run
        # 0021), assert NO org-keyed base table was left without
        # tenant_isolation_policy. A non-empty result is an unprotected tenant
        # table — exactly the silent gap a later C2C migration could introduce.
        run: |
          set -euo pipefail
          UNPROTECTED=$(psql "$DATABASE_URL" -tA -f scripts/db/rls-coverage-check.sql)
          if [[ -n "$UNPROTECTED" ]]; then
            echo "::error::org-keyed base table(s) missing tenant_isolation_policy after full provisioning + deploy-migrate:"
            echo "$UNPROTECTED"
            exit 1
          fi
          echo "RLS coverage OK: every non-allowlisted org-keyed base table carries tenant_isolation_policy."

      - name: Verify the readiness contract independently
        # deploy-migrate.mjs checks this itself; asserting it again from psql
        # means a regression in the script's own verification cannot hide a
        # regression in the schema.
        run: |
          set -euo pipefail
          check() {
            local label="$1" expected="$2" sql="$3"
            local actual
            actual=$(psql "$DATABASE_URL" -tAc "$sql")
            echo "$label: $actual (expected $expected)"
            [[ "$actual" == "$expected" ]] || { echo "::error::$label = $actual, expected $expected"; exit 1; }
          }

          check "authoring subsystem tables" 11 "
            SELECT count(*) FROM information_schema.tables
             WHERE table_schema='public' AND table_name IN (
               'authoring_documents','authoring_sections','doc_revisions','authoring_comments',
               'authoring_citations','frozen_documents','user_pins','authoring_audit_trail',
               'authoring_signatures','authoring_workflow_steps','doc_permissions')"

          check "tenant-parentage FKs" 4 "
            SELECT count(*) FROM pg_constraint WHERE conname IN (
              'authoring_sections_doc_tenant_fkey','doc_revisions_section_tenant_fkey',
              'authoring_comments_section_tenant_fkey','authoring_citations_section_tenant_fkey')"

          check "authoring tables carrying tenant_isolation_policy" 11 "
            SELECT count(*) FROM pg_policies
             WHERE schemaname='public' AND policyname='tenant_isolation_policy'
               AND tablename IN (
                 'authoring_documents','authoring_sections','doc_revisions','authoring_comments',
                 'authoring_citations','frozen_documents','user_pins','authoring_audit_trail',
                 'authoring_signatures','authoring_workflow_steps','doc_permissions')"

          # Lineages that reached real databases through no durable path before
          # the migration set existed — their absence is what made the RBM and
          # evidence-graph routes write to tables that were not there.
          check "collaboration CRDT state table" 1 "
            SELECT count(*) FROM information_schema.tables
             WHERE table_schema='public' AND table_name='collab_document_state'"

          RBM=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'rbm\\_%'")
          CRE=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'cre\\_%'")
          echo "rbm_* tables: $RBM · cre_* tables: $CRE"
          [[ "$RBM" -ge 8 ]] || { echo "::error::RBM lineage did not land ($RBM tables)"; exit 1; }
          [[ "$CRE" -ge 6 ]] || { echo "::error::Evidence spine did not land ($CRE tables)"; exit 1; }

      - name: Post-deploy invariants hold on the real deployed database
        # The end-to-end backstop for the reachability / identity / isolation
        # program (ledger C-31 → C-40). The static guards reason about SQL text;
        # this runs against the database install-fresh + deploy-migrate just
        # built, and asserts the invariants only a real deploy can show: NO
        # integer-tenant table left unpoliced across the WHOLE schema, the
        # enhanced-cortex atom FKs actually created, pgvector loaded, and every
        # consumer query that was once a live 500 now executing. A regression
        # here fails the build on a real DB before it can ship.
        run: node scripts/db/deploy-smoke-assert.mjs

      - name: Server SQL resolves against the LIVE provisioned schema (ratchet)
        # The two static table guards (ci:unbacked-tables, ci:migration-
        # reachability) compare the repo to itself — "does some .sql file on
        # some applier's list claim to create this table?" — a question the
        # repository can always answer yes to. The 2026-08 assessment counted
        # ~85 server-queried tables that do not exist after a full successful
        # provisioning run while both guards reported green over every one.
        # This guard asks the only question that settles it: it takes the SAME
        # server-referenced table set (importing the reachability parser, not
        # re-implementing it) and resolves each name against the database this
        # job just built from nothing. First real census: 98 absent, baselined;
        # the baseline may only shrink, and any NEW absence fails the build.
        # It belongs in THIS job because this is the one place in CI where a
        # database produced by the real installers exists to ask.
        run: npm run ci:tables-live-schema

      - name: Guardrails — what a tenant purge cannot reach (ratchet)
        # tenant-offboarding.ts purges via PURGE_CHILD_TABLES — 8 tables — and
        # UPDATEs the organizations row to 'purged' rather than deleting it, so
        # nothing cascades from there. Against this freshly provisioned schema,
        # 666 tables carry organization_id; following every ON DELETE CASCADE
        # out of those 8 reaches 74. The other 615 still hold the tenant's rows
        # after an erasure, and only 19 of them are the audit/billing records
        # the implementation deliberately keeps.
        #
        # This does NOT re-implement the purge (that service is owned
        # elsewhere). It measures the gap so the number is checkable, and
        # ratchets it: a NEW org-keyed table outside the purge's reach fails the
        # build. The gap grew to 615 precisely because nothing was watching.
        # Same job for the same reason as the guard above — this is the one
        # place in CI with a database the real installers built.
        run: npm run ci:purge-coverage

  # ── Production boot smoke — the shipped build must actually serve ──────────
  #
  # Every other DB-backed job here proves something about the SCHEMA. None of
  # them ever started the application. That gap was not theoretical: with
  # RLS_ENFORCE=on — the ONLY value production accepts (server/db/
  # rlsEnforcement.ts refuses to boot on unset/off/shadow) — the shipped build
  # threw
  #
  #   [tenant-rls] FAIL-CLOSED: pool.query requires an active tenant scope
  #
  # as an uncaughtException out of registerPreStartRoutes and shut down before
  # it ever listened. An estate-wide catalog check (assertAuthoringAuthorization
  # Ready) issued an unscoped pool.query, which instrumentation blocks once
  # enforcement is on. No job noticed, because no job booted the app.
  #
  # So this one does the whole thing the way a deploy does:
  #   blank DB → install-fresh → deploy-migrate → npm run build → node dist/
  # with NODE_ENV=production, RLS_ENFORCE=on, and the runtime connected as the
  # NON-SUPERUSER app_service role (APP_DATABASE_URL) over TLS — then asserts
  # /readyz returns 200. That is Postgres RLS actually filtering, not merely
  # compiled: a superuser or BYPASSRLS runtime role would make all ~790 policies
  # inert, and the boot posture check fails closed on exactly that.
  #
  # Postgres runs as a plain container rather than a `services:` block because
  # production hard-requires TLS with rejectUnauthorized (server/db/ssl.ts), so
  # the server needs certificates mounted — which a service block cannot do.
  production-boot-smoke:
    name: Production Boot Smoke (RLS on, non-superuser role)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm ci failed after 3 attempts"; exit 1

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Production forces TLS verification, so the server must present a cert
      # the runtime trusts (NODE_EXTRA_CA_CERTS below). Self-signed is fine —
      # what is being proven is that the TLS path works, not who signed it.
      - name: Start PostgreSQL with TLS
        run: |
          mkdir -p "$RUNNER_TEMP/pgcerts"
          openssl req -new -x509 -days 2 -nodes -text \
            -out "$RUNNER_TEMP/pgcerts/server.crt" \
            -keyout "$RUNNER_TEMP/pgcerts/server.key" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          # The postgres user inside the image (uid 999) must own the key, and
          # the server refuses to start if it is group/world readable.
          sudo chown 999:999 "$RUNNER_TEMP/pgcerts/server.key" "$RUNNER_TEMP/pgcerts/server.crt"
          sudo chmod 600 "$RUNNER_TEMP/pgcerts/server.key"
          docker run -d --name pgboot \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=c2c_boot \
            -p 5432:5432 \
            -v "$RUNNER_TEMP/pgcerts:/certs:ro" \
            pgvector/pgvector:pg15 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 1 45); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done
          psql "postgresql://postgres@localhost:5432/c2c_boot?sslmode=require" \
            -tAc "SELECT 'TLS handshake OK'"

      - name: Provision the schema from scratch (owner connection)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
          node scripts/db/install-fresh.mjs
          node scripts/db/deploy-migrate.mjs
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/c2c_boot
          # Mints the non-superuser runtime role the boot below connects as.
          # Without it the installers are a no-op on this step and the app would
          # fall back to the owner connection — which is the posture this job
          # exists to reject.
          APP_SERVICE_DB_PASSWORD: ci-boot-smoke-app-service-password

      - name: The runtime role must be non-superuser and NOBYPASSRLS
        run: |
          POSTURE=$(psql "postgresql://postgres@localhost:5432/c2c_boot" -tAc \
            "SELECT rolsuper::text || ',' || rolbypassrls::text FROM pg_roles WHERE rolname='app_service'")
          echo "app_service rolsuper,rolbypassrls = $POSTURE"
          if [ "$POSTURE" != "false,false" ]; then
            echo "::error::app_service must be NOSUPERUSER and NOBYPASSRLS; got $POSTURE."
            echo "A superuser or BYPASSRLS runtime role makes every RLS policy inert."
            exit 1
          fi

      - name: Build the production bundle
        run: npm run build

      # The assertion: the built server, in production mode, under the only RLS
      # value production accepts, as the least-privilege role, reaches ready.
      - name: Boot in production mode and require /readyz=200
        run: |
          node dist/index.js > "$RUNNER_TEMP/boot.log" 2>&1 &
          BOOT_PID=$!
          READY=""
          # 300s, not 90s. Boot takes ~7s on a warm local machine but far longer
          # on a cold runner: the first attempt failed here with the process
          # still alive and mid-startup ("[MEMORY] High memory usage: 97%",
          # schedulers still registering). That is a slow runner, not a boot
          # failure, and a smoke test that reports one as the other is worse
          # than no smoke test. The loop still exits IMMEDIATELY if the process
          # dies, so a genuine failure is not made slower by this budget.
          for i in $(seq 1 300); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5199/readyz || true)
            if [ "$CODE" = "200" ]; then READY="yes"; echo "/readyz=200 after ${i}s"; break; fi
            if ! kill -0 $BOOT_PID 2>/dev/null; then
              echo "::error::the server exited during boot (last /readyz code: ${CODE:-none})."
              break
            fi
            # Progress every 30s so a hang is distinguishable from a slow start.
            if [ $((i % 30)) -eq 0 ]; then echo "…still booting at ${i}s (last /readyz: ${CODE:-none})"; fi
            sleep 1
          done
          if [ -z "$READY" ]; then
            # The body names the failing dependency and the schema verdict
            # (readiness-state's detail string). Its absence from this output is
            # what made the first two failures here cost a debugging session
            # each: "503 forever" vs "port never bound" vs WHICH dependency was
            # down are indistinguishable from status codes alone. The single-
            # pass-provisioning defect (schemas missing: extensions) would have
            # been named right here on the first red run.
            echo "──────── /readyz body at failure ────────"
            curl -s http://127.0.0.1:5199/readyz || echo "(no HTTP response — the port was never bound)"
            echo ""
            echo "──────── boot log ────────"
            tail -n 120 "$RUNNER_TEMP/boot.log"
            echo "::error::production boot smoke FAILED — the shipped build did not reach /readyz=200 with RLS_ENFORCE=on as a non-superuser role."
            kill $BOOT_PID 2>/dev/null || true
            exit 1
          fi
          curl -s http://127.0.0.1:5199/readyz
          kill $BOOT_PID 2>/dev/null || true
        env:
          NODE_ENV: production
          RLS_ENFORCE: 'on'
          PORT: '5199'
          # Migrations/admin keep the owner URL; the request-serving pool is the
          # least-privilege role. This split is the whole point of the job.
          DATABASE_URL: postgresql://postgres@localhost:5432/c2c_boot
          APP_DATABASE_URL: postgresql://app_service:ci-boot-smoke-app-service-password@localhost:5432/c2c_boot
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/pgcerts/server.crt
          # Production refuses to start without each of these. They are
          # throwaway values for a container that is destroyed with the job.
          JWT_SECRET: ci-boot-smoke-jwt-secret-min-32-chars-long-aaa
          SESSION_SECRET: ci-boot-smoke-session-secret-min-32-chars-bbb
          REFRESH_TOKEN_SECRET: ci-boot-smoke-refresh-secret-min-32-chars-ccc
          AUDIT_HMAC_SECRET: ci-boot-smoke-audit-hmac-secret-min-32-chars-ddd
          AUDIT_HMAC_KEY: ci-boot-smoke-audit-hmac-key-min-32-chars-eee
          MFA_ENCRYPTION_KEY: ci-boot-smoke-mfa-encryption-key-min-32-chars-fff
          CONNECTOR_ENCRYPTION_KEY: ci-boot-smoke-connector-encryption-key-32-ggg
          # This job has no AI provider, and since /readyz gained its `ana`
          # dependency (startup/ana-readiness-state.ts) that is no longer a
          # silent condition: a process where AnA cannot answer refuses to
          # report ready, which is the entire point of that gate. This job hit
          # it and sat at 503 for the full 300s budget on its first run after
          # the change.
          #
          # The honest fix is to declare the posture rather than weaken the
          # gate. Deterministic mode is the documented opt-in for exactly this:
          # AnA serves fixed responses, readiness passes, and /readyz reports
          # `anaState: "deterministic"` — never "ready" — so nobody can mistake
          # this environment for one with a live model.
          #
          # A throwaway ANTHROPIC_API_KEY would also turn the probe green and
          # would be WORSE: it would claim an enabled provider that does not
          # exist, which is the kind of green this whole gate exists to prevent.
          #
          # This job proves the build boots against a real database with RLS on
          # as a non-superuser. It is not an AI test and must not need a key.
          AI_GATEWAY_DETERMINISTIC: 'true'
          # Production refuses to boot without an explicit sensitive-data
          # placement contract (assertSensitivePlacementConfiguration). This is
          # the most fail-closed contract expressible: enforcement on, and the
          # single named deployment approved for NO sensitive data classes —
          # nothing here claims a contractual zero-retention approval exists.
          AI_SENSITIVE_DATA_POLICY_MODE: enforce
          AI_PROVIDER_PLACEMENT_APPROVALS: '{"private-deployment":{"region":"us","zeroRetentionApproved":true,"approvedDataClasses":[],"approvedIntendedUses":[]}}'

      - name: Tear down PostgreSQL
        if: always()
        run: docker rm -f pgboot || true

  aios-audit-assets:
    name: AIOS Audit Assets
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Generate AIOS evidence pack and enforce release gates
        run: make aios-gate

      - name: Validate AIOS audit assets
        run: make aios-validate

      - name: Run AIOS audit tooling tests
        run: make aios-test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, ana-readiness-tests, integration-tests, aios-audit-assets]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            npm install && exit 0
            echo "::warning::npm install failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm install failed after 3 attempts"; exit 1

      - name: Build
        run: npm run build

      # Must run in THIS job, after the build. The gate reads the built CSS
      # chunks and refuses to report against a stale build (exit 2), so in a
      # source-only job it would either fail on staleness or, worse, answer
      # about a product that is not the one under test.
      - name: Component class coverage (every rendered class has a rule)
        run: npm run ci:component-class-coverage

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            npm install && exit 0
            echo "::warning::npm install failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm install failed after 3 attempts"; exit 1

      - name: Generate SBOM (CycloneDX)
        # Software Bill of Materials (production tree) for vendor security
        # questionnaires / supply-chain transparency. Published as a build
        # artifact. Value-add only — never block the security scan on it.
        continue-on-error: true
        run: npm run sbom > sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Run lockfile audit and dependency-risk ledger gate
        # The wrapper reconciles the exact lockfile scan with the reviewed risk
        # ledger. New findings, expired approvals, and scanner outages fail.
        run: npm run ci:dependency-risk
        env:
          NPM_AUDIT_OUTPUT: dependency-audit-results.json

      - name: Prove dependency-risk gate fail-closed behavior
        run: npm run test:dependency-risk

      - name: Prove PPTX image parser is unreachable
        run: npm run ci:pptx-image-reachability

      - name: Upload exact npm audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-lockfile-evidence
          path: dependency-audit-results.json
          # The gate writes this file only after its ledger-freshness checks
          # pass, so a ledger-stage failure legitimately leaves no file; `error`
          # here would stack a second, misleading failure on top of the real
          # diagnostic. A missing file on a green gate is still impossible.
          if-no-files-found: warn

      - name: Trivy filesystem scan (deps + secrets)
        # Blocking gate: fails the job on HIGH/CRITICAL findings so they cannot
        # be merged. (severity threshold + exit-code 1; no continue-on-error.)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Trivy config scan (Dockerfile/IaC)
        # Advisory (continue-on-error) for now: the IaC estate has a pre-existing
        # backlog of HIGH/CRITICAL misconfigs (e.g. AVD-AWS-0164 public-IP-on-launch
        # in modules/vpc-secure) that must be baselined before this can block.
        # TODO(security): baseline existing findings into .trivyignore, then flip
        # this to a blocking gate (exit-code 1, no continue-on-error). The
        # filesystem scan above (deps + secrets) remains blocking.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          skip-dirs: node_modules

  nightly-governance:
    name: Nightly Governance Strict
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        # Retry to absorb transient registry/network failures (e.g. ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            npm install && exit 0
            echo "::warning::npm install failed (attempt $attempt/3); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "::error::npm install failed after 3 attempts"; exit 1
      - name: Route mount audit (strict debt gate)
        run: npm run ci:audit-route-mounts:full-strict
      - name: Repo health audit (strict debt gate)
        run: npm run audit:repo-health:full-strict
      - name: Upload nightly governance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governance-audits-nightly
          path: |
            docs/reports/repo-health-scan-latest.json
            docs/reports/route-mount-audit-latest.json
          retention-days: 30

  # ── Release evidence gate wiring ────────────────────────────────────────────
  #
  # The 'Release evidence gate' workflow (.github/workflows/release-evidence.yml)
  # is workflow_call-only; until this pair existed it had NO caller anywhere and
  # nothing produced its required release-evidence-input.json, so the gate could
  # never fire (PR #1352 review). Two jobs because a reusable-workflow call is a
  # job-level `uses:` and such a job cannot carry steps: the first assembles and
  # uploads the evidence artifact, the second is the caller.
  #
  # The assembler builds the artifact to the generator's exact contract — it
  # must contain exactly release-evidence-input.json plus the files listed in
  # input.artifacts, or cli.mjs generate's dirty-worktree gate refuses it. The
  # evidence packaged from this run: the Security Scan job's verbatim npm-audit
  # lockfile evidence, plus GitHub Actions execution records (job/step
  # conclusions from the Actions API) for every policy-required job here and in
  # the sibling CodeQL / Semgrep / Tier 5 runs at this same SHA (waited on,
  # bounded, via the API). That granularity is declared in knownDeviations and
  # rendered in index.md for reviewer disposition. The assembler fails closed
  # with a named reason on any missing piece; a present-but-red conclusion is
  # packaged honestly and rejected downstream by `cli.mjs validate` — the gate
  # doing its job.
  #
  # Canonical-branch runs only: the manifest is release-candidate evidence for a
  # commit on concept2cure-v2, and the sibling workflows it waits for only run
  # against pushes there.
  assemble-release-evidence:
    name: Assemble Release Evidence
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/concept2cure-v2'
    needs: [test, security-tests, blank-db-provisioning, production-boot-smoke, build, security]
    permissions:
      contents: read
      # The assembler reads this run's job records and the sibling workflow
      # runs' conclusions from the Actions API.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download the npm-audit evidence this run's Security Scan produced
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-audit-lockfile-evidence
          path: ${{ runner.temp }}/npm-audit-evidence

      - name: Assemble release-evidence-input.json (fails closed on any missing piece)
        # Assembled OUTSIDE the checkout so the artifact holds only what the
        # generator's contract allows. No npm install: the assembler is
        # dependency-free by design.
        run: node scripts/release-evidence/assemble-input.mjs --out "$RUNNER_TEMP/release-evidence-artifact"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_NPM_AUDIT: ${{ runner.temp }}/npm-audit-evidence/dependency-audit-results.json

      - name: Upload the evidence artifact for the gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-input-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence-artifact/
          if-no-files-found: error

  release-evidence-gate:
    name: Release evidence gate
    needs: assemble-release-evidence
    if: github.ref == 'refs/heads/concept2cure-v2'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-evidence.yml
    with:
      evidence-artifact: release-evidence-input-${{ github.sha }}
