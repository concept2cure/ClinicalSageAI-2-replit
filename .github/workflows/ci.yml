name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  merge_group:
    branches: ['**']
  schedule:
    - cron: '0 6 * * *'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Guardrails — eCTD migration headers (reg audit)
        run: ./scripts/ci/require-migration-headers.sh

      - name: Guardrails — ban direct new Pool()
        run: scripts/ci/ban-new-pool.sh

      - name: Guardrails — migration prefix collisions (no regressions)
        run: npm run ci:migration-prefix-collisions

      - name: Guardrails — RLS allowlist TS↔SQL parity
        run: npm run ci:rls-allowlist-sync

      - name: Guardrails — i18n locale integrity (key/placeholder/markup parity)
        run: node scripts/ci/check-i18n-integrity.mjs

      - name: Guardrails — tenant column types (no TEXT-typed tenant cols)
        run: npm run ci:tenant-column-types

      - name: Guardrails — tenant-isolation in raw SQL (no regressions)
        run: npm run ci:tenant-isolation:no-regression

      - name: Guardrails — tenant baseline ↔ justification parity
        run: npm run ci:baseline-justifications

      - name: Guardrails — requestDb (RLS) adoption (no regressions)
        run: node scripts/ci/audit-requestdb-coverage.mjs --strict-no-regression

      - name: Guardrails — no leaky dev-auth gates in prod paths
        run: npm run ci:no-dev-auth-in-prod

      - name: Guardrails — password hygiene
        run: npm run ci:password-hygiene

      - name: Guardrails — SAML SSO fail-closed (no auth bypass)
        run: npm run ci:saml-fail-closed

      - name: Guardrails — design-system non-negotiables (Lucide-only, no spring)
        run: npm run ci:design-system

      - name: Guardrails — regulated-data delete audit coverage (Part 11)
        run: npm run ci:regulated-delete-audit

      - name: Guardrails — route mount authority audit (no regressions)
        run: npm run ci:audit-route-mounts:no-regression

      - name: Guardrails — route ownership matrix artifact (required review evidence)
        run: npm run ci:route-ownership-matrix:check

      - name: Audit — repo health scan (no regressions)
        run: npm run audit:repo-health:no-regression

      - name: Upload governance audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-audits-lint
          path: |
            docs/reports/repo-health-scan-latest.json
            docs/reports/route-mount-audit-latest.json
            docs/reports/route-ownership-matrix-latest.md
          retention-days: 14

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check (no regression vs baseline)
        # Strict `npm run typecheck` would fail on the ~2,598 pre-existing
        # type errors that became visible when the parse error in
        # server/routes/auth.ts:842 was fixed (tsc had been bailing on
        # that parse error and never typechecking transitive imports).
        # The no-regression gate pins the baseline and fails only on net
        # new errors. Same pattern as ci:migration-prefix-collisions.
        # Run `npm run ci:typecheck:write-baseline` after a PR reduces
        # the count to ratchet it down.
        run: npm run ci:typecheck:no-regression

      - name: Run beta-slice TypeScript check
        run: npm run beta:typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    # Primary test gate now runs against a real Postgres so the safety-critical
    # RLS/tenant-isolation/audit/migration suites EXECUTE here instead of
    # self-skipping on a missing DB (they previously "passed" by skipping —
    # false assurance, GA testing finding). Mirrors the proven integration-tests
    # service + migration setup. RUN_INTEGRATION_TESTS is intentionally NOT set,
    # so this stays the DB-backed CORE suite while integration-tests remains the
    # heavier full-integration gate.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: concept2cure-ri_test
          # Auth method = trust; no credential literal in the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply GCC migrations
        run: |
          for migration in $(ls db/migrations/*_gcc_*.sql | sort); do
            echo "Applying $migration"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      - name: Run tests
        run: npm test
        env:
          CI: true
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

  coverage:
    name: Coverage (advisory)
    runs-on: ubuntu-latest
    needs: lint
    # Closes the GA testing finding "never measures coverage". Runs the vitest
    # suite with the v8 coverage provider against a real Postgres so the
    # DB-backed paths are counted, and reports the numbers every run. Advisory
    # for now (thresholds overridden to 0 in test:coverage so it never blocks) —
    # the 70/60/70/70 target in vitest.config.ts is the goal; once the suite
    # reaches it, drop the threshold overrides in test:coverage to enforce.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: concept2cure-ri_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply GCC migrations
        run: |
          for migration in $(ls db/migrations/*_gcc_*.sql | sort); do
            echo "Applying $migration"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      # @vitest/coverage-v8 is an OPTIONAL peer of vitest, so `npm ci` does not
      # install it. Install it transiently (--no-save keeps package.json and the
      # lockfile untouched / in sync for every other job) just for this advisory
      # coverage run.
      - name: Install coverage provider
        run: npm install --no-save @vitest/coverage-v8@4.1.7

      - name: Measure coverage
        # Inlined (not a package.json script) so package.json stays unchanged —
        # this is an advisory CI-only measurement. Thresholds overridden to 0 so
        # it reports actual coverage every run without ever blocking; the
        # 70/60/70/70 target in vitest.config.ts is the goal to enforce later.
        # continue-on-error: this job MEASURES coverage; it must never fail the
        # PR (test pass/fail is owned by the Test job, not this one).
        continue-on-error: true
        run: NODE_OPTIONS="--max-old-space-size=4096" npx vitest run --config vitest.config.ts --coverage --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
        env:
          CI: true
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  security-tests:
    name: Security Contract Tests
    runs-on: ubuntu-latest
    # Intentionally independent of `lint`. The other test jobs `needs: lint`, so
    # they are skipped whenever the lint job is red (e.g. pre-existing
    # tenant-isolation baseline drift). A security regression must always report,
    # so this gate runs on its own.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Tenant-isolation + prompt-injection contract tests. These mock the data
      # layer (no DB), so they run fast and gate every PR independently of the
      # heavier DB-backed suite.
      - name: Run security contract tests
        run: npm run test:security
        env:
          CI: true

  ana-readiness-tests:
    name: AnA Readiness Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run AnA readiness suite
        run: npm run test:ana
        env:
          CI: true
          SKIP_DB_STARTUP_TEST: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concept2cure-ri_test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: concept2cure-ri_test
          # Auth method = trust; no credential literal in the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply GCC migrations
        run: |
          for migration in $(ls db/migrations/*_gcc_*.sql | sort); do
            echo "Applying $migration"
            PAGER=cat psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

      - name: Smoke — apply RLS rollout migrations (0019/0020/0021)
        # These migrations target the production schema. The smoke runs
        # against a SEPARATE fresh DB (not the one the GCC migrations
        # mutated above) so it tests "SQL parses + executes cleanly on
        # an empty schema" — the original intent. Running it against
        # the GCC-loaded DB would also exercise the seed-data drift the
        # 0020 + 0021 coercers are supposed to catch in production,
        # which is what 0019's audit step already covers separately.
        run: |
          PAGER=cat psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS "concept2cure-ri_rls_smoke"' \
            -c 'CREATE DATABASE "concept2cure-ri_rls_smoke"'
          for f in \
            migrations/0019_tenant_column_audit.sql \
            migrations/0020_coerce_text_tenant_columns.sql \
            migrations/0021_enable_rls_everywhere.sql; do
            echo "Applying $f"
            PAGER=cat psql "$DATABASE_URL_SMOKE" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          DATABASE_URL_ADMIN: postgresql://postgres@localhost:5432/postgres
          DATABASE_URL_SMOKE: postgresql://postgres@localhost:5432/concept2cure-ri_rls_smoke

      - name: Run integration tests
        # vitest tests read DATABASE_URL via server/db/runtime.ts (per
        # server/db/getDatabaseUrl.ts the env-var fallback order is
        # DATABASE_URL → NEON_DATABASE_URL → DATABASE_NEON_NEW_SECRET).
        # The job had only TEST_DATABASE_URL set, so the pool couldn't
        # connect and ~100 server-side test files failed with
        # "Database connection not available." Mirror the value to
        # DATABASE_URL so the runtime actually sees it.
        run: npm test
        env:
          CI: true
          RUN_INTEGRATION_TESTS: 'true'
          DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/concept2cure-ri_test

  aios-audit-assets:
    name: AIOS Audit Assets
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate AIOS evidence pack and enforce release gates
        run: make aios-gate

      - name: Validate AIOS audit assets
        run: make aios-validate

      - name: Run AIOS audit tooling tests
        run: make aios-test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, ana-readiness-tests, integration-tests, aios-audit-assets]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate SBOM (CycloneDX)
        # Software Bill of Materials (production tree) for vendor security
        # questionnaires / supply-chain transparency. Published as a build
        # artifact. Value-add only — never block the security scan on it.
        continue-on-error: true
        run: npm run sbom > sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Run npm audit (with documented false-positive allowlist)
        # The wrapper filters out registry-lag false positives where installed
        # version > advisory's vulnerable range. Genuine new high/critical
        # advisories still fail. See scripts/ci/audit-with-allowlist.mjs for the
        # current allowlist and justifications.
        run: node scripts/ci/audit-with-allowlist.mjs

      - name: Trivy filesystem scan (deps + secrets)
        # Blocking gate: fails the job on HIGH/CRITICAL findings so they cannot
        # be merged. (severity threshold + exit-code 1; no continue-on-error.)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Trivy config scan (Dockerfile/IaC)
        # Advisory (continue-on-error) for now: the IaC estate has a pre-existing
        # backlog of HIGH/CRITICAL misconfigs (e.g. AVD-AWS-0164 public-IP-on-launch
        # in modules/vpc-secure) that must be baselined before this can block.
        # TODO(security): baseline existing findings into .trivyignore, then flip
        # this to a blocking gate (exit-code 1, no continue-on-error). The
        # filesystem scan above (deps + secrets) remains blocking.
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          skip-dirs: node_modules

  nightly-governance:
    name: Nightly Governance Strict
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Route mount audit (strict debt gate)
        run: npm run ci:audit-route-mounts:full-strict
      - name: Repo health audit (strict debt gate)
        run: npm run audit:repo-health:full-strict
      - name: Upload nightly governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-audits-nightly
          path: |
            docs/reports/repo-health-scan-latest.json
            docs/reports/route-mount-audit-latest.json
          retention-days: 30
