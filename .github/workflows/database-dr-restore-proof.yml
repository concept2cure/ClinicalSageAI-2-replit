name: Database DR restore proof

on:
  workflow_dispatch:
  push:
    branches: [concept2cure-v2]
    paths:
      - "scripts/ops/dr-*"
      - "tests/ops/dr-*"
      - ".github/workflows/database-dr-restore-proof.yml"
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "scripts/ops/dr-*"
      - "tests/ops/dr-*"
      - ".github/workflows/database-dr-restore-proof.yml"

permissions:
  contents: read

concurrency:
  group: database-dr-restore-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: c2c_dr_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c2c_dr_source"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The disposable service uses trust authentication; no credential or repository/cloud secret is used.
      DR_SOURCE_DATABASE_URL: postgresql://postgres@localhost:5432/c2c_dr_source
      DR_TARGET_DATABASE_URL: postgresql://postgres@localhost:5432/c2c_dr_restored
      DR_TARGET_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
      DR_APP_DATABASE_URL: postgresql://c2c_dr_app@localhost:5432/c2c_dr_restored
      DR_EVIDENCE_DIR: ${{ github.workspace }}/.dr-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # engine-strict=true makes npm ci hard-fail off the supported line, so the
      # runtime must be pinned here like every other npm-running workflow — the
      # runner-image default Node is whatever GitHub ships that week.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Prove destructive guardrails
        run: npm run db:dr:guardrails
      - name: Backup, replace, restore, and verify
        run: npm run db:dr:restore-proof
      - name: Retain non-sensitive evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-dr-evidence-${{ github.run_id }}
          path: .dr-evidence/dr-evidence.json
          # Evidence is written at the end of a successful drill; a drill that
          # died earlier legitimately has none, and `error` would bury the real
          # failure under a second one.
          if-no-files-found: warn
          retention-days: 7
