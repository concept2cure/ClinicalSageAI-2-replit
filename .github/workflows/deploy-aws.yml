name: Deploy to AWS (Production)

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API service'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy Worker service'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend to S3/CloudFront'
        type: boolean
        default: true

  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false # Never cancel production deploys

permissions:
  id-token: write # OIDC for AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_API_REPO: c2c-prod-api
  ECR_WORKER_REPO: c2c-prod-worker
  ECS_CLUSTER: c2c-production
  ECS_API_SERVICE: c2c-production-api
  ECS_WORKER_SERVICE: c2c-production-worker
  FRONTEND_BUCKET: c2c-prod-frontend
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ── Gate: Run tests before deploying ──────────────────────────────────────
  test:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  # ── Build & Push container images ─────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_api == 'true' || github.event.inputs.deploy_worker == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        if: ${{ github.event.inputs.deploy_api != 'false' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -f Dockerfile.optimized \
            -t "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_API_REPO:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_API_REPO:latest"

      - name: Build & push Worker image
        if: ${{ github.event.inputs.deploy_worker != 'false' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -f worker/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPO:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPO:latest"

  # ── Deploy API to ECS ────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → ECS
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_api != 'false' }}
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment (API)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for API deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE"

  # ── Deploy Worker to ECS ──────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker → ECS
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_worker != 'false' }}
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment (Worker)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for Worker deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE"

  # ── Deploy frontend to S3 + CloudFront ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → S3/CloudFront
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_frontend != 'false' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/public/ "s3://$FRONTEND_BUCKET/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # index.html and manifests should not be cached aggressively
          aws s3 cp dist/public/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

  # ── Post-deploy smoke test ────────────────────────────────────────────────
  smoke-test:
    name: Post-deploy Smoke Test
    needs: [deploy-api, deploy-frontend]
    runs-on: ubuntu-latest
    if: always() && (needs.deploy-api.result == 'success' || needs.deploy-frontend.result == 'success')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names c2c-prod \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_DNS" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$ALB_DNS/api/health" --insecure || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API health check passed"
            else
              echo "⚠️ API health check returned $STATUS"
              exit 1
            fi
          else
            echo "⚠️ Could not resolve ALB DNS — skipping health check"
          fi
