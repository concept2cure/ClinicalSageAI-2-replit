name: Deploy to AWS (Production)

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API service'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy Worker service'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend to S3/CloudFront'
        type: boolean
        default: true

  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false # Never cancel production deploys

permissions:
  id-token: write # OIDC for AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_API_REPO: c2c-prod-api
  ECR_WORKER_REPO: c2c-prod-worker
  ECS_CLUSTER: c2c-production
  ECS_API_SERVICE: c2c-production-api
  ECS_WORKER_SERVICE: c2c-production-worker
  FRONTEND_BUCKET: c2c-prod-frontend
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ── Gate: Run tests before deploying ──────────────────────────────────────
  test:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  # ── Gate: Security / SAST / governance must pass before any prod deploy ────
  # Production deploys must not bypass the same security gates enforced on CI.
  # ci.yml runs these on PRs/pushes, but deploy-aws.yml is triggered by tags /
  # workflow_dispatch, so the relevant gates are re-run here and made a hard
  # `needs:` dependency of the build/deploy jobs.
  security-gate:
    name: Pre-deploy Security Gate (SAST + Trivy + governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guardrails — SAML SSO fail-closed (no auth bypass)
        run: npm run ci:saml-fail-closed

      - name: Guardrails — no leaky dev-auth gates in prod paths
        run: npm run ci:no-dev-auth-in-prod

      - name: Guardrails — password hygiene
        run: npm run ci:password-hygiene

      - name: Run security contract tests (tenant-isolation + prompt-injection)
        run: npm run test:security
        env:
          CI: true

      - name: Run npm audit (with documented false-positive allowlist)
        run: node scripts/ci/audit-with-allowlist.mjs

      - name: Trivy filesystem scan (deps + secrets)
        # Blocking: HIGH/CRITICAL findings fail the deploy gate.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Trivy config scan (Dockerfile/IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          skip-dirs: node_modules

  # ── Build & Push container images ─────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    needs: [test, security-gate]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_api == 'true' || github.event.inputs.deploy_worker == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        if: ${{ github.event.inputs.deploy_api != 'false' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        # Push ONLY the immutable, SHA/tag-pinned image. The mutable `:latest`
        # tag was removed so prod can never resolve a floating image and so
        # rollback (redeploy a prior IMAGE_TAG) is always possible.
        # TODO(GA-blocker): capture the pushed image digest (docker buildx
        # --metadata-file / `docker inspect`) and deploy by @sha256:<digest>.
        run: |
          docker build -f Dockerfile.optimized \
            -t "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG"

      - name: Build & push Worker image
        if: ${{ github.event.inputs.deploy_worker != 'false' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        # Push ONLY the immutable, SHA/tag-pinned image (no mutable `:latest`).
        # TODO(GA-blocker): deploy by image digest (@sha256:<digest>).
        run: |
          docker build -f worker/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG"

  # ── Deploy API to ECS ────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → ECS
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_api != 'false' }}
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment (API)
        env:
          # Immutable image tag built+pushed by build-push (e.g. sha-<gitsha> or
          # the release tag). Passed through so the deploy is pinned to THIS
          # build and is rollback-able to a prior IMAGE_TAG.
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        # TODO(GA-blocker): register a new task definition revision whose
        # container image is "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG" (ideally
        # pinned by @sha256:<digest>) and deploy that revision, instead of
        # --force-new-deployment which re-pulls whatever the current task def
        # references. force-new-deployment alone does not guarantee the new
        # immutable image is used unless the task def already points at it.
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for API deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE"

  # ── Deploy Worker to ECS ──────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker → ECS
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_worker != 'false' }}
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment (Worker)
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        # TODO(GA-blocker): register a new task definition revision pinned to
        # "$ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG" (ideally @sha256:<digest>)
        # and deploy it, rather than --force-new-deployment of the current
        # task def. See deploy-api note above.
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for Worker deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE"

  # ── Deploy frontend to S3 + CloudFront ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → S3/CloudFront
    needs: [test, security-gate]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_frontend != 'false' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/public/ "s3://$FRONTEND_BUCKET/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # index.html and manifests should not be cached aggressively
          aws s3 cp dist/public/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

  # ── Post-deploy smoke test ────────────────────────────────────────────────
  smoke-test:
    name: Post-deploy Smoke Test
    needs: [deploy-api, deploy-frontend]
    runs-on: ubuntu-latest
    if: always() && (needs.deploy-api.result == 'success' || needs.deploy-frontend.result == 'success')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names c2c-prod \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_DNS" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$ALB_DNS/api/health" --insecure || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API health check passed"
            else
              echo "⚠️ API health check returned $STATUS"
              exit 1
            fi
          else
            echo "⚠️ Could not resolve ALB DNS — skipping health check"
          fi
