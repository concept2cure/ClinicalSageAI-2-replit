name: Deploy to AWS (Production)

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API service'
        type: boolean
        default: true
      # NOTE: there is deliberately no `deploy_worker` input — this repo builds
      # no worker image. See the "No worker image" block under `env:` below.
      deploy_frontend:
        description: 'Deploy frontend to S3/CloudFront'
        type: boolean
        default: true

  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false # Never cancel production deploys

permissions:
  id-token: write # OIDC for AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_API_REPO: c2c-prod-api
  ECS_CLUSTER: c2c-production
  ECS_API_SERVICE: c2c-production-api
  # ── No worker image ────────────────────────────────────────────────────────
  # This workflow used to build `-f worker/Dockerfile` and roll a
  # c2c-production-worker ECS service. `worker/` has never existed in this
  # repository (no commit in history adds it), so that build step could not
  # succeed and every tag-triggered production deploy failed at build-push —
  # which also blocked `migrate`, `deploy-api` and `deploy-frontend`, since they
  # all hang off it.
  #
  # The path was removed rather than a Dockerfile invented, because there is no
  # worker to put in one:
  #   • `npm run build` (scripts/build-server.mjs) emits exactly ONE artifact,
  #     dist/index.js, from server/index.ts. There is no second entrypoint.
  #   • Every background job — driftSentinel, auditChainIntegrity,
  #     corpusIngestion, regulatoryHorizon, externalIntelligence,
  #     scheduleOfEvents, taskDue (server/jobs/*) — is started IN-PROCESS by
  #     server/index.ts. There is no queue consumer to run separately.
  #   • The ECS worker task definition (terraform/modules/ecs-fargate/main.tf)
  #     sets no `command`, so a container built from the app image would run the
  #     app's CMD (`npm run start`) — a SECOND copy of the API, with a SECOND
  #     copy of every scheduler. Duplicated retention deletes and audit sweeps
  #     are worse than no worker, so pointing the "worker" build at
  #     Dockerfile.optimized would have been an actively harmful fix.
  #
  # The Python Celery worker that lived under services/ (services/worker.Dockerfile)
  # was a different stack entirely — exercised only by its own E2E harness and
  # never the NODE_ENV=production image this ECS service expects. It was deleted
  # (D9, 2026-08-13) along with docker-compose.e2e.yml and its workflows.
  #
  # TODO(infra): the `c2c-production-worker` ECS service + `worker` ECR repo are
  # still declared in terraform/ with nothing to deploy into them. Remove them
  # there (out of scope for this workflow) or land a real worker entrypoint and
  # restore this path alongside it.
  #
  # Task definition family and container name for the digest-pinned
  # register-then-deploy path in deploy-api. The container name must match the
  # name in the existing task definition so the patch step modifies the right
  # container's image and not a sibling (e.g. a fluent-bit log router or a
  # datadog sidecar).
  ECS_API_TASK_FAMILY: c2c-production-api
  ECS_API_CONTAINER_NAME: api
  # Family for the one-off schema-migration task (see the `migrate` job). It is
  # registered fresh on every deploy by deriving it from the API task def, so it
  # inherits the same DATABASE_URL secret, execution role and log config without
  # a second place to configure them. ECS creates the family on first register,
  # so this needs no pre-existing infrastructure.
  ECS_MIGRATE_TASK_FAMILY: c2c-production-migrate
  FRONTEND_BUCKET: c2c-prod-frontend
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ── Gate: Run tests before deploying ──────────────────────────────────────
  test:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  # ── Gate: Security / SAST / governance must pass before any prod deploy ────
  # Production deploys must not bypass the same security gates enforced on CI.
  # ci.yml runs these on PRs/pushes, but deploy-aws.yml is triggered by tags /
  # workflow_dispatch, so the relevant gates are re-run here and made a hard
  # `needs:` dependency of the build/deploy jobs.
  security-gate:
    name: Pre-deploy Security Gate (SAST + Trivy + governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guardrails — SAML SSO fail-closed (no auth bypass)
        run: npm run ci:saml-fail-closed

      - name: Guardrails — no leaky dev-auth gates in prod paths
        run: npm run ci:no-dev-auth-in-prod

      - name: Guardrails — password hygiene
        run: npm run ci:password-hygiene

      - name: Run security contract tests (tenant-isolation + prompt-injection)
        run: npm run test:security
        env:
          CI: true

      - name: Run lockfile audit and dependency-risk ledger gate
        run: npm run ci:dependency-risk

      - name: Trivy exceptions are attached, owned and dated (with selftests)
        # A scan cannot tell that an exception it was given is wrong. An inline
        # #trivy:ignore that a later edit moved off its block applies to nothing
        # (abc1c99a5 turned the config scan red that way), and a .trivyignore
        # entry needs an owner, a reason and an expiry. Both checks run before
        # the scans; each selftest proves its check can still fail.
        # docs/evidence/W2/2026-09-26-trivy-inline-ignores/
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-trivy-inline-ignores.mjs --selftest
          node scripts/ci/check-trivy-inline-ignores.mjs
          node scripts/ci/check-trivyignore-hygiene.mjs --selftest
          node scripts/ci/check-trivyignore-hygiene.mjs

      - name: Trivy filesystem scan (deps + secrets)
        # Runs after an earlier failed step too, so a red job still says whether the
        # tree carries a HIGH/CRITICAL finding (security audit INF-08). Not after a
        # cancel. tests/ci/trivy-steps-run-after-failures.contract.test.ts
        if: ${{ !cancelled() }}
        # Blocking: HIGH/CRITICAL findings fail the deploy gate.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Trivy config scan (Dockerfile/IaC)
        # Runs after an earlier failed step too, so a red job still says whether the
        # tree carries a HIGH/CRITICAL finding (security audit INF-08). Not after a
        # cancel. tests/ci/trivy-steps-run-after-failures.contract.test.ts
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          skip-dirs: node_modules
          # DS002 (image runs as root) is excepted for this one file alone: a
          # vendored skill's own CI image, never built, published or deployed
          # here (Dockerfile.optimized runs as appuser). Every other Dockerfile
          # is checked. .trivyignore could only drop DS002 for the whole tree.
          skip-files: .claude/skills/gstack/.github/docker/Dockerfile.ci

  # ── Build & Push container images ─────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    needs: [test, security-gate]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_api == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      # Image content digest captured at push time so deploy-api can register a
      # task-def revision pinned to @sha256:<digest>. Without this the deploy
      # would --force-new-deployment whatever the current task def references
      # and rollback would not be deterministic. See deploy-api.
      api_digest: ${{ steps.api-push.outputs.digest }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # The BUILD role: this job runs outside the production environment, and
          # the deploy role trusts only jobs inside it (terraform/modules/github-deploy-roles).
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Determine image tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        id: api-push
        if: ${{ github.event.inputs.deploy_api != 'false' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        # Push the immutable, SHA/tag-pinned image AND capture the content
        # digest. The digest is the only identifier that survives tag
        # mutation / ECR garbage-collection, so deploy-api pins the ECS
        # task-def to <repo>@sha256:<digest> rather than the mutable tag.
        # Mutable `:latest` was removed so prod can never resolve a floating
        # image. Rollback redeploys a prior task-def revision (which carries
        # its own pinned digest), which is the deterministic shape ECR /
        # ECS support.
        run: |
          docker build -f Dockerfile.optimized --target production \
            -t "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG"
          # `docker inspect` on the local tag returns RepoDigests like
          # "<registry>/<repo>@sha256:<hex>"; take the digest portion.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG" | cut -d'@' -f2)
          if [[ -z "$DIGEST" || "$DIGEST" != sha256:* ]]; then
            echo "::error::Could not capture sha256 digest for pushed API image"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "API image pushed: $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG @ $DIGEST"

      # NOTE: the "Build & push Worker image" step that lived here built
      # `-f worker/Dockerfile`, a path that has never existed in this repo, so it
      # failed every production deploy. It was removed rather than repaired —
      # see the "No worker image" block under `env:` at the top of this file for
      # why there is no worker artifact to build.

  # ── Migrate the database BEFORE any service rolls ─────────────────────────
  #
  # C2C-DB-001 / REM-7. Until this job existed there was no production migration
  # mechanism at all: the container CMD is `npm run start` (which applies
  # nothing), this workflow contained zero migration references, and the runtime
  # image did not even carry db/migrations or scripts/db. Schema reached real
  # databases only when a human remembered to run an applier by hand — which is
  # the mechanism behind "merged ≠ applied": code that reads a table ships on a
  # deploy, the table does not.
  #
  # Shape: run scripts/db/deploy-migrate.mjs as a one-off Fargate task built from
  # the SAME digest-pinned image the services are about to run, inside the same
  # VPC/subnets/security groups as the API service — the database is on private
  # RDS subnets (terraform/modules/rds), so a GitHub-hosted runner cannot reach
  # it and running the migration from the runner is not an option.
  #
  # deploy-api `needs: migrate`, so a failed or halted migration blocks the
  # rollout instead of shipping code onto a schema that cannot serve it.
  migrate:
    name: Migrate Database (one-off ECS task)
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # The exact API revision the preflight checked. deploy-api derives from
      # it, not from "the family's latest" (see the preflight's last lines).
      api_td_arn: ${{ steps.preflight.outputs.api_td_arn }}

    steps:
      # For scripts/ops/ecs-one-off-task.sh, the runner the migration uses.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      # WHERE this runs (2026-09-23): in `migrate`, before the migration task
      # definition is registered. It used to be the first step of deploy-api,
      # which needs migrate — so the production DDL migration ran from a task
      # definition derived from the API one BEFORE anything checked that task
      # definition, and a definition missing RLS_ENFORCE or APP_DATABASE_URL
      # migrated the schema first and was refused second. deploy-api needs
      # migrate and rolls only the revision this step checked (its ARN is this
      # job's output), so this one check gates both. Proven against the task
      # definition production Terraform renders by
      # scripts/ops/terraform-preflight-proof.mjs.
      - name: Preflight — task definition must carry the production boot contract
        id: preflight
        # The app fails CLOSED on a missing production env var: it exits at boot
        # rather than serving degraded. Rolling a task def that omits one turns a
        # config gap into a crash-loop that ECS reports as "deployment failed"
        # minutes later, with the real cause buried in CloudWatch. Assert the
        # names are present (in `environment` or `secrets`) BEFORE registering a
        # revision, so the deploy stops with the missing variable named.
        #
        # Values are never read here — only names. The env set is derived from
        # the boot-time assertions in the app and mirrors the CI production boot
        # smoke in ci.yml ("Boot in production mode and require /readyz=200"):
        #   RLS_ENFORCE              server/db/rlsEnforcement.ts — production
        #                            accepts ONLY the literal `on`.
        #   DATABASE_URL             server/startup/env.ts — owner role; migrations.
        #   APP_DATABASE_URL         server/db/getDatabaseUrl.ts — the non-superuser
        #                            runtime role. Under RLS_ENFORCE=on the boot
        #                            posture probe (server/index.ts →
        #                            assertRlsCatalogPosture) refuses a superuser
        #                            or BYPASSRLS runtime role, so falling back to
        #                            DATABASE_URL is not a viable production shape.
        #   JWT_SECRET               server/config/environment.ts (>=32 chars).
        #   REFRESH_TOKEN_SECRET     server/config/environment.ts — required in
        #                            staging/prod, >=32, must differ from JWT_SECRET.
        #   MFA_ENCRYPTION_KEY       server/config/environment.ts (>=32 chars).
        #   AUDIT_HMAC_KEY           server/services/audit/auditSealPosture.ts.
        #   AUDIT_HMAC_SECRET        server/lib/tamper-proof-audit.ts.
        #   AUDIT_TRAIL_ENABLED      server/startup/audit-enforcement.ts — the
        #   AUDIT_REQUIRE_ENFORCE    tamper-proof trail and its integrity monitor
        #                            run only when the first is `true`; the second
        #                            turns a missing trail, a failed immutability
        #                            probe or a disabled sweep into a boot refusal.
        #                            Both exactly `true` (security plan P0-9).
        #   CONNECTOR_ENCRYPTION_KEY server/services/connectors/connector-registry.ts
        #                            — module-level throw in production.
        #   CONCEPT2CURE_SIGNER_MODE server/services/signature/signer-mode.ts —
        #                            refused at boot in production when unset or
        #                            `dev`. kms needs ..._SIGNER_KMS_KEY_ID; hmac
        #                            needs ..._SIGNER_ACCEPT_HMAC=true. Which one is
        #                            an operator decision (SOP_KEY_MANAGEMENT.md);
        #                            this check only refuses a task definition that
        #                            has made none, before it rolls rather than at
        #                            boot (2026-09-23).
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$ECS_API_TASK_FAMILY" \
            --no-cli-pager \
            --query 'taskDefinition' > /tmp/api-td-preflight.json

          PRESENT=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | ((.environment // []) + (.secrets // [])) | map(.name) | .[]
          ' /tmp/api-td-preflight.json | sort -u)

          MISSING=""
          for VAR in RLS_ENFORCE DATABASE_URL APP_DATABASE_URL JWT_SECRET \
                     REFRESH_TOKEN_SECRET MFA_ENCRYPTION_KEY AUDIT_HMAC_KEY \
                     AUDIT_HMAC_SECRET CONNECTOR_ENCRYPTION_KEY \
                     AI_SENSITIVE_DATA_POLICY_MODE AI_PROVIDER_PLACEMENT_APPROVALS \
                     CONCEPT2CURE_SIGNER_MODE STORAGE_PROVIDER AWS_S3_BUCKET \
                     SMTP_HOST SMTP_USER SMTP_PASS \
                     AUDIT_TRAIL_ENABLED AUDIT_REQUIRE_ENFORCE; do
            if ! grep -qx "$VAR" <<< "$PRESENT"; then MISSING="$MISSING $VAR"; fi
          done

          # NODE_ENV must be exactly `production` and RLS_ENFORCE exactly `on`;
          # both are plain (non-secret) values, so their values are checkable.
          NODE_ENV_VALUE=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | (.environment // []) | map(select(.name == "NODE_ENV")) | .[0].value // ""
          ' /tmp/api-td-preflight.json)
          RLS_VALUE=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | (.environment // []) | map(select(.name == "RLS_ENFORCE")) | .[0].value // ""
          ' /tmp/api-td-preflight.json)

          FAIL=0
          if [[ -n "$MISSING" ]]; then
            echo "::error::Task definition $ECS_API_TASK_FAMILY (container $ECS_API_CONTAINER_NAME) is missing required production env:$MISSING"
            echo "::error::The app refuses to boot without each of these, with two exceptions it would boot through: without SMTP_* no one can sign in (login OTP is the mandatory second factor), and without AUDIT_TRAIL_ENABLED / AUDIT_REQUIRE_ENFORCE the tamper-proof audit trail is off or its checks only warn. Add them to the task definition (terraform/stack) before deploying."
            FAIL=1
          fi
          if [[ "$NODE_ENV_VALUE" != "production" ]]; then
            echo "::error::NODE_ENV must be exactly 'production' in the task definition; got '${NODE_ENV_VALUE:-<unset>}'."
            FAIL=1
          fi
          if [[ "$RLS_VALUE" != "on" ]]; then
            echo "::error::RLS_ENFORCE must be exactly 'on' in the task definition; got '${RLS_VALUE:-<unset>}'. Aliases (true/1/enforce) are rejected by the production kill-switch."
            FAIL=1
          fi
          # assertSensitivePlacementConfiguration refuses any production boot
          # without mode=enforce; catch it here instead of as a crash-loop.
          POLICY_MODE_VALUE=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | (.environment // []) | map(select(.name == "AI_SENSITIVE_DATA_POLICY_MODE")) | .[0].value // ""
          ' /tmp/api-td-preflight.json)
          if [[ -n "$POLICY_MODE_VALUE" && "$POLICY_MODE_VALUE" != "enforce" ]]; then
            echo "::error::AI_SENSITIVE_DATA_POLICY_MODE must be exactly 'enforce' in production; got '$POLICY_MODE_VALUE'."
            FAIL=1
          fi
          # Vault documents live where STORAGE_PROVIDER says. The server refuses
          # to boot in production without one (storage-posture.ts), and accepts
          # local disk when the operator states it is a durable volume. A Fargate
          # task has no such volume: its disk is deleted with the task. So this
          # deployment's value must be exactly `s3` (terraform/stack/vault_storage.tf).
          STORAGE_PROVIDER_VALUE=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | (.environment // []) | map(select(.name == "STORAGE_PROVIDER")) | .[0].value // ""
          ' /tmp/api-td-preflight.json)
          if [[ -n "$STORAGE_PROVIDER_VALUE" && "$STORAGE_PROVIDER_VALUE" != "s3" ]]; then
            echo "::error::STORAGE_PROVIDER must be exactly 's3' on ECS Fargate; got '$STORAGE_PROVIDER_VALUE'. A task's local disk is deleted with the task, and the vault's documents with it."
            FAIL=1
          fi
          # The Part 11 audit posture (security plan P0-9, DP-06). The tamper-proof
          # trail and the chain-integrity monitor run only with
          # AUDIT_TRAIL_ENABLED=true, and production merely WARNS without it
          # unless AUDIT_REQUIRE_ENFORCE=true makes the missing trail, a failed
          # immutability probe or a disabled daily sweep refuse to boot
          # (server/startup/audit-enforcement.ts). Both exactly `true`.
          for AUDIT_FLAG in AUDIT_TRAIL_ENABLED AUDIT_REQUIRE_ENFORCE; do
            AUDIT_FLAG_VALUE=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" --arg n "$AUDIT_FLAG" '
              .containerDefinitions[] | select(.name == $c)
              | (.environment // []) | map(select(.name == $n)) | .[0].value // ""
            ' /tmp/api-td-preflight.json)
            if [[ -n "$AUDIT_FLAG_VALUE" && "$AUDIT_FLAG_VALUE" != "true" ]]; then
              echo "::error::$AUDIT_FLAG must be exactly 'true' in production; got '$AUDIT_FLAG_VALUE'."
              FAIL=1
            fi
          done
          # Every *_ACCEPT_* variable is an operator override that switches a
          # production refusal off: AUDIT_SEAL_ACCEPT_UNSEALED (an unsealed audit
          # chain), AI_GOVERNANCE_ACCEPT_PERMISSIVE, STORAGE_ACCEPT_LOCAL_DISK,
          # CONCEPT2CURE_SIGNER_ACCEPT_HMAC. They exist for local and compose
          # stacks. This stack needs none (KMS signer, S3 vault, sealed chain),
          # so a task definition carrying one, as a value or a secret, set to
          # anything, is refused before it rolls (security plan P0-13, INF-17).
          ACCEPT_OVERRIDES=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | ((.environment // []) + (.secrets // [])) | map(.name)
            | map(select(test("^[A-Z0-9_]+_ACCEPT_[A-Z0-9_]+$"))) | .[]
          ' /tmp/api-td-preflight.json | sort -u | tr '\n' ' ')
          if [[ -n "${ACCEPT_OVERRIDES// /}" ]]; then
            echo "::error::The task definition carries production override flag(s): ${ACCEPT_OVERRIDES% }. Each switches a production refusal off; remove it from terraform/stack."
            FAIL=1
          fi
          # APP_URL is the only origin emailed reset and invitation links are
          # built on in production (server/services/password-setup-token.ts).
          # Without it those flows refuse every request rather than put the
          # request's Host header in front of a live token (password-reset
          # poisoning, D6). The server boots; no account could be recovered.
          # A plain value is checked here, as the server checks it (trimmed, an
          # https URL). A value from `secrets` cannot be read here; its name is
          # enough, and the server refuses reset and invitation requests if it
          # is not an https origin.
          APP_URL_VALUE=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | (.environment // []) | map(select(.name == "APP_URL")) | .[0].value // ""
          ' /tmp/api-td-preflight.json | tr -d '[:space:]')
          APP_URL_SECRET=$(jq -r --arg c "$ECS_API_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $c)
            | (.secrets // []) | map(select(.name == "APP_URL")) | length
          ' /tmp/api-td-preflight.json)
          if [[ -n "$APP_URL_VALUE" ]]; then
            if [[ ! "${APP_URL_VALUE,,}" =~ ^https://[^/]+ ]]; then
              echo "::error::APP_URL must be the deployment's public https origin (password-reset and invitation links are built on it, never on the Host header); got '$APP_URL_VALUE'."
              FAIL=1
            fi
          elif [[ "$APP_URL_SECRET" == "0" ]]; then
            echo "::error::APP_URL is missing from the task definition (environment or secrets). Password-reset and invitation links are built on it in production, never on the Host header."
            FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1

          # Hand the EXACT revision checked here to everything that derives a
          # task definition from it — the migration below and deploy-api —
          # rather than let each re-read "the family's latest". deploy-api runs
          # after the migration and a production approval, and a `terraform
          # apply` in between registers a new latest revision (the services
          # ignore task_definition changes, so nothing else rolls it). Without
          # the ARN, deploy-api rolled a revision this step never saw
          # (review findings SEC-5 / PIPE-2, 2026-09-24).
          CHECKED_ARN=$(jq -r '.taskDefinitionArn // empty' /tmp/api-td-preflight.json)
          if [[ ! "$CHECKED_ARN" =~ ^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/${ECS_API_TASK_FAMILY}:[0-9]+$ ]]; then
            echo "::error::describe-task-definition returned no usable revision ARN ('$CHECKED_ARN'); cannot pin the revision that was checked."
            exit 1
          fi
          echo "api_td_arn=$CHECKED_ARN" >> "$GITHUB_OUTPUT"
          echo "Production boot contract satisfied by $CHECKED_ARN."

      - name: Migrate — one-off task derived from the checked API revision
        id: migrate-task
        env:
          IMAGE_DIGEST: ${{ needs.build-push.outputs.api_digest }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          CHECKED_API_TD_ARN: ${{ steps.preflight.outputs.api_td_arn }}
        # scripts/ops/ecs-one-off-task.sh derives the task from the revision the
        # preflight above CHECKED (same execution role, secrets, logs; sidecars,
        # ports and the health check dropped), runs it on the API service's own
        # subnets and security groups (the only ones RDS admits), waits against
        # a deadline that stops the task when it passes, prints its log, and
        # exits with its exit code. The same runner starts the first provision
        # (provision-database.yml). It replaced two inline steps here whose
        # `aws ecs wait` gave up silently after ten minutes and which, when no
        # task started, called run-task a second time to see why.
        run: |
          set -uo pipefail

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" != sha256:* ]]; then
            echo "::error::No API image digest available, so there is no image to migrate from."
            echo "::error::A deploy that skips the API image cannot migrate the schema. Re-run with deploy_api enabled."
            exit 1
          fi
          if [[ -z "$CHECKED_API_TD_ARN" ]]; then
            echo "::error::The preflight published no checked revision ARN; refusing to derive the migration from an unchecked one."
            exit 1
          fi

          SOURCE_TD_ARN="$CHECKED_API_TD_ARN" \
          CONTAINER_NAME="$ECS_API_CONTAINER_NAME" \
          FAMILY="$ECS_MIGRATE_TASK_FAMILY" \
          IMAGE="$ECR_REGISTRY/$ECR_API_REPO@$IMAGE_DIGEST" \
          COMMAND_JSON='["npm", "run", "db:migrate:deploy"]' \
          LABEL=migration \
          STARTED_BY="deploy-${GITHUB_RUN_ID}" \
          DEADLINE_SECONDS=1800 \
            bash scripts/ops/ecs-one-off-task.sh
          EXIT_CODE=$?

          case "$EXIT_CODE" in
            0)
              echo "Schema migration succeeded — services may roll."
              ;;
            3)
              echo "::error::The database has never been provisioned (deploy-migrate.mjs exit 3)."
              echo "::error::Run the 'Provision database (first run)' workflow (provision-database.yml) once, then deploy again."
              exit 1
              ;;
            124)
              echo "::error::The migration outlived its 30-minute deadline and was stopped. Services were NOT rolled."
              exit 1
              ;;
            *)
              echo "::error::Schema migration failed (exit ${EXIT_CODE}). Services were NOT rolled."
              exit 1
              ;;
          esac

  # ── Deploy API to ECS ────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → ECS
    # `migrate` is a hard gate: rolling the API onto a schema whose migration
    # failed is exactly the outcome this deploy path is meant to prevent.
    needs: [build-push, migrate]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_api != 'false' }}
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Register pinned task definition revision (API)
        id: register-api-td
        env:
          # Immutable image tag built+pushed by build-push (e.g. sha-<gitsha> or
          # the release tag). Combined with the captured digest so the new task
          # def is pinned to a specific image, not a mutable tag.
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build-push.outputs.api_digest }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # The revision migrate's preflight checked; see that step.
          CHECKED_API_TD_ARN: ${{ needs.migrate.outputs.api_td_arn }}
        # The deterministic shape ECS supports: pull the current task def,
        # patch the API container image to <repo>@sha256:<digest> (the
        # digest the build-push job captured), register it as a new
        # revision, and deploy that revision by ARN. Rollback is a one-line
        # `aws ecs update-service --task-definition <prior-arn>` against
        # a prior revision. --force-new-deployment is gone — it could not
        # guarantee the right image was used because it only re-pulls
        # whatever the existing task def already references.
        run: |
          set -euo pipefail

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" != sha256:* ]]; then
            echo "::error::API image digest missing or malformed: '$IMAGE_DIGEST'. Refusing to deploy without a pinned digest."
            exit 1
          fi

          # Roll only the revision the preflight checked. If the family has
          # moved since (a terraform apply, or an earlier attempt of this job
          # registering its own revision), the new latest was never checked,
          # and rolling the old one would silently discard whatever changed.
          # Either way the answer is a fresh run, which checks the latest.
          if [[ -z "$CHECKED_API_TD_ARN" ]]; then
            echo "::error::migrate published no checked API revision; refusing to roll an unchecked one."
            exit 1
          fi
          LATEST_API_TD_ARN=$(aws ecs describe-task-definition \
            --task-definition "$ECS_API_TASK_FAMILY" \
            --no-cli-pager \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          if [[ "$LATEST_API_TD_ARN" != "$CHECKED_API_TD_ARN" ]]; then
            echo "::error::The API task definition moved after the preflight checked it (checked $CHECKED_API_TD_ARN, latest now $LATEST_API_TD_ARN). Re-run the whole workflow so the latest revision is checked before it rolls."
            exit 1
          fi

          PINNED_IMAGE="$ECR_REGISTRY/$ECR_API_REPO@$IMAGE_DIGEST"
          echo "Pinning API task def to: $PINNED_IMAGE"

          # Get the checked task def, strip metadata that's not allowed on
          # register-task-definition input, patch the API container image,
          # register the new revision.
          aws ecs describe-task-definition \
            --task-definition "$CHECKED_API_TD_ARN" \
            --no-cli-pager \
            --query 'taskDefinition' > /tmp/api-td.json

          jq --arg img "$PINNED_IMAGE" \
             --arg api_container "$ECS_API_CONTAINER_NAME" \
             '
             {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes, placementConstraints, requiresCompatibilities, cpu, memory, runtimePlatform, ipcMode, pidMode, proxyConfiguration, inferenceAccelerators, ephemeralStorage}
             | with_entries(select(.value != null))
             | .containerDefinitions = (.containerDefinitions | map(if .name == $api_container then .image = $img else . end))
             ' /tmp/api-td.json > /tmp/api-td-patched.json

          NEW_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-td-patched.json \
            --no-cli-pager \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          if [[ -z "$NEW_TD_ARN" || "$NEW_TD_ARN" == "None" ]]; then
            echo "::error::register-task-definition returned no ARN for the API family."
            exit 1
          fi

          echo "Registered API task def: $NEW_TD_ARN"
          echo "task_def_arn=$NEW_TD_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy pinned task def revision (API)
        env:
          NEW_TD_ARN: ${{ steps.register-api-td.outputs.task_def_arn }}
        # Deploy by ARN of the just-registered revision. ECS pulls the
        # image that revision references (which is @sha256:<digest>) and
        # rolls the service to new tasks. Rollback = update-service with a
        # prior revision ARN.
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --task-definition "$NEW_TD_ARN" \
            --no-cli-pager

      - name: Wait for API deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE"

  # ── Deploy Worker to ECS ──────────────────────────────────────────────────
  # REMOVED. The `deploy-worker` job registered a digest-pinned revision of the
  # c2c-production-worker task definition from an image that this repo cannot
  # build (see the "No worker image" block under `env:` at the top of this
  # file). It could only ever run after build-push succeeded, which it never
  # did. Nothing downstream depended on it — `smoke-test` needs deploy-api and
  # deploy-frontend only.

  # ── Deploy frontend to S3 + CloudFront ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → S3/CloudFront
    needs: [test, security-gate]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_frontend != 'false' }}
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Three cache classes, checked by `npm run ci:frontend-sync-coverage`:
      #   assets/     Vite names these by content hash, so a changed file gets a
      #               new name: cached for a year. Not --delete: a tab opened on
      #               the previous release still lazy-loads its own chunks.
      #   the rest    fetched by a fixed name (the interface strings under
      #               locales/, robots.txt, sitemap.xml, the web manifest):
      #               revalidated every five minutes. The locale files were once
      #               excluded here and never uploaded, so production would have
      #               shown raw keys on the sign-in page.
      #   index.html  revalidated on every load.
      - name: Sync to S3
        run: |
          aws s3 sync dist/public/assets/ "s3://$FRONTEND_BUCKET/assets/" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 sync dist/public/ "s3://$FRONTEND_BUCKET/" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=300,must-revalidate"

          aws s3 cp dist/public/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

  # ── Post-deploy smoke test ────────────────────────────────────────────────
  smoke-test:
    name: Post-deploy Smoke Test
    needs: [deploy-api, deploy-frontend]
    runs-on: ubuntu-latest
    # A failed or skipped API deploy is never followed by a green smoke test
    # against the old tasks (audit SMOKE-01). A frontend-only dispatch
    # (deploy_api=false) is still checked.
    if: always() && (needs.deploy-api.result == 'success' || (github.event.inputs.deploy_api == 'false' && needs.deploy-frontend.result == 'success'))

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # The BUILD role: this job runs outside the production environment, and
          # the deploy role trusts only jobs inside it (terraform/modules/github-deploy-roles).
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Readiness the way users reach the product: through CloudFront, on the
      # distribution's own domain, with the certificate checked. The ALB admits
      # CloudFront alone (terraform/modules/alb), so its DNS name no longer
      # answers. This step used to call that name with --insecure, and passed
      # without checking anything when the ALB could not be found.
      #
      # A 200 is not proof on its own: CloudFront used to answer unknown paths
      # with 200 and the app's index.html. The body must be /readyz's verdict.
      # The deploy role needs cloudfront:GetDistribution for the alias lookup.
      - name: Readiness through the public URL
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "::error::CLOUDFRONT_DISTRIBUTION_ID is not set, so the deployment cannot be checked where users reach it. It is not reported healthy."
            exit 1
          fi
          HOST=$(aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Aliases.Items[0]' --output text)
          if [ -z "$HOST" ] || [ "$HOST" = "None" ]; then
            echo "::error::Distribution $CLOUDFRONT_DISTRIBUTION_ID has no custom domain; the API is routed only on one (terraform/modules/cloudfront)."
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            rm -f readyz.json
            STATUS=$(curl --silent --show-error --max-time 30 --output readyz.json \
              --write-out '%{http_code}' "https://$HOST/readyz" || true)
            if [ "$STATUS" = "200" ] && jq -e '.ready == true' readyz.json >/dev/null 2>&1; then
              echo "✅ https://$HOST/readyz reports ready"
              jq '.dependencies' readyz.json
              exit 0
            fi
            echo "Attempt $attempt: HTTP $STATUS"
            head -c 2000 readyz.json 2>/dev/null || true
            echo
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          echo "::error::https://$HOST/readyz did not report ready."
          exit 1
