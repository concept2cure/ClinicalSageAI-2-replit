name: Terraform — production boot contract

# Production Terraform had never been executed by CI on this branch. The one
# Terraform workflow (terraform-compliance.yml) triggers on pull_request only,
# which CLAUDE.md Rule 0 rules out, and it plans staging. So production went
# unvalidated until 2026-09-23, when `terraform validate` was first run and
# failed; and once it validated, the task definition it rendered could not have
# passed deploy-aws.yml's own preflight, started, connected or stayed healthy.
#
# This runs on every push that could change the answer. It needs no AWS
# account: the provider is mocked (terraform/environments/production/tests/),
# and the preflight is deploy-aws.yml's own shell, run against what Terraform
# renders (scripts/ops/terraform-preflight-proof.mjs).

on:
  push:
    branches: [concept2cure-v2]
    paths:
      - 'terraform/**'
      - 'Dockerfile.optimized'
      - '.github/workflows/deploy-aws.yml'
      - '.github/workflows/terraform-boot-contract.yml'
      - 'scripts/ops/terraform-preflight-proof.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-boot-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: true
    steps:
      # Pinned to full commit SHAs, as every `uses:` in this tree is; the tag is
      # in the trailing comment. Change both when upgrading.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # The version the evidence under docs/evidence/W2/ was produced with.
          terraform_version: 1.9.8
          # The wrapper re-emits stdout; the proof parses `terraform test -json`.
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # The proof reads deploy-aws.yml with js-yaml, the repository's own copy.
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Validate production
        working-directory: terraform/environments/production
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: Boot contract — mocked apply, pipeline preflight, health check, RDS trust
        run: node scripts/ops/terraform-preflight-proof.mjs --no-init
