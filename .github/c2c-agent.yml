# ═══════════════════════════════════════════════════════════════════════════════
# C2C Codespace Agent Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Governs autonomous agent behaviors within GitHub Codespaces for
# regulatory validation, security auditing, compliance checking, and
# documentation generation.
#
# NOTE: External integrations (Veeva, CTMS, EDC) are deferred to a future
# phase. This config covers core platform capabilities only.
# ═══════════════════════════════════════════════════════════════════════════════
version: '2.0'

project:
  name: 'concept2cure'
  id: 'concept2cure-v2'
  # Never hardcode a Neon project ID or production branch in an agent config.
  # Preview jobs require a separately approved, non-production parent.

# ─────────────────────────────────────────────────────────────────────────────
# Agent Capabilities
# ─────────────────────────────────────────────────────────────────────────────
agent:
  name: 'c2c-regulatory-agent'
  version: '1.0.0'
  permissions:
    - regulatory_validation
    - ai_model_training
    - security_auditing
    - compliance_checking
    - documentation_generation

  # Auto-trigger on file changes
  triggers:
    - pattern: 'ectd/**'
      action: validate_submission_content
    - pattern: 'server/services/**'
      action: run_type_check
    - pattern: 'db/migrations/**'
      action: validate_migration
    - pattern: 'server/services/module-intelligence.ts'
      action: validate_prompt_quality
    - pattern: 'server/services/lumen-*.ts'
      action: validate_prompt_quality
    - pattern: 'docs/**'
      action: generate_documentation

# ─────────────────────────────────────────────────────────────────────────────
# Environment Secrets
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  - name: APP_DATABASE_URL
    source: github_codespaces_secrets
    required: true
    validation: postgresql_connection_string

  - name: JWT_SECRET
    source: github_codespaces_secrets
    required: true

  # A provider key is not a high-risk authoring approval or a PQ receipt.
  - name: ANTHROPIC_API_KEY
    source: github_codespaces_secrets
    required: false

  - name: OPENAI_API_KEY
    source: github_codespaces_secrets
    required: false

# ─────────────────────────────────────────────────────────────────────────────
# Database Configuration (Neon)
# ─────────────────────────────────────────────────────────────────────────────
database:
  type: 'postgresql'
  provider: 'neon'
  connection_string: '${APP_DATABASE_URL}'
  ssl_mode: 'verify-full'
  pooler_mode: true

  # The request-serving Codespace cannot perform DDL or tenant/schema repair.
  # Provisioning requires a separate, explicitly authorized maintenance job.
  migrations:
    auto_run: false
    validate_before_apply: true

  branching:
    strategy: 'operator-approved'
    preview_branches:
      enabled: false
      # Enable only via an explicitly configured non-production Neon parent.

# ─────────────────────────────────────────────────────────────────────────────
# AI Training & Validation Pipeline
# ─────────────────────────────────────────────────────────────────────────────
ai:
  # Provider placement and contractual retention controls govern every call;
  # API-key presence is not evidence of zero-data-retention eligibility.
  data_retention_policy: 'provider-placement-governed'
  provider: 'governed-gateway'
  model_registry_source: 'server/services/ai-governance/approved-models.ts'

  # Quality gates — every AI output must pass these before reaching a user
  quality_gates:
    accuracy: '>95%'
    hallucination_rate: '<1%'
    citation_coverage: '>90%'
    regulatory_term_accuracy: '100%'

  # Prompt engineering pipeline
  prompt_pipeline:
    # Module-specific prompt sets (matched to module-intelligence.ts verticals)
    verticals:
      - name: 'ectd-coauthor'
        system_prompt_source: 'server/services/module-intelligence.ts'
        evaluation_set: 'tests/prompts/ectd-coauthor-eval.jsonl'
        metrics: ['section_accuracy', 'ectd_compliance', 'citation_rate']

      - name: 'medical-device'
        system_prompt_source: 'server/services/module-intelligence.ts'
        evaluation_set: 'tests/prompts/medical-device-eval.jsonl'
        metrics: ['predicate_accuracy', 'classification_accuracy', '510k_compliance']

      - name: 'cmc-wizard'
        system_prompt_source: 'server/services/module-intelligence.ts'
        evaluation_set: 'tests/prompts/cmc-wizard-eval.jsonl'
        metrics: ['spec_accuracy', 'ich_q_compliance', 'batch_record_completeness']

      - name: 'doc-canvas'
        system_prompt_source: 'server/services/module-intelligence.ts'
        evaluation_set: 'tests/prompts/doc-canvas-eval.jsonl'
        metrics: ['formatting_accuracy', 'cross_reference_integrity']

      - name: 'vault-intelligence'
        system_prompt_source: 'server/services/module-intelligence.ts'
        evaluation_set: 'tests/prompts/vault-eval.jsonl'
        metrics: ['classification_accuracy', 'version_control_compliance']

    # Instruction execution engine validation (Lumen)
    instruction_engine:
      source: 'server/services/lumen-instruction-engine.ts'
      evaluation_set: 'tests/prompts/instruction-engine-eval.jsonl'
      metrics: ['instruction_fidelity', 'table_accuracy', 'figure_relevance']

  # Hallucination detection pipeline
  hallucination_detection:
    enabled: true
    method: 'source-grounding' # Compare every claim to uploaded evidence
    enforcement: 'block' # block | warn | log
    thresholds:
      claim_without_source: 'block'
      statistical_mismatch: 'block'
      regulatory_term_misuse: 'block'
      unsupported_conclusion: 'warn'

  # Continuous evaluation — run on every PR that touches AI prompts
  continuous_eval:
    trigger_paths:
      - 'server/services/module-intelligence.ts'
      - 'server/services/lumen-instruction-engine.ts'
      - 'server/services/lumen-context-builder.ts'
    eval_runner: 'node tests/ai-eval/run-eval.ts'
    min_pass_rate: 0.95
    report_to: 'pr-comment'

  # No independently maintained or auto-approved GPT drafting list.
  # The gateway registry, actual provider access, and recorded PQ determine
  # what may be used for regulated authoring.
  model_registry:
    source_of_truth: 'server/services/ai-governance/approved-models.ts'
    high_risk_rule: 'approvedForHighRisk'
    production_drafting_rule: 'pq.status=passed'
    openai_high_risk: 'not currently approved'

  # Data placement is tenant- and contract-governed. External model calls may
  # transmit authorized data; never promise that no data leaves the platform.
  data_isolation:
    training_on_client_data: false
    prompt_logging: 'audit-trail-only' # logged to audit_logs table, not OpenAI
    pii_scrubbing: true
    model_fine_tuning: 'not-in-scope' # We use prompt engineering, not fine-tuning

# ─────────────────────────────────────────────────────────────────────────────
# Security & Compliance
# ─────────────────────────────────────────────────────────────────────────────
security:
  soc2_compliance:
    target_date: '2026-03-31'
    auto_audit: true

  cfr_part_11:
    enabled: true
    electronic_signatures: true
    audit_trails: true

  encryption:
    at_rest: 'AES-256'
    in_transit: 'TLS-1.3'

  access_controls:
    mfa_required: true
    sso_integration: true
    role_based_permissions: true

# ─────────────────────────────────────────────────────────────────────────────
# Regulatory Validation
# ─────────────────────────────────────────────────────────────────────────────
regulatory:
  health_authorities:
    - 'FDA'
    - 'EMA'
    - 'PMDA'
    - 'Health_Canada'

  submission_types:
    - 'IND'
    - 'NDA'
    - 'BLA'
    - 'MAA'
    - 'sNDA'
    - 'sBLA'

  validation_rules:
    ectd_compliance: true
    citation_integrity: true
    cross_reference_validation: true
    formatting_standards: 'ICH'

