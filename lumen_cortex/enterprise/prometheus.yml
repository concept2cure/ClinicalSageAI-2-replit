# ═══════════════════════════════════════════════════════════════════════════════
#                    LUMEN CORTEX - PROMETHEUS CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Enterprise Prometheus configuration for Lumen Cortex monitoring stack.
#
# FEATURES:
# - Multi-target scraping (app, databases, infrastructure)
# - Service discovery for dynamic environments
# - Alerting rules for critical metrics
# - Recording rules for performance optimization
#
# ═══════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  
  external_labels:
    environment: ${ENVIRONMENT:-development}
    service: lumen_cortex

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Lumen Cortex Application
  # ═══════════════════════════════════════════════════════════════════════════
  
  - job_name: 'lumen-cortex-app'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'lumen-cortex:9090'
        labels:
          component: 'application'
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # ═══════════════════════════════════════════════════════════════════════════
  # PostgreSQL (with pgvector)
  # ═══════════════════════════════════════════════════════════════════════════
  
  - job_name: 'postgresql'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
        labels:
          component: 'database'
          database: 'postgresql'

  # ═══════════════════════════════════════════════════════════════════════════
  # Neo4j Graph Database
  # ═══════════════════════════════════════════════════════════════════════════
  
  - job_name: 'neo4j'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'neo4j:2004'
        labels:
          component: 'database'
          database: 'neo4j'

  # ═══════════════════════════════════════════════════════════════════════════
  # Redis Cache
  # ═══════════════════════════════════════════════════════════════════════════
  
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          component: 'cache'
          database: 'redis'

  # ═══════════════════════════════════════════════════════════════════════════
  # Node Exporter (System Metrics)
  # ═══════════════════════════════════════════════════════════════════════════
  
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          component: 'infrastructure'

  # ═══════════════════════════════════════════════════════════════════════════
  # cAdvisor (Container Metrics)
  # ═══════════════════════════════════════════════════════════════════════════
  
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'
        labels:
          component: 'infrastructure'
    
    metric_relabel_configs:
      # Drop high-cardinality labels
      - source_labels: [__name__]
        regex: 'container_.*'
        action: keep
      - regex: 'id|name'
        action: labeldrop

  # ═══════════════════════════════════════════════════════════════════════════
  # Prometheus Self-Monitoring
  # ═══════════════════════════════════════════════════════════════════════════
  
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          component: 'monitoring'
