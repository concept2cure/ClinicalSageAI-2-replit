<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Concept2Cure - AI-Powered Regulatory Intelligence Platform</title>

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/concept2cure-icon.svg" />
    <link rel="apple-touch-icon" href="/src/assets/concept2cure-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Concept2Cure" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Concept2Cure is an AI-powered regulatory intelligence platform for clinical research professionals, specializing in end-to-end submission management, document authoring, and compliance analysis."
    />
    <meta
      name="keywords"
      content="regulatory intelligence, clinical trials, FDA submissions, eCTD, 510k, CER, life sciences, AI compliance, document authoring, Concept2Cure"
    />
    <meta name="author" content="Concept2Cure" />
    <meta name="theme-color" content="#faf9f7" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Concept2Cure - AI-Powered Regulatory Intelligence" />
    <meta
      property="og:description"
      content="End-to-end regulatory submission management, intelligent document authoring, and compliance analysis powered by AI. Trusted by clinical research professionals worldwide."
    />
    <meta property="og:image" content="/src/assets/concept2cure-icon.svg" />
    <meta property="og:site_name" content="Concept2Cure" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Concept2Cure - AI-Powered Regulatory Intelligence" />
    <meta
      name="twitter:description"
      content="End-to-end regulatory submission management, intelligent document authoring, and compliance analysis powered by AI."
    />
    <meta name="twitter:image" content="/src/assets/concept2cure-icon.svg" />

    <!-- Typography: Poppins for headings/UI, Lora for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Portal target for app-wide modals -->
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Removed obsolete Multi-Agency Validation Fix script to prevent console errors -->
  </body>
