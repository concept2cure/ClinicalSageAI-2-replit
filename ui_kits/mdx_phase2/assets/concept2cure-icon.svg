    <path d="M8,-22 C12,-15 12,-8 8,-1 C4,6 4,13 8,22" stroke="url(#dnaGoldLight)" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
    <line x1="-7" y1="-18" x2="7" y2="-18" stroke="#F5D76E" stroke-width="2" stroke-linecap="round" opacity="0.9"></line>
    <line x1="-11" y1="-10" x2="11" y2="-10" stroke="#E8A317" stroke-width="2" stroke-linecap="round" opacity="0.9"></line>
    <line x1="-6" y1="-1" x2="6" y2="-1" stroke="#F5D76E" stroke-width="2" stroke-linecap="round" opacity="0.85"></line>
