<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7EC8F8" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#1B6CA8" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="dnaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D76E"></stop>
      <stop offset="50%" stop-color="#E8A317"></stop>
      <stop offset="100%" stop-color="#C67800"></stop>
    </linearGradient>
    <linearGradient id="dnaGoldLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"></stop>
      <stop offset="50%" stop-color="#F5C518"></stop>
      <stop offset="100%" stop-color="#E8A317"></stop>
    </linearGradient>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A7BC4"></stop>
      <stop offset="50%" stop-color="#2196D4"></stop>
      <stop offset="100%" stop-color="#1565A0"></stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"></feGaussianBlur>
      <feFlood flood-color="#FFD700" flood-opacity="0.3"></feFlood>
      <feComposite in2="blur" operator="in"></feComposite>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgMain)"></rect>
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"></rect>
