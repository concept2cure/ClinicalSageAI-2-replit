  <style>
    /* Harness chrome — toast for the askAna handoff (kit-only, not ported). */
    .kit-toast {
      position: fixed; right: 56px; bottom: 18px; z-index: 1000;
      max-width: 480px;
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 14px;
      background: var(--canvas-elevated);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-100);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      animation: kit-toast-in 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes kit-toast-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .kit-toast-mark { color: var(--accent-100); font-size: 18px; line-height: 1; padding-top: 2px; }
    .kit-toast-body { flex: 1; min-width: 0; }
    .kit-toast-head {
      display: flex; gap: 8px; align-items: center; margin-bottom: 4px;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-400); font-weight: 600;
    }
    .kit-toast-lbl  { color: var(--accent-200); }
    .kit-toast-when { font-family: var(--font-mono); color: var(--text-400); }
    .kit-toast-text { font-size: 12px; color: var(--text-100); line-height: 1.4; }
    .kit-toast-close { color: var(--text-400); padding: 2px; flex-shrink: 0; }
    .kit-toast-close:hover { color: var(--text-200); }
    .kit-toast-close svg { width: 14px; height: 14px; }

    /* Hide AnA seam from breaking the 1fr grid when --ana-seam is collapsed */
    body { overflow: hidden; }

    /* Variant toggle — only shown on engineering surface, kit-only chrome */
    .kit-variant-toggle {
      position: fixed; right: 56px; top: 70px; z-index: 900;
      display: flex; flex-direction: column; gap: 4px;
      padding: 12px;
      background: var(--canvas-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      width: 220px;
    }
    .kit-variant-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-400); font-weight: 600; padding: 0 4px 4px;
    }
    .kit-variant-btn {
      display: flex; flex-direction: column; gap: 2px;
      padding: 8px 10px; text-align: left;
      border-radius: var(--radius-md);
      background: var(--bg-050);
      border: 1px solid transparent;
      transition: all 200ms cubic-bezier(0.4,0,0.2,1);
    }
    .kit-variant-btn:hover { background: var(--bg-100); }
    .kit-variant-btn[data-on="true"] {
      background: var(--accent-000);
      border-color: var(--accent-100);
    }
    .kit-variant-name { font-size: 12px; font-weight: 600; color: var(--text-100); }
    .kit-variant-desc { font-size: 11px; color: var(--text-400); }
    .kit-variant-btn[data-on="true"] .kit-variant-name { color: var(--accent-200); }
  </style>
