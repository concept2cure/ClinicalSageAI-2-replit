<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.rows { display:flex; flex-direction:column; gap: 10px; }
.r { display:grid; grid-template-columns: 120px 40px 1fr 110px; gap: 12px; align-items:center; padding: 10px 12px; background: white; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
.dot { width: 28px; height: 28px; border-radius: 6px; }
.muted { width: 28px; height: 28px; border-radius: 6px; }
.lbl { font-size: 12px; font-weight: 500; color: var(--ink); }
.use { font-size: 11px; color: var(--ink-muted); }
.hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-subtle); }
</style></head><body><div class="card">
  <div class="rows">
    <div class="r"><div class="lbl">Success</div><div class="dot" style="background:#788c5d"></div><div class="use">"Approved", "Ready" — olive, calm</div><div class="hex">#788c5d</div></div>
    <div class="r"><div class="lbl">Warning</div><div class="dot" style="background:#d97706"></div><div class="use">"In review", "Attention" — warm amber</div><div class="hex">#d97706</div></div>
    <div class="r"><div class="lbl">Error</div><div class="dot" style="background:#dc3545"></div><div class="use">"Blocked", "Failed" — muted, not neon</div><div class="hex">#dc3545</div></div>
    <div class="r"><div class="lbl">Info / AI</div><div class="dot" style="background:#6a9bcc"></div><div class="use">"AnA said", system notices — AI persona</div><div class="hex">#6a9bcc</div></div>
  </div>
</div></body></html>
