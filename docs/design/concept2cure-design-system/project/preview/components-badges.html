<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display:flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 0; }
.pill {
  display:inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 9999px;
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.02em;
}
.dot { width: 6px; height: 6px; border-radius: 9999px; }
.p-draft { background: var(--bg-100); color: var(--ink-body); }
.p-draft .dot { background: var(--ink-subtle); }
.p-review { background: var(--warning-muted); color: #8a4b0c; }
.p-review .dot { background: var(--warning); }
.p-ready { background: var(--success-muted); color: #4e6638; }
.p-ready .dot { background: var(--success); }
.p-blocked { background: var(--error-muted); color: #7f2323; }
.p-blocked .dot { background: var(--error); }
.p-locked { background: var(--bg-200); color: var(--ink-body); }
.p-locked .dot { background: var(--ink-muted); }
.p-ai { background: var(--ai-muted); color: #2f5a86; }
.p-ai .dot { background: var(--ai); }
.p-pro { background: var(--accent-pro-000); color: var(--accent-pro-200); }
.p-pro .dot { background: var(--accent-pro-100); }
.lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-subtle); min-width: 70px; font-weight: 500; }
</style></head><body><div class="card">
  <div class="row"><div class="lbl">Workflow</div>
    <div class="pill p-draft"><div class="dot"></div>Drafting</div>
    <div class="pill p-review"><div class="dot"></div>In review</div>
    <div class="pill p-ready"><div class="dot"></div>Ready</div>
    <div class="pill p-blocked"><div class="dot"></div>Blocked</div>
    <div class="pill p-locked"><div class="dot"></div>Locked</div>
  </div>
  <div class="row"><div class="lbl">System</div>
    <div class="pill p-ai"><div class="dot"></div>AnA 1.0 RI</div>
    <div class="pill p-pro"><div class="dot"></div>Pro</div>
    <div class="pill" style="background: var(--accent-subtle); color: var(--accent-main-200)"><div class="dot" style="background: var(--accent-main-100)"></div>Beta</div>
  </div>
</div></body></html>
