<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.stack { display:flex; flex-direction:column; gap: 14px; }
.lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-subtle); margin-bottom: 6px; font-weight: 500;}
.input {
  width: 100%; box-sizing: border-box;
  padding: 10px 14px; background: white;
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  font-family: var(--font-sans); font-size: 13px; color: var(--ink);
  outline: none; transition: all 200ms var(--ease);
}
.input::placeholder { color: var(--ink-subtle); }
.input:focus { border-color: var(--accent-main-100); box-shadow: 0 0 0 3px var(--accent-subtle); }
.composer {
  background: white; border: 1px solid var(--border);
  border-radius: 16px; padding: 14px 14px 10px;
  box-shadow: 0 0 0 0 transparent;
}
.composer:focus-within { border-color: var(--border-strong); box-shadow: var(--shadow-glow); }
.composer-input {
  font-family: var(--font-sans); font-size: 15px; color: var(--ink);
  border: 0; outline: none; width: 100%; resize: none; background: transparent;
  min-height: 24px; padding: 0; line-height: 1.5;
}
.composer-actions { display:flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
.composer-actions .left { display: flex; gap: 4px; color: var(--ink-muted); align-items: center; }
.composer-actions .left svg { display: block; }
.chip { display:inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 9999px; font-size: 12px; font-weight: 500; color: var(--ink-body); background: var(--bg-050); }
.send { width: 30px; height: 30px; padding: 0; border-radius: 9999px; background: var(--accent-main-100); color: #fff; border:0; display:inline-flex; align-items:center; justify-content:center; cursor: pointer; }
</style></head><body><div class="card">
  <div class="stack">
    <div><div class="lbl">Text input · default</div>
      <input class="input" placeholder="Search your chats…" />
    </div>
    <div><div class="lbl">Chat composer · focused</div>
      <div class="composer">
        <div class="composer-input" contenteditable="true">Draft Section 2.5 clinical overview for NDA 212345</div>
        <div class="composer-actions">
          <div class="left">
            <div class="chip">AnA 1.0 RI</div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </div>
          <button class="send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
