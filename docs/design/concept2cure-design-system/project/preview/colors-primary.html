<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.pal { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
.sw { padding: 16px; border-radius: var(--radius-md); color: white; height: 88px; display:flex; flex-direction:column; justify-content:space-between; }
.sw .name { font-size:11px; font-weight:600; letter-spacing:0.02em; }
.sw .hex { font-family: var(--font-mono); font-size:11px; opacity:0.85; }
.sw.ink-dark { color: var(--ink); }
</style></head><body><div class="card">
  <div class="pal">
    <div class="sw" style="background:#d97757"><div class="name">Accent</div><div class="hex">#d97757</div></div>
    <div class="sw" style="background:#c15f3c"><div class="name">Accent / Hover</div><div class="hex">#c15f3c</div></div>
    <div class="sw ink-dark" style="background:#f5ddd4"><div class="name">Accent / Muted</div><div class="hex">#f5ddd4</div></div>
    <div class="sw ink-dark" style="background:#faf0ec"><div class="name">Accent / Subtle</div><div class="hex">#faf0ec</div></div>
    <div class="sw" style="background:#6a9bcc"><div class="name">AI (AnA)</div><div class="hex">#6a9bcc</div></div>
    <div class="sw" style="background:#5585b3"><div class="name">AI / Hover</div><div class="hex">#5585b3</div></div>
    <div class="sw ink-dark" style="background:#dce8f3"><div class="name">AI / Muted</div><div class="hex">#dce8f3</div></div>
    <div class="sw ink-dark" style="background:#ffffff;border:1px solid var(--border)"><div class="name">Canvas / Elev.</div><div class="hex">#ffffff</div></div>
  </div>
</div></body></html>
