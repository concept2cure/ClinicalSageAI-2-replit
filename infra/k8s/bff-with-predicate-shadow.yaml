# Reference manifest: Concept2Cure BFF + predicate-intelligence shadow sidecar.
#
# Two containers in one pod sharing localhost. The BFF reaches the shadow on
# http://localhost:8001. See docs/operations/predicate-intelligence-shadow-service.md
# for the rationale and SLO.
#
# This is a reference. The actual production manifests live in the deploy
# repository and pin images by digest, mount secrets via the cluster secret
# manager, and configure HPA targets that aren't represented here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: concept2cure-bff
  labels:
    app: concept2cure-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: concept2cure-bff
  template:
    metadata:
      labels:
        app: concept2cure-bff
    spec:
      restartPolicy: Always
      containers:
        # ─── BFF (Node + Express) ─────────────────────────────────────────
        - name: bff
          image: ghcr.io/concept2cure/clinicalsageai:REPLACE_WITH_DIGEST
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: SHADOW_SERVICE_URL
              value: "http://localhost:8001"
            - name: REVIEW_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: predicate-shadow-token
                  key: token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bff-database-url
                  key: url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/_ops/predicate-intelligence/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/_ops/predicate-intelligence/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
            initialDelaySeconds: 20

        # ─── Shadow service (Python FastAPI) ──────────────────────────────
        - name: predicate-shadow
          image: ghcr.io/concept2cure/predicate-shadow-service:REPLACE_WITH_DIGEST
          ports:
            - containerPort: 8001
              name: shadow
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: predicate-shadow-token
                  key: token
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # Slow liveness check — a flapping shadow during cold-start
          # universe load (≤ 60 s) must not pull the pod down.
          livenessProbe:
            httpGet:
              path: /predicate/health
              port: shadow
              httpHeaders:
                - name: X-Admin-Token
                  value: "from-token-secret"
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /predicate/health
              port: shadow
              httpHeaders:
                - name: X-Admin-Token
                  value: "from-token-secret"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: concept2cure-bff
spec:
  type: ClusterIP
  selector:
    app: concept2cure-bff
  ports:
    - name: http
      port: 80
      targetPort: 3000
