
sonar.projectKey=concept2cure_Concept2Cure.RI-2-replit
sonar.organization=concept2cure
sonar.projectName=Concept2Cure.RI

# Sources
sonar.sources=server,client/src,shared
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx

# Tests
sonar.tests=server,client/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info,client/coverage/lcov.info
# Mirror vitest.config.ts coverage.exclude: test/spec files plus entry points
# (**/index.ts) and pure type modules (**/types.ts). These are not unit-tested
# and otherwise skew the "coverage on new code" quality gate.
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx,**/index.ts,**/types.ts

# Language
sonar.sourceEncoding=UTF-8
